# Native builds need libxkbcommon (winit). The runtime .so.0 is installed but
# the -dev symlink is not, and there's no sudo here — point the linker at a
# local symlink. Web/wasm builds ignore this (no xkbcommon on wasm).
#
# target-dir: share Futhark's cargo cache. This example pins the same Rune
# rev at the same resolved path, so every dependency artifact (wgpu, parley,
# … — ~3.9 GB of compile) is reused instead of rebuilt.
[build]
rustflags = ["-L", "/home/dev/.local/lib"]
target-dir = "../futhark/target"
