<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="CALC//DECK — a cyberpunk field calculator. A native Rust app (Rune → WASM → WebGPU): a seven-segment neon readout, a synthwave city, sparks, a boot sequence, hex mode, an ICE alarm — one canvas, no fonts in the readout.">
<meta name="theme-color" content="#070714">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23070714'/%3E%3Cg stroke='%2338f2ff' stroke-width='7' stroke-linecap='round'%3E%3Cline x1='30' y1='22' x2='70' y2='22'/%3E%3Cline x1='26' y1='50' x2='74' y2='50'/%3E%3Cline x1='30' y1='78' x2='70' y2='78'/%3E%3Cline x1='27' y1='26' x2='27' y2='46'/%3E%3C/g%3E%3Cg stroke='%23ff38c4' stroke-width='7' stroke-linecap='round'%3E%3Cline x1='73' y1='54' x2='73' y2='74'/%3E%3C/g%3E%3C/svg%3E">
<title>CALC//DECK — cyberpunk field calculator</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: #070714; }
  #status { font: 15px ui-monospace, monospace; padding: 24px; color: #38f2ff; text-shadow: 0 0 12px rgba(56,242,255,.6); }
</style>
<div id="status">&gt; BOOTING CALC//DECK…</div>

<script type="module">
import init from './app.js';
try {
    if (!navigator.gpu) throw new Error('WebGPU requires a supported browser and HTTPS.');
    await init();
    document.querySelector('#status').remove();
} catch (error) {
    document.querySelector('#status').textContent = '> ' + error;
    console.error(error);
}
</script>
</html>
