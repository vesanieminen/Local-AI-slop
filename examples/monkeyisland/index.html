      const g2 = c.createGain(); g2.gain.value = 0.7;
      o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(out);
    } else if (kind === 'bells') {   // vibraphone-ish
      out = this.env(at, v, 0.01, Math.min(1.6, dur + 1.0));
      for (const [r, a] of [[1, 0.8], [2.76, 0.25], [5.4, 0.12]]) { const o = this.osc('sine', f * r, at, 1.8); const g = c.createGain(); g.gain.value = a; o.connect(g); g.connect(out); }
    } else if (kind === 'flute') {   // soft breathy counter-line
      out = this.env(at, v * 0.9, 0.06, dur + 0.15);
      const o = this.osc('sine', f, at, dur + 0.3);
      const h = c.createGain(); h.gain.value = 0.15; const oh = this.osc('sine', f * 2, at, dur + 0.3); oh.connect(h); h.connect(out);
      o.connect(out);
      const lfo = this.osc('sine', 5.4, at, dur + 0.3); const lg = c.createGain(); lg.gain.value = 4;
      lfo.connect(lg); lg.connect(o.detune);
    }
    out.connect(dest);
  }
  noiseSrc(at, dur) {
    const s = this.ctx.createBufferSource();
    s.buffer = this.noise; s.playbackRate.value = 1;
    s.start(at, Math.random() * 0.5, dur + 0.05);
    return s;
  }
  drum(e, at) {
    const c = this.ctx, p = e[2], v = (e[3] / 127) * 0.9;
    const kind = GM_DRUMS[p] || 'tom';
    const out = this.chGain['9'];
    if (kind === 'kick') {
      const g = this.env(at, v, 0.002, 0.22);
      const o = this.osc('sine', 150, at, 0.25);
      o.frequency.exponentialRampToValueAtTime(44, at + 0.12);
      o.connect(g); g.connect(out);
    } else if (kind === 'snare') {
      const g = this.env(at, v * 0.8, 0.002, 0.18);
      const n = this.noiseSrc(at, 0.2); const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1300;
      n.connect(hp); hp.connect(g);
      const o = this.osc('triangle', 190, at, 0.12); const og = c.createGain(); og.gain.value = v * 0.35; o.connect(og); og.connect(g);
      g.connect(out);
    } else if (kind === 'rim') {
      const g = this.env(at, v * 0.7, 0.001, 0.05);
      const o = this.osc('square', 1700, at, 0.05); o.connect(g); g.connect(out);
    } else if (kind === 'clap') {
      for (let i = 0; i < 3; i++) {
        const g = this.env(at + i * 0.012, v * 0.5, 0.001, 0.09);
        const n = this.noiseSrc(at + i * 0.012, 0.1); const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500;
        n.connect(bp); bp.connect(g); g.connect(out);
      }
    } else if (kind === 'hat') {
      const g = this.env(at, v * 0.35, 0.001, 0.045);
      const n = this.noiseSrc(at, 0.06); const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
      n.connect(hp); hp.connect(g); g.connect(out);
    } else if (kind === 'hatopen') {
      const g = this.env(at, v * 0.35, 0.001, 0.3);
      const n = this.noiseSrc(at, 0.32); const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6500;
      n.connect(hp); hp.connect(g); g.connect(out);
    } else if (kind === 'crash') {
      const g = this.env(at, v * 0.5, 0.002, 1.1);
      const n = this.noiseSrc(at, 1.15); const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4200;
      n.connect(hp); hp.connect(g); g.connect(out);
    } else if (kind === 'ride') {
      const g = this.env(at, v * 0.3, 0.001, 0.5);
      const n = this.noiseSrc(at, 0.5); const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
      n.connect(hp); hp.connect(g);
      const o = this.osc('sine', 520, at, 0.4); const og = c.createGain(); og.gain.value = 0.06 * v; o.connect(og); og.connect(g);
      g.connect(out);
    } else if (kind === 'cowbell') {
      const g = this.env(at, v * 0.4, 0.001, 0.22);
      for (const f of [540, 800]) { const o = this.osc('square', f, at, 0.22); const og = c.createGain(); og.gain.value = 0.25; o.connect(og); og.connect(g); }
      g.connect(out);
    } else if (kind === 'shaker') {
      const g = this.env(at, v * 0.22, 0.004, 0.06);
      const n = this.noiseSrc(at, 0.07); const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 6200; bp.Q.value = 1.5;
      n.connect(bp); bp.connect(g); g.connect(out);
    } else if (kind === 'conga') {
      const f = 170 + (p - 60) * 14;
      const g = this.env(at, v * 0.6, 0.003, 0.28);
      const o = this.osc('sine', f * 1.35, at, 0.3);
      o.frequency.exponentialRampToValueAtTime(f * 0.85, at + 0.12);
      o.connect(g); g.connect(out);
    } else if (kind === 'woodblock') { // bright high clicks (agogo-like tick)
      const g = this.env(at, v * 0.45, 0.001, 0.08);
      const n = this.noiseSrc(at, 0.06); const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 4;
      n.connect(bp); bp.connect(g);
      const o = this.osc('sine', 1180, at, 0.07); const og = c.createGain(); og.gain.value = v * 0.4; o.connect(og); og.connect(g);
      g.connect(out);
    } else if (kind === 'guiro') {    // short scrape
      const g = this.env(at, v * 0.3, 0.01, 0.15);
      const n = this.noiseSrc(at, 0.16); const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 2;
      n.connect(bp); bp.connect(g); g.connect(out);
    } else { // tom
      const f = 110 + (p - 45) * 13;
      const g = this.env(at, v * 0.7, 0.002, 0.3);
      const o = this.osc('sine', f * 1.3, at, 0.32);
      o.frequency.exponentialRampToValueAtTime(f * 0.75, at + 0.18);
      o.connect(g); g.connect(out);
    }
  }
  // beat phase 0..1 for visual sync (null when not playing)
  beatPhase() {
    if (!this.playing) return null;
    const el = this.ctx.currentTime - this.t0;
    if (el < 0) return null;
    return (el % this.beatSec) / this.beatSec;
  }
}

/* =====================================================================
   THE SCENE
   ===================================================================== */
const stage = document.getElementById('stage');
const fallback = document.getElementById('fallback');
const hint = document.getElementById('hint');

// standalone in a browser → fill the whole window (in the chat pane, stay 16:9-fit)
if (window.self === window.top) stage.classList.add('fullscreen');
window.addEventListener('dblclick', () => {
  try {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  } catch (e) {}
});

async function boot() {
  await (document.fonts ? document.fonts.load('72px "Pirata One"').catch(() => {}) : Promise.resolve());

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.domElement.id = 'scene';
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const FOG = new THREE.Color(0x10263f);
  scene.fog = new THREE.FogExp2(FOG.getHex(), 0.0068);
  const camera = new THREE.PerspectiveCamera(52, 16 / 9, 0.1, 800);

  /* ---------- helpers ---------- */
  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  const rand = (a, b) => a + Math.random() * (b - a);

  /* ---------- sky ---------- */
  const skyTex = canvasTex(1024, 600, (g, w, h) => {
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0.00, '#04081c');
    grad.addColorStop(0.35, '#0b1d44');
    grad.addColorStop(0.65, '#123a66');
    grad.addColorStop(0.85, '#1c5f83');
    grad.addColorStop(1.00, '#2b7f97');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 60; i++) { // wispy swirls
      const x = rand(0, w), y = rand(0, h * 0.8), r = rand(40, 160);
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      const a = rand(0.02, 0.055);
      rg.addColorStop(0, `rgba(110,150,210,${a})`);
      rg.addColorStop(1, 'rgba(110,150,210,0)');
      g.fillStyle = rg;
      g.save(); g.translate(x, y); g.rotate(rand(0, Math.PI)); g.scale(rand(1, 2.4), rand(0.35, 0.8));
      g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.restore();
    }
    const glow = g.createRadialGradient(w * 0.5, h * 0.52, 0, w * 0.5, h * 0.52, 260);
    glow.addColorStop(0, 'rgba(120,170,235,0.14)');
    glow.addColorStop(1, 'rgba(120,170,235,0)');
    g.fillStyle = glow; g.fillRect(0, 0, w, h);
  });
  const sky = new THREE.Mesh(
    new THREE.PlaneGeometry(1600, 900),
    new THREE.MeshBasicMaterial({ map: skyTex, fog: false, depthWrite: false, toneMapped: false })
  );
  sky.position.set(0, 120, -320);
  scene.add(sky);

  /* ---------- stars ---------- */
  {
    const N = 430, pos = new Float32Array(N * 3), seed = new Float32Array(N), size = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const a = rand(-0.2, Math.PI + 0.2), el = rand(0.16, 1.3);
      const r = 210;
      pos[i * 3] = Math.cos(a) * r * Math.cos(el);
      pos[i * 3 + 1] = Math.sin(el) * r * 0.8 + 18;
      pos[i * 3 + 2] = Math.sin(a) * r * Math.cos(el) - 60;
      seed[i] = Math.random();
      size[i] = rand(1.2, 4.2);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
    geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        attribute float aSeed; attribute float aSize;
        uniform float uTime; varying float vA;
        void main() {
          vA = 0.45 + 0.55 * (0.5 + 0.5 * sin(uTime * (0.7 + aSeed * 3.0) + aSeed * 40.0));
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * (0.8 + 0.5 * vA);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        varying float vA;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          float a = smoothstep(0.5, 0.12, d) * vA;
          gl_FragColor = vec4(vec3(0.85, 0.9, 1.0), a);
        }`
    });
    scene.add(new THREE.Points(geo, mat));
    scene.userData.starMat = mat;
  }

  /* ---------- distant mountain silhouettes ---------- */
  function ridgeTex(color) {
    return canvasTex(1024, 256, (g, w, h) => {
      g.fillStyle = color;
      g.beginPath(); g.moveTo(0, h);
      let x = 0;
      while (x < w) {
        const pw = rand(70, 190), ph = rand(0.35, 0.95);
        g.lineTo(x + pw * 0.5, h - h * ph * rand(0.75, 1));
        g.lineTo(x + pw, h - rand(20, 60));
        x += pw;
      }
      g.lineTo(w, h); g.closePath(); g.fill();
    });
  }
  for (const [z, col, w, h] of [[-190, '#111c38', 900, 88], [-140, '#152344', 820, 74]]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ map: ridgeTex(col), transparent: true, depthWrite: false, fog: false, toneMapped: false }));
    m.position.set(rand(-20, 20), h / 2 - 5, z);
    scene.add(m);
  }

  /* ---------- clouds ---------- */
  const cloudTex = canvasTex(256, 128, (g, w, h) => {
    for (let i = 0; i < 14; i++) {
      const x = rand(30, w - 30), y = rand(30, h - 30), r = rand(18, 46);
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, 'rgba(140,170,220,0.32)');
      rg.addColorStop(1, 'rgba(140,170,220,0)');
      g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
  });
  const clouds = [];
  for (let i = 0; i < 12; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: cloudTex, transparent: true, depthWrite: false, opacity: rand(0.22, 0.5), fog: false, toneMapped: false
    }));
    const sc = rand(22, 58);
    s.scale.set(sc, sc * 0.45, 1);
    s.position.set(rand(-180, 180), rand(40, 130), rand(-210, -70));
    s.userData.v = rand(0.5, 1.6);
    clouds.push(s); scene.add(s);
  }

  /* ---------- water ---------- */
  const waterUni = {
    uTime: { value: 0 },
    uDeep: { value: new THREE.Color(0x0a2a38) },
    uSky: { value: new THREE.Color(0x2a6e8c) },
    uFogColor: { value: FOG },
    uFogDensity: { value: 0.0068 },
    uGlowPos: { value: new THREE.Vector3(0, 0, 4) },
    uGlowColor: { value: new THREE.Color(0xffc061) }
  };
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(700, 700, 160, 160).rotateX(-Math.PI / 2),
    new THREE.ShaderMaterial({ /* same shader as before */
      uniforms: waterUni,
      vertexShader: `
        uniform float uTime;
        varying vec3 vWorldPos; varying vec3 vNormalW;
        float hsum(vec2 p, float t) {
          float s = 0.0;
          s += sin(p.x * 0.25 + t * 0.9) * 0.16;
          s += sin(p.y * 0.31 - t * 0.7) * 0.14;
          s += sin((p.x + p.y) * 0.52 + t * 1.4) * 0.07;
          s += sin((p.x - p.y) * 0.97 - t * 1.9) * 0.035;
          return s;
        }
        void main() {
          vec2 p = position.xz;
          float e = 0.6;
          float h = hsum(p, uTime);
          float hx = hsum(p + vec2(e, 0.0), uTime) - hsum(p - vec2(e, 0.0), uTime);
          float hz = hsum(p + vec2(0.0, e), uTime) - hsum(p - vec2(0.0, e), uTime);
          vec3 n = normalize(vec3(-hx / (2.0 * e), 1.0, -hz / (2.0 * e)));
          vec4 wp = modelMatrix * vec4(position.x, position.y + h, position.z, 1.0);
          vWorldPos = wp.xyz;
          vNormalW = normalize(mat3(modelMatrix) * n);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uDeep; uniform vec3 uSky; uniform vec3 uFogColor;
        uniform float uFogDensity; uniform vec3 uGlowPos; uniform vec3 uGlowColor;
        varying vec3 vWorldPos; varying vec3 vNormalW;
        void main() {
          vec3 N = normalize(vNormalW);
          vec3 V = normalize(cameraPosition - vWorldPos);
          vec3 L = normalize(vec3(-0.55, 0.75, 0.35));
          vec3 H = normalize(V + L);
          float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
          vec3 col = mix(uDeep, uSky, clamp(fres * 0.7 + 0.08, 0.0, 1.0));
          col += uSky * max(dot(N, L), 0.0) * 0.10;
          col += vec3(0.75, 0.85, 1.0) * pow(max(dot(N, H), 0.0), 160.0) * 1.1;
          col += vec3(1.0, 0.95, 0.85) * pow(max(dot(N, H), 0.0), 800.0) * 1.6;
          vec3 d = vWorldPos - uGlowPos;
          float glow = exp(-abs(d.x) * 0.10) * exp(-abs(d.z) * 0.09);
          float flick = 0.7 + 0.3 * sin(uTime * 3.1) * sin(uTime * 7.3);
          col += uGlowColor * glow * 0.35 * flick;
          float dist = length(cameraPosition - vWorldPos);
          float fogF = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
          col = mix(col, uFogColor, clamp(fogF, 0.0, 1.0));
          gl_FragColor = vec4(col, 1.0);
        }`
    })
  );
  scene.add(water);

  /* ---------- the island (heightfield with trimmed shore) ---------- */
  const ISLAND_Z = -2;
  function islandH(x, z) { // island-local coords
    let h = 17 * Math.exp(-Math.pow(Math.hypot(x, z) / 16.5, 2));
    h += 9 * Math.exp(-Math.pow(Math.hypot(x + 5, z + 3) / 9.5, 2));
    h += 7 * Math.exp(-Math.pow(Math.hypot(x - 11, z - 5) / 8.0, 2));
    h *= 1 + 0.10 * Math.sin(x * 0.55 + z * 0.4) + 0.06 * Math.sin(x * 1.2 - z * 0.8);
    h += 0.5 * Math.sin(x * 2.1 + 1.0) * Math.sin(z * 1.9) + 0.3 * Math.sin(x * 4.3 + 2.0) * Math.sin(z * 3.7);
    const d = Math.hypot(x, z);
    const trim = Math.max(0, 1 - Math.pow(d / 23, 2));
    return Math.max(0, h * trim * trim);
  }
  {
    const S = 62, SEG = 104;
    const geo = new THREE.PlaneGeometry(S, S, SEG, SEG).rotateX(-Math.PI / 2);
    const p = geo.attributes.position;
    const colors = new Float32Array(p.count * 3);
    const cLow = new THREE.Color(0x131d38), cMid = new THREE.Color(0x1b2848), cHigh = new THREE.Color(0x2c3c66);
    let hMax = 0;
    for (let i = 0; i < p.count; i++) {
      const h = islandH(p.getX(i), p.getZ(i));
      p.setY(i, h - 0.8);
      hMax = Math.max(hMax, h);
      const c = cLow.clone().lerp(h > hMax * 0.55 ? cHigh : cMid, Math.pow(h / Math.max(hMax, 1), 1.3));
      colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    const island = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.95, metalness: 0
    }));
    island.position.set(0, 0, ISLAND_Z);
    scene.add(island);
  }

  /* ---------- glowing cave at the peak ---------- */
  const peakY = islandH(0.5, -0.5);
  const glowTex = canvasTex(128, 128, (g, w, h) => {
    const rg = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    rg.addColorStop(0.0, 'rgba(255,215,130,0.8)');
    rg.addColorStop(0.25, 'rgba(255,180,80,0.55)');
    rg.addColorStop(1.0, 'rgba(255,150,50,0)');
    g.fillStyle = rg; g.fillRect(0, 0, w, h);
  });
  const caveGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, toneMapped: false
  }));
  caveGlow.scale.set(5.5, 5.5, 1);
  caveGlow.position.set(0.5, peakY + 0.4, ISLAND_Z - 0.5);
  scene.add(caveGlow);
  const caveLight = new THREE.PointLight(0xffc86a, 2.4, 70, 1.4);
  caveLight.position.copy(caveGlow.position);
  scene.add(caveLight);

  /* ---------- lights ---------- */
  scene.add(new THREE.HemisphereLight(0x35527e, 0x0a1322, 1.0));
  const moonLight = new THREE.DirectionalLight(0x8fa8d8, 1.35);
  moonLight.position.set(-25, 40, 18);
  scene.add(moonLight);
  const villageLight = new THREE.PointLight(0xffb45e, 1.6, 40, 1.5);
  villageLight.position.set(0, 4, 9);
  scene.add(villageLight);

  /* ---------- village ---------- */
  const windows = [];
  const hutBody = new THREE.MeshStandardMaterial({ color: 0x0d1528, roughness: 1 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x131c33, roughness: 1 });
  function hut(x, z, s) {
    const g = new THREE.Group();
    const y = islandH(x, z - ISLAND_Z);
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.4 * s, 1.0 * s, 1.0 * s), hutBody);
    body.position.y = 0.5 * s;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(1.15 * s, 0.9 * s, 4), roofMat);
    roof.position.y = 1.0 * s + 0.45 * s; roof.rotation.y = Math.PI / 4;
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.4 * s, 0.34 * s),
      new THREE.MeshBasicMaterial({ color: 0xffc46a, toneMapped: false }));
    win.position.set(0, 0.55 * s, 0.51 * s);
    g.add(body, roof, win);
    g.position.set(x, Math.max(y - 0.15, 0.1), z);
    g.rotation.y = rand(-0.4, 0.4);
    scene.add(g);
    windows.push({ mat: win.material, seed: rand(0, 10) });
  }
  for (let i = 0; i < 16; i++) hut(rand(-6, 6), rand(8.5, 13.5), rand(0.7, 1.15));
  const piling = new THREE.MeshStandardMaterial({ color: 0x0c1322, roughness: 1 });
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 1.3, 6), piling);
    m.position.set(rand(-6.5, 6.5), 0.55, rand(15.2, 16.6));
    scene.add(m);
  }

  /* ---------- ships (all beyond the island's shore trim) ---------- */
  const hullMat = new THREE.MeshStandardMaterial({ color: 0x0b1120, roughness: 0.9 });
  const darkSail = new THREE.MeshStandardMaterial({ color: 0x1a2438, roughness: 0.9, side: THREE.DoubleSide });
  const paleSail = new THREE.MeshStandardMaterial({ color: 0xb9cbe4, roughness: 0.8, side: THREE.DoubleSide });
  function ship(x, z, s, pale, lantern) {
    const g = new THREE.Group();
    const hull = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.55, 0.9), hullMat);
    hull.position.y = 0.15;
    const bow = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.9, 4), hullMat);
    bow.rotation.z = -Math.PI / 2; bow.position.set(1.9, 0.35, 0);
    const stern = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.75), hullMat);
    stern.position.set(-1.45, 0.55, 0);
    g.add(hull, bow, stern);
    for (const mx of [-0.5, 0.6]) {
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.055, 2.6, 6), hullMat);
      mast.position.set(mx, 1.4, 0);
      const sail = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 1.25), pale ? paleSail : darkSail);
      sail.position.set(mx + 0.08, 1.5, 0.02);
      g.add(mast, sail);
    }
    if (lantern) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, toneMapped: false
      }));
      sp.scale.set(1.2, 1.2, 1); sp.position.set(-1.45, 1.15, 0);
      g.add(sp);
    }
    g.scale.setScalar(s);
    g.position.set(x, 0.18, z);
    g.rotation.y = rand(-0.5, 0.5);
    scene.add(g);
    return { g, phase: rand(0, 7), amp: rand(0.12, 0.22) };
  }
  const ships = [
    ship(-17.5, 18.0, 1.05, true, true),
    ship(-12.5, 21.5, 1.25, false, false),
    ship(-23.0, 11.5, 0.8, true, false),
    ship(-6.0, 24.5, 0.7, false, true),
    ship(21.5, 9.0, 0.65, false, false)
  ];
  // clearance check: no ship may sit on the island's trimmed skirt
  for (const s of ships) {
    const h = islandH(s.g.position.x, s.g.position.z - ISLAND_Z);
    if (h > 0.4) s.g.position.z += 6; // nudge to open water
  }

  /* ---------- palms on a right islet ---------- */
  {
    const g = new THREE.Group();
    const mound = new THREE.Mesh(new THREE.SphereGeometry(1.6, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x101a30, roughness: 1, flatShading: true }));
    mound.scale.y = 0.35;
    g.add(mound);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x0e1728, roughness: 1 });
    for (const px of [-0.4, 0.5]) {
      const t = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 2.2, 6), trunkMat);
      t.position.set(px, 1.3, 0); t.rotation.z = rand(-0.25, 0.25);
      g.add(t);
      for (let k = 0; k < 6; k++) {
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.16, 1.1, 4), trunkMat);
        leaf.position.set(px + Math.cos(k) * 0.45, 2.35, Math.sin(k) * 0.45);
        leaf.rotation.set(Math.cos(k) * 1.3, 0, -Math.sin(k) * 1.3);
        g.add(leaf);
      }
    }
    g.position.set(24.5, 0, 9);
    scene.add(g);
  }

  /* ---------- sea mist ---------- */
  const mistTex = canvasTex(256, 256, (g, w, h) => {
    const rg = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    rg.addColorStop(0, 'rgba(150,190,225,0.55)');
    rg.addColorStop(1, 'rgba(150,190,225,0)');
    g.fillStyle = rg; g.fillRect(0, 0, w, h);
  });
  const mists = [];
  for (let i = 0; i < 5; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: mistTex, transparent: true, depthWrite: false, opacity: rand(0.08, 0.15), toneMapped: false
    }));
    s.scale.set(rand(25, 45), rand(6, 10), 1);
    s.position.set(rand(-30, 30), rand(0.6, 2.5), rand(6, 22));
    s.userData.v = rand(0.2, 0.6) * (Math.random() < 0.5 ? -1 : 1);
    mists.push(s); scene.add(s);
  }

  /* ---------- title logo: DOM overlay, never occluded ---------- */
  const logoEl = document.getElementById('logo');
  function drawLogoDOM() {
    const W = 1000, H = 600;
    const g = logoEl.getContext('2d');
    g.clearRect(0, 0, W, H);
    const F = (px) => `${px}px "Pirata One", Georgia, serif`;
    g.textAlign = 'center';
    g.lineJoin = 'round';
    // THE SECRET OF
    g.font = F(56);
    try { g.letterSpacing = '6px'; } catch (e) {}
    g.fillStyle = '#e07a2a';
    g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 8;
    g.fillText('THE SECRET OF', 505, 122);
    g.shadowBlur = 0;
    try { g.letterSpacing = '0px'; } catch (e) {}
    // banner ribbon — drawn first so ISLAND's lower edge overlaps it, like the original
    const bx1 = 140, bx2 = 860, rby = 452, bh = 112;
    g.beginPath();
    g.moveTo(bx1, rby + 8);
    g.quadraticCurveTo(W / 2, rby - 16, bx2, rby + 8);
    g.lineTo(bx2 - 30, rby + bh / 2);
    g.lineTo(bx2, rby + bh);
    g.quadraticCurveTo(W / 2, rby + bh + 14, bx1, rby + bh);
    g.lineTo(bx1 + 30, rby + bh / 2);
    g.closePath();
    const bg = g.createLinearGradient(0, rby, 0, rby + bh);
    bg.addColorStop(0, '#f7ecc0'); bg.addColorStop(1, '#e0c783');
    g.fillStyle = bg; g.fill();
    g.strokeStyle = '#8a6a2f'; g.lineWidth = 3; g.stroke();
    g.font = F(50);
    try { g.letterSpacing = '3px'; } catch (e) {}
    g.fillStyle = '#3a2205';
    g.fillText('SPECIAL EDITION', 500, rby + 76);
    try { g.letterSpacing = '0px'; } catch (e) {}
    // MONKEY + ISLAND on top, auto-scaled to fit
    const grad = g.createLinearGradient(0, 140, 0, 490);
    grad.addColorStop(0, '#ff9d2e');
    grad.addColorStop(1, '#ffe45c');
    let islandRight = 800, islandBase = 478;
    for (const [word, cx, by, maxw] of [['MONKEY', 515, 316, 740], ['ISLAND', 485, 478, 700]]) {
      let size = 250;
      g.font = F(size);
      while (g.measureText(word).width > maxw) { size -= 6; g.font = F(size); }
      g.shadowColor = 'rgba(255,150,50,.5)'; g.shadowBlur = 30;
      g.strokeStyle = '#5f2a08'; g.lineWidth = 14;
      g.strokeText(word, cx, by);
      g.fillStyle = grad;
      g.fillText(word, cx, by);
      g.shadowBlur = 0;
      if (word === 'ISLAND') { islandRight = cx + g.measureText(word).width / 2; islandBase = by; }
    }
    g.font = F(26);
    g.fillStyle = '#e8b84a';
    g.fillText('™', islandRight + 12, islandBase - 6);
  }
  drawLogoDOM();

  /* ---------- camera rig ---------- */
  const cam = { azU: 0, elU: 0, azT: 0, elT: 0, drag: false, px: 0, py: 0 };
  const el = renderer.domElement;
  el.addEventListener('pointerdown', (e) => { cam.drag = true; cam.px = e.clientX; cam.py = e.clientY; });
  window.addEventListener('pointerup', () => { cam.drag = false; });
  window.addEventListener('pointermove', (e) => {
    if (!cam.drag) return;
    cam.azT += (e.clientX - cam.px) * 0.005;
    cam.elT += (e.clientY - cam.py) * 0.003;
    cam.elT = Math.max(-0.22, Math.min(0.42, cam.elT));
    cam.azT = Math.max(-0.9, Math.min(0.9, cam.azT));
    cam.px = e.clientX; cam.py = e.clientY;
    hint.style.opacity = '0';
  });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight || (w * 9 / 16);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  /* ---------- start / mute / title controls ---------- */
  const music = new Calypso(THEME);
  let started = false;
  const controls = document.getElementById('controls');

  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!music.ctx) return;
    music.muted = !music.muted;
    music.applyMute();
    muteBtn.classList.toggle('muted', music.muted);
    muteBtn.textContent = music.muted ? '♪ music off' : '♪ music on';
  });

  const titleBtn = document.getElementById('titleBtn');
  titleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const hidden = logoEl.classList.toggle('hidden');
    titleBtn.textContent = hidden ? 'Aa show title' : 'Aa hide title';
    titleBtn.classList.toggle('off', hidden);
  });

  const startOverlay = document.getElementById('startOverlay');
  document.getElementById('startBtn').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (started) return;
    started = true;
    startOverlay.classList.add('off');
    logoEl.classList.remove('hidden');
    controls.classList.remove('hidden');
    hint.style.opacity = '1';
    try { await music.start(); } catch (err) { console.warn('music could not start:', err); }
    setTimeout(() => { hint.style.opacity = '0'; }, 7000);
  });

  /* ---------- animate ---------- */
  const clock = new THREE.Clock();
  const lookAt = new THREE.Vector3(0, 7.0, -8);
  let tAnim = 0;
  renderer.setAnimationLoop(() => {
    const dt = clock.getDelta();
    if (started) tAnim += dt; // scene stays frozen until the adventure starts
    const t = tAnim;
    waterUni.uTime.value = t;
    scene.userData.starMat.uniforms.uTime.value = t;

    const beat = music.beatPhase();
    const pulse = beat !== null ? Math.pow(Math.max(0, Math.sin(Math.PI * 2 * (beat + 0.5) / 2)), 3) : 0;

    // camera
    cam.azU += (cam.azT - cam.azU) * 0.05;
    cam.elU += (cam.elT - cam.elU) * 0.05;
    const az = Math.sin(t * 0.07) * 0.26 + cam.azU;
    const R = 38 + Math.sin(t * 0.11) * 1.5;
    camera.position.set(
      Math.sin(az) * R,
      6.2 + Math.sin(t * 0.05) * 0.9 + cam.elU * R * 0.5,
      Math.cos(az) * R + 4
    );
    if (camera.position.y < 1.4) camera.position.y = 1.4;
    camera.lookAt(lookAt);

    // logo overlay: static, always fully visible

    // cave flicker
    const fl = 2.2 + Math.sin(t * 6.3) * 0.4 + Math.sin(t * 13.1) * 0.25 + pulse * 0.5;
    caveLight.intensity = fl;
    caveGlow.scale.setScalar(5.0 + Math.sin(t * 5.1) * 0.4 + pulse * 0.6);

    // windows flicker
    for (const w of windows) {
      let g = 0.55 + 0.35 * Math.sin(t * (0.8 + w.seed * 0.4) + w.seed);
      if (Math.sin(t * 0.5 + w.seed * 3) > 0.995) g *= 0.45;
      w.mat.color.setRGB(1.0 * g, 0.78 * g, 0.42 * g);
    }
    villageLight.intensity = 1.5 + Math.sin(t * 2.1) * 0.18 + pulse * 0.4;

    // ships bob
    for (const s of ships) {
      s.g.position.y = 0.18 + Math.sin(t * 0.9 + s.phase) * s.amp;
      s.g.rotation.z = Math.sin(t * 0.7 + s.phase) * 0.035;
    }

    // clouds & mist drift
    for (const c of clouds) {
      c.position.x += c.userData.v * 0.016;
      if (c.position.x > 180) c.position.x = -180;
    }
    for (const m of mists) {
      m.position.x += m.userData.v * 0.016;
      if (m.position.x > 45) m.position.x = -45;
      if (m.position.x < -45) m.position.x = 45;
    }

    renderer.render(scene, camera);
  });
}

boot().catch((err) => {
  console.error(err);
  fallback.style.display = 'grid';
});
</script>
</body>
</html>
