// ---------------------------------------------------------------- rng
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------- sprites
function makeSprite(rows) {
  var h = rows.length, w = rows[0].length;
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var g = c.getContext('2d');
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    var ch = rows[y][x];
    if (ch === '.' || ch === ' ') continue;
    var ci = SPR_CHARS[ch];
    if (ci === undefined) continue;
    g.fillStyle = PAL[ci];
    g.fillRect(x, y, 1, 1);
  }
  return c;
}

function textW(s, sc) { return s.length * 6 * sc - sc; }
function drawText(s, x, y, ci, sc) {
  sc = sc || 1;
  s = s.toUpperCase();
  ctx.fillStyle = PAL[ci];
  for (var i = 0; i < s.length; i++) {
    var gl = FONT[s[i]]; if (!gl) continue;
    var gx = x + i * 6 * sc;
    for (var r = 0; r < 7; r++) for (var c = 0; c < 5; c++) {
      if (gl[r][c] === '1') ctx.fillRect(gx + c * sc, y + r * sc, sc, sc);
    }
  }
}
function drawTextC(s, cx, y, ci, sc) { drawText(s, Math.round(cx - textW(s, sc) / 2), y, ci, sc); }
function draw3D(s, x, y, sc, dropCi) {  // silver extruded letters, like the box logo
  var i, j;
  drawText(s, x + 2 * sc, y + 2 * sc, dropCi === undefined ? C_MAG : dropCi, sc);
  for (i = -1; i <= 1; i++) for (j = -1; j <= 1; j++)
    if (i || j) drawText(s, x + i, y + j, C_BLACK, sc);
  drawText(s, x - 1, y - 1, C_WHITE, sc);
  drawText(s, x, y, C_LGRAY, sc);
}

// ---------------------------------------------------------------- audio
var AC = null, master = null, musicOn = false;
function ensureAudio() {
  if (AC || NO_AUDIO) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.42;
    master.connect(AC.destination);
    musicOn = true;
    musicResync();
  } catch (e) { /* silent demo is still a demo */ }
}
function fm(t, f0, f1, dur, carrier, depth, vol, type) {
  if (!AC) return;
  var c = AC.createOscillator(), m = AC.createOscillator(), mg = AC.createGain(), g = AC.createGain();
  c.type = type || 'sine'; m.type = 'sine';
  c.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) c.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  m.frequency.setValueAtTime(f0 * 3 + 40, t);
  mg.gain.setValueAtTime(depth, t);
  mg.gain.exponentialRampToValueAtTime(1, t + dur);
  m.connect(mg); mg.connect(c.frequency);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  c.connect(g); g.connect(master);
  c.start(t); m.start(t); c.stop(t + dur + .02); m.stop(t + dur + .02);
}
function noiseHit(t, dur, vol, hp) {
  if (!AC) return;
  var n = AC.createBufferSource(), buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate),
      d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  n.buffer = buf;
  var f = AC.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp || 1200;
  var g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(f); f.connect(g); g.connect(master);
  n.start(t); n.stop(t + dur);
}

  kill: function () { var t = AC.currentTime; fm(t, 700, 90, 0.20, 2, 300, 0.35, 'square'); noiseHit(t, 0.08, 0.18, 900); },
  item: function () { var t = AC.currentTime; fm(t, 660, 660, 0.07, 1, 90, 0.30); fm(t + .07, 990, 990, 0.09, 1, 90, 0.30); },

    }
  } else {
    if (want > 0) { keen.vx = Math.min(2.1, keen.vx + 0.18); keen.face = 1; }
    else if (want < 0) { keen.vx = Math.max(-2.1, keen.vx - 0.18); keen.face = -1; }
    else { keen.vx *= 0.76; if (Math.abs(key_vx_guard()) < 0.06) keen.vx = 0; }
  }
  // idle -> point, then lie flat and shoot (authentic Keen habit)
  if (!keen.flat && keen.onG && want === 0) {
    if (++keen.idle >= 22 && keen.hunt) { setFlat(true); keen.flatT = 0; }
  } else if (want !== 0) keen.idle = 0;

  if (wantJump && keen.onG && !keen.flat) { keen.vy = -6.3; sfx.jump(); }
  keen.anim += Math.abs(key_vx_guard());
}
function key_vx_guard() { return keen ? keen.vx : 0; }

// ---------------------------------------------------------------- foes
function foesUpdate() {
  for (var i = 0; i < foes.length; i++) {
    var f = foes[i];
    if (!f.alive) continue;
    if (f.type === 'V') {
      f.vx = f.dir * 0.35;
      collideX(f);
      if (f.hitWall) f.dir = -f.dir;
      var footX = f.dir > 0 ? f.x + f.w + 1 : f.x - 1;
      if (f.onG && !solid(Math.floor(footX / T), Math.floor((f.y + f.h + 2) / T))) f.dir = -f.dir;
      if (Math.abs(f.x + f.w / 2 - f.home) > 30 && f.onG) f.dir = f.x + f.w / 2 > f.home ? -1 : 1;
      f.vy = Math.min(7, f.vy + 0.32);
      collideY(f);
      if (--f.hopT <= 0 && f.onG) { f.vy = -2.3; f.hopT = 70 + (f.anim % 40); }
      f.anim++;
    } else {
      if (--f.cd <= 0 && keen && !keen.dead) {
        var kx = keen.x + keen.w / 2, kb2 = keen.y + keen.h / 2;
        var dx = kx - (f.x + 2), dy = kb2 - (f.y + 6), len = Math.sqrt(dx * dx + dy * dy);
        if (len > 45 && len < 170 && f.x > cam - 40 && f.x < cam + 360) {
          eshots.push({ x: f.x + 2, y: f.y + 6, w: 7, h: 7, vx: dx / len * 1.2, vy: dy / len * 1.2, ttl: 320 });
          f.cd = 185 + (f.anim++ * 7) % 60;
        } else f.cd = 40;
      }
    }
  }
}
function shotsUpdate() {
  var i;
  for (i = shots.length - 1; i >= 0; i--) {
    var s = shots[i];
    s.x += s.vx; s.ttl--;
    var tx = Math.floor((s.x + (s.vx > 0 ? s.w : 0)) / T), ty = Math.floor((s.y + 2) / T);
    if (solid(tx, ty) || s.ttl <= 0 || s.x < cam - 40 || s.x > cam + W + 40) { shots.splice(i, 1); continue; }
    var hit = false;
    for (var j = 0; j < foes.length; j++) {
      var f = foes[j];
      if (!f.alive) continue;
      if (aabb(s, f)) {
        f.alive = false; hit = true;
        score = (score + 200) % 1000000;
        pops.push({ x: f.x, y: f.y - 8, txt: '+200', ttl: 70 });
        for (var p = 0; p < 7; p++)
          parts.push({ x: f.x + f.w / 2, y: f.y + f.h / 2, vx: (Math.random() - 0.5) * 2.6, vy: -Math.random() * 2.4, ci: p % 2 ? C_MAG : C_PINK, ttl: 40 });
        sfx.kill();
        break;
      }
    }
    if (hit) shots.splice(i, 1);
  }
  for (i = eshots.length - 1; i >= 0; i--) {
    var b = eshots[i];
    b.x += b.vx; b.y += b.vy; b.ttl--;
    if (solid(Math.floor((b.x + 3) / T), Math.floor((b.y + 3) / T)) || b.ttl <= 0 || b.x < cam - 60 || b.x > cam + W + 60 || b.y > VH)
      eshots.splice(i, 1);
  }
}
function itemsUpdate() {
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.taken || !keen || keen.dead) continue;
    if (aabb(keen, it)) {
      it.taken = true;
      if (it.type === 'c') { score = (score + 500) % 1000000; pops.push({ x: it.x, y: it.y - 6, txt: '+500', ttl: 70 }); sfx.item(); }
      else { lives = Math.min(99, lives + 1); pops.push({ x: it.x, y: it.y - 6, txt: '1UP', ttl: 80 }); sfx.life(); }
    }
  }
}
function keenHazards() {
  if (!keen || keen.dead) return;
  var i;
  for (i = 0; i < foes.length; i++) if (foes[i].alive && aabb(keen, foes[i])) return die();
  for (i = 0; i < eshots.length; i++) if (aabb(keen, eshots[i])) return die();
  var tx0 = Math.floor(keen.x / T), tx1 = Math.floor((keen.x + keen.w - 1) / T);
  var ty0 = Math.floor(keen.y / T), ty1 = Math.floor((keen.y + keen.h - 1) / T);
  for (var tx = tx0; tx <= tx1; tx++) for (var ty = ty0; ty <= ty1; ty++) if (isIck(tx, ty)) return die();
  if (keen.y > VH + 6) return die();
}
function die() {
  state = 'dying'; stateT = 0; deathsTotal++;
  setFlat(false);
  keen.dead = true; keen.vx = 0; keen.vy = -4.2;
  sfx.death();
}

// ---------------------------------------------------------------- state machine
function startCard() { state = 'card'; stateT = 0; sfx.tick(); }
function updatePlay() {
  keenAct();
  keen.vy = Math.min(7, keen.vy + 0.32);
  collideX(keen); collideY(keen);
  foesUpdate(); shotsUpdate(); itemsUpdate(); keenHazards();
  if (state === 'play' && doorRect && keen && !keen.dead && aabb(keen, doorRect)) {
    state = 'door'; stateT = 0; sfx.door();
  }
  var target = clamp(keen ? keen.x - 140 : cam, 0, mapW * T - W);
  cam += (target - cam) * 0.09;
}
function updateDying() {
  stateT++;
  keen.vy += 0.3; keen.y += keen.vy;
  if (keen.y + 7 > VH - 2 && keen.vy > 0) keen.vy *= -0.55;
  if (stateT >= 150) {
    lives--;
    if (lives > 0) { resetLevel(); state = 'play'; stateT = 0; }
    else { state = 'gameover'; stateT = 0; }
  }
}
function updateDoor() {
  stateT++;
  if (doorRect) keen.x += 0.55;
  if (stateT >= 60) {
    levelIdx++;
    if (levelIdx >= LEVELS.length) { levelIdx = 0; loops++; }
    startCard();
  }
}

// ---------------------------------------------------------------- render
function blit(img, x, y, flip, alpha) {
  x = Math.round(x); y = Math.round(y);
  if (alpha !== undefined && alpha < 1) { ctx.save(); ctx.globalAlpha = Math.max(0.05, alpha); }
  if (!flip) ctx.drawImage(img, x, y);
  else { ctx.save(); ctx.translate(x + img.width, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); ctx.restore(); }
  if (alpha !== undefined && alpha < 1) ctx.restore();
}
var ASTEROIDS = [{ x: 420, y: 22 }, { x: 980, y: 64 }, { x: 1650, y: 30 }, { x: 2260, y: 74 }];
var TWINKLES = [{ x: 190, y: 34 }, { x: 760, y: 18 }, { x: 1500, y: 44 }, { x: 2150, y: 22 }, { x: 2650, y: 40 }];

function drawWorld() {
  ctx.save();
  ctx.beginPath(); ctx.rect(0, BAR, W, VH); ctx.clip();
  ctx.drawImage(SKY[theme], 0, BAR);
  var o1 = ((cam * 0.18) % 640 + 640) % 640, o2 = ((cam * 0.32) % 640 + 640) % 640, i;
  ctx.drawImage(STARS_FAR, -o1, BAR); ctx.drawImage(STARS_FAR, 640 - o1, BAR);
  ctx.drawImage(STARS_NEAR, -o2, BAR); ctx.drawImage(STARS_NEAR, 640 - o2, BAR);
  if (theme === 'space') {
    blit(EARTH, 20 - cam * 0.3, BAR + 62);
    for (i = 0; i < ASTEROIDS.length; i++)
      blit(ASTEROID, ASTEROIDS[i].x - cam * 0.55, ASTEROIDS[i].y + BAR);
  } else {
    var hx = 1960 - cam * 0.92;
    if (hx < W && hx > -150) {
      var a = clamp((W - hx) / 140, 0, 1);
      ctx.save(); ctx.globalAlpha = Math.max(0.08, a) * 0.92;
      blit(BOSS_HEAD, hx, BAR + 16);
      ctx.restore();
    }
  }
  for (i = 0; i < TWINKLES.length; i++)
    blit(SPARK, TWINKLES[i].x - cam * 0.4, TWINKLES[i].y + BAR);

  // tiles
  var c0 = Math.max(0, Math.floor(cam / T)), c1 = Math.min(mapW - 1, Math.floor((cam + W) / T));
  for (var cx2 = c0; cx2 <= c1; cx2++) for (var ry = 0; ry < 11; ry++) {
    var ch = grid[ry][cx2], sx = cx2 * T - Math.round(cam), sy = ry * T + BAR;
    if (ch === '#') ctx.drawImage(TILE_ROCK, sx, sy);
    else if (ch === '=') ctx.drawImage(TILE_METAL, sx, sy);
    else if (ch === '^') ctx.drawImage(TILE_ICK, sx, sy);
  }
  if (doorRect) blit(DOOR, doorRect.x - cam, doorRect.y + BAR);
  // items
  for (i = 0; i < items.length; i++) {
    var it = items[i]; if (it.taken) continue;
    blit(it.type === 'c' ? CUP : ONEUP, it.x - cam, it.y + BAR);
  }
  // foes
  for (i = 0; i < foes.length; i++) {
    var f = foes[i]; if (!f.alive) continue;
    if (f.type === 'V') blit(f.anim % 20 < 10 ? VORT1 : VORT2, f.x - 1 - cam, f.y + f.h - 16 + BAR);
    else blit(VGUN, f.x - 3 - cam, f.y - 2 + BAR, f.x + f.w / 2 < keen.x);
  }
  // shots
  for (i = 0; i < shots.length; i++) blit(BULLET, shots[i].x - cam, shots[i].y + BAR, shots[i].vx < 0);
  for (i = 0; i < eshots.length; i++) blit(EBULLET, eshots[i].x - cam, eshots[i].y + BAR);
  // keen
  if (keen) {
    var spr, flip = keen.face === 1, ky;
    if (keen.dead) { spr = KEEN_DEAD; ky = keen.y; }
    else if (keen.flat) { spr = KEEN_FLAT; ky = keen.y + keen.h - 11; }
    else if (!keen.onG) { spr = KEEN_JUMP; ky = keen.y + keen.h - 27; }
    else { spr = (Math.floor(keen.anim / 8) % 2 && Math.abs(keen.vx) > 0.4) ? KEEN_WALK : KEEN_IDLE; ky = keen.y + keen.h - 31; }
    var kxp = keen.x + keen.w / 2 - spr.width / 2 - cam;
    var alpha = state === 'door' ? 1 - stateT / 60 : undefined;
    blit(spr, kxp, ky + BAR, keen.dead ? false : flip, alpha);
  }
  // particles + popups
  for (i = 0; i < parts.length; i++) {
    var p = parts[i];
    ctx.fillStyle = PAL[p.ci];
    ctx.fillRect(Math.round(p.x - cam), Math.round(p.y + BAR), 2, 2);
  }
  for (i = 0; i < pops.length; i++) {
    var po = pops[i];
    drawText(po.txt, Math.round(po.x - cam), Math.round(po.y + BAR), C_PINK, 1);
  }
  ctx.restore();
  drawHUD();
}
function pad(n, len) { var s = String(n); while (s.length < len) s = '0' + s; return s; }
function drawHUD() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, BAR);
  ctx.fillStyle = PAL[C_DGRAY]; ctx.fillRect(0, BAR - 1, W, 1);
  ctx.drawImage(HEAD, 4, 4);
  drawText('X' + pad(lives, 2), 24, 9, C_CYAN, 1);
  drawText('SCORE', 58, 9, C_BLUE, 1);
  drawText(pad(score, 6), 96, 9, C_LBLUE, 1);
  ctx.drawImage(GUNICO, 148, 8);
  drawText('RAY GUN', 164, 9, C_LGRAY, 1);
  drawText('EPISODE 4', 234, 9, C_GREEN, 1);
}

function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (state === 'title') { renderTitle(); return; }
  if (state === 'card') { renderCard(); return; }
  if (state === 'gameover') { renderGameOver(); return; }
  if (state === 'play' || state === 'dying' || state === 'door') drawWorld();
}
function renderTitle() {
  ctx.drawImage(SKY.space, 0, 0);
  var i;
  for (i = 0; i < 20; i++) ctx.drawImage(TILE_ROCK, i * 16, H - 16);
  blit(EARTH, -46, H - 128);
  blit(KEEN_IDLE, 130, H - 16 - 31, true);
  blit(VORT1, 186, H - 16 - 16);
  draw3D('COMMANDER KEEN', (W - textW('COMMANDER KEEN', 3)) / 2 | 0, 20, 3);
  drawTextC('THE GALAXY FRANGETRAP', 160, 56, C_LRED, 1);
  if (frame % 40 < 26) drawTextC('PRESS ANY KEY TO START', 160, 78, C_WHITE, 1);
  drawTextC('THIS DEMO PLAYS ITSELF', 160, 94, C_CYAN, 1);
  drawTextC('ARROWS MOVE  SPACE FIRES', 160, 108, C_LGRAY, 1);
  drawTextC('FAN TRIBUTE - ONE FILE - 16 COLORS', 160, 156, C_DGRAY, 1);
}
function renderCard() {
  drawTextC(LEVELS[levelIdx].label, 160, 58, C_CYAN, 1);
  var name = LEVELS[levelIdx].name;
  var sc = textW(name, 3) <= 308 ? 3 : 2;
  draw3D(name, (W - textW(name, sc)) / 2 | 0, 76, sc);
  if (frame % 40 < 26) drawTextC('GET READY', 160, 128, C_PINK, 1);
}
function renderGameOver() {
  if (frame % 30 < 20) draw3D('GAME OVER', (W - textW('GAME OVER', 3)) / 2 | 0, 70, 3, C_BLUE);
  drawTextC('SCORE ' + pad(score, 6), 160, 120, C_CYAN, 1);
  drawTextC('THE COUNCIL WAITS', 160, 140, C_LGRAY, 1);
}

// ---------------------------------------------------------------- loop / probe
function step() {
  frame++;
  if (state === 'title') { stateT++; if (stateT > 300) startCard(); }
  else if (state === 'card') { stateT++; if (stateT >= 150) { resetLevel(); state = 'play'; stateT = 0; } }
  else if (state === 'play') updatePlay();
  else if (state === 'dying') updateDying();
  else if (state === 'door') updateDoor();
  else if (state === 'gameover') {
    stateT++;
    if (stateT > 260) { score = 0; lives = 3; state = 'title'; stateT = 0; }
  }
  // particles & popups
  if (parts.length) for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.18; if (--p.ttl <= 0) parts.splice(i, 1);
  }
  if (pops.length) for (var j = pops.length - 1; j >= 0; j--) {
    var po = pops[j]; po.y -= 0.35; if (--po.ttl <= 0) pops.splice(j, 1);
  }
  probe();
}
function probe() {
  var alive = 0, i;
  for (i = 0; i < foes.length; i++) if (foes[i].alive) alive++;
  window.__demo = {
    frame: frame, state: state, level: levelIdx, levelName: LEVELS[levelIdx].name,
    loops: loops, deaths: deathsTotal, score: score, lives: lives,
    foesAlive: alive, shots: shots.length + eshots.length,
    keenX: keen ? Math.round(keen.x) : 0, cam: Math.round(cam), audio: !!AC
  };
}

// audio fns need AC — wrap so silent runs never crash
(function () {
  for (var k in sfx) (function (fn) {
    sfx[k] = function () { if (AC) { try { fn(); } catch (e) { /* noop */ } } };
  })(sfx[k]);
})();

// ---------------------------------------------------------------- input / boot
var KEYMAP = {
  ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
  ArrowUp: 'jump', w: 'jump', W: 'jump', z: 'jump', Z: 'jump',
  ' ': 'fire', Control: 'fire', f: 'fire', F: 'fire'
};
document.addEventListener('keydown', function (e) {
  ensureAudio();
  if (state === 'title' && stateT > 40) stateT = 301;
  var k = KEYMAP[e.key];
  if (k) { keys[k] = true; manualUntil = performance.now() + 3000; }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) e.preventDefault();
});
document.addEventListener('keyup', function (e) {
  var k = KEYMAP[e.key];
  if (k) keys[k] = false;
});
window.addEventListener('pointerdown', function () {
  ensureAudio();
  if (state === 'title' && stateT > 40) stateT = 301;
});

function fit() {
  var s = Math.min(window.innerWidth / W, window.innerHeight / H);
  s = Math.max(0.4, s);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

if (SKIP_TITLE) stateT = 301;
for (var ffi = 0; ffi < FF; ffi++) step();

var last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  acc += Math.min(120, now - last); last = now;
  var n = 0;
  while (acc >= 1000 / 60 && n < 5) { step(); acc -= 1000 / 60; n++; }
  render();
}
requestAnimationFrame(loop);
</script>
</body>
