<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Futhark — the Elder Futhark hewn in fire. A native Rust app (Rune → WASM → WebGPU): runes chiselled into stone slabs of a magma-lit dwarven hall, drawn on one canvas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231b1611'/%3E%3Cg stroke='%23ff8b2b' stroke-width='8' stroke-linecap='round'%3E%3Cline x1='35' y1='15' x2='35' y2='85'/%3E%3Cline x1='35' y1='30' x2='70' y2='12'/%3E%3Cline x1='35' y1='55' x2='70' y2='37'/%3E%3C/g%3E%3C/svg%3E">
<title>Futhark — the elder futhark</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: #100c09; }
  #status { font: 16px system-ui; padding: 24px; color: #cbb992; }
</style>
<div id="status">Stoking the forge…</div>

<script type="module">
import init from './app.js';
try {
    if (!navigator.gpu) throw new Error('WebGPU requires a supported browser and HTTPS.');
    await init();
    document.querySelector('#status').remove();
} catch (error) {
    document.querySelector('#status').textContent = String(error);
    console.error(error);
}
</script>
</html>
