[package]
name = "futhark"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rune = { path = "rune/crates/rune" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = false
strip = "debuginfo"
