<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Deluxe Ski Jump — Gore Edition</title>
<meta name="description" content="The classic Finnish ski jumping game rebuilt for phones — with ultra gore. Time your takeoff, lean through the flight, hit the telemark... and explode into a fountain of blood when you hit the ground." />
<style>
  html, body { margin: 0; height: 100%; background: #06070c; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    gap: 8px;
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    background: #000;
    width: min(100vw, calc((100vh - 120px) * 1.3333));
    height: auto;
  }
  #pad {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none; justify-content: space-between; align-items: flex-end;
    padding: 0 calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    gap: 10px; pointer-events: none;
    max-width: 900px; margin: 0 auto; left: 50%; transform: translateX(-50%); width: 100%; box-sizing: border-box;

  @media (pointer: coarse) { #pad { display: flex; } }
  .btn {
    pointer-events: auto; touch-action: none;
    font-family: ui-monospace, monospace; font-weight: 700;
    color: #fff; border: 3px solid rgba(255,255,255,.55); border-radius: 16px;
    background: rgba(10,30,70,.5); backdrop-filter: blur(2px);
    min-width: 26vw; max-width: 300px; flex: 1;
    min-height: 76px; font-size: 13px; line-height: 1.2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    opacity: .78;
  }
  .btn b { font-size: 24px; }
  .btn.on { background: rgba(240,60,60,.55); opacity: 1; transform: scale(.96); }
  #fire { min-height: 96px; min-width: 30vw; border-radius: 999px; background: rgba(120,20,30,.55); border-color: #ff7a7a; opacity: .92; }
  #mute {
    position: fixed; top: calc(6px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
    z-index: 5; pointer-events: auto;
    font-size: 18px; background: rgba(0,0,0,.45); color: #fff;
    border: 2px solid #555; border-radius: 8px; padding: 6px 10px; touch-action: none;
  }
</style>
</head>
<body>
<canvas id="screen" width="400" height="300"></canvas>
<div id="pad">

   Two-button remake: [down] crouch-takeoff + lean forward, [up] telemark land.
   Every ground contact sprays blood. Crashes are R-rated carnage.
   One file. No assets. No network.

// gore + particle world

// ---------------------------------------------------------------- attempt
function prepareHill(i) {

    state.crowdPts.push({ x: cx, off: 0.3 + rng() * 1.8, col: [' #d7263d', '#1f6fb2', '#e8c33e', '#2a9d4a', '#e8e8e8', '#7b2fbe', '#e8871e'][(rng() * 7) | 0], ph: rng() * TAU, flag: rng() < 0.05 });
  }

    state.flags.push({ x: 0.3 * HILLS[i].K + rng() * 0.9 * HILLS[i].K, ph: rng() * TAU, col: rng() < 0.5 ? '#d7263d' : '#e8e8e8' });

// ------------------------------------------------------------- takeoff/flight

  state.phase = 'flight'; state.flightT = 0; state.flightGood = 0;

}
function flightStep(dt) {

  if (state.lean > 0.5 && state.lean < 0.95) state.flightGood += dt;

// ------------------------------------------------------------------- gore

  for (var d = 0; d < 1 + 3 * scale; d++)
    addDecal(x + (Math.random() - 0.3) * 2.5 * (1 + scale), y - 0.05, (0.2 + Math.random() * 0.9) * (0.6 + scale) * splatScale(), 0.6);

// ---------------------------------------------------------------- scoring
function judgeScores() {
  var base = 20;
  var q = state.takeoffQ;
  base -= q === 'PERFECT' ? 0 : q === 'GOOD' ? 1 : q === 'EARLY' ? 3 : 4;
  var frac = state.flightGood / Math.max(0.4, state.flightT);
  base -= (1 - clamp(frac, 0, 1)) * 3.5;
  if (!state.telemark) base -= 2;
  if (state.wobble) base -= 1.5;
  base -= Math.max(0, Math.abs(state.impact) - 5) * 0.15;
  base += clamp((state.dist - state.hill.H.K) * 0.03, -2, 2);
  var js = [];
  for (var i = 0; i < 5; i++) {
    var v = base + (Math.random() * 0.8 - 0.4);
    v = clamp(Math.round(v * 2) / 2, 0, 20);
    js.push(v);
  }
  var sorted = js.slice().sort(function (a, b) { return a - b; });
  var style = sorted[1] + sorted[2] + sorted[3];
  var K = state.hill.H.K, perM = K < 40 ? 2.0 : K < 100 ? 1.8 : 1.6;

}

  var best = BEST[state.hillIdx] || 0;
  state.newRecord = false;
  if (!state.crashed && state.dist > best) { BEST[state.hillIdx] = state.dist; state.newRecord = true; save(); }
  if (state.newRecord) { beep(660, .1, 'square', .12); setTimeout(function () { beep(880, .1, 'square', .12); }, 120); setTimeout(function () { beep(1320, .18, 'square', .12); }, 240); }
  state.phase = 'result'; state.t = 0;
  setLabel();
  console.info('[dsj] result ' + state.dist.toFixed(1) + 'm total=' + sc.total.toFixed(1));
}

// menu navigation uses fire/edges, debounce
var navCd = 0;

// -------------------------------------------------------------------- bot
// deterministic bot for ?shot mode and title-screen attract
function botTick() {
  var p = state.phase;
  if (p === 'title' || p === 'hills' || p === 'char') {
    if (state.t > (p === 'title' ? 1.2 : 0.4)) { pressFire(); relFire(); }
  } else if (p === 'ready') {
    if (state.readyT > 1.0) { pressFire(); relFire(); }
  } else if (p === 'inrun') {
    var toGo = state.hill.inL - state.inS; // meters to edge
    if (toGo < 1.0) { pressA(); } else relA();
  } else if (p === 'flight') {

  txt(HILLS[state.sel].n + '   K' + HILLS[state.sel].K, VW / 2 - txtW(HILLS[state.sel].n + '   K' + HILLS[state.sel].K, 1) / 2, VH - 52, '#9fb8d8', 1, '#000');
  if ((state.blink * 2) % 2 < 1) txt('NAV = CHANGE   FIRE = JUMP', VW / 2 - txtW('NAV = CHANGE   FIRE = JUMP', 2) / 2, VH - 34, '#7aff8a', 2, '#000');
}

// ------------------------------------------------------------------ main loop
var lastT = 0;
function loop(ts) {
  var dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016);
  lastT = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
// expose probe for testing/screenshots
window.__state = function () {
  return {
    phase: state.phase, hill: state.hill ? state.hill.H.n : null,
    px: +state.px.toFixed(1), dist: +state.dist.toFixed(1),
    crashed: state.crashed, gore: state.goreCount, parts: parts.length,
    blood: blood.length, freeze: !!state.freezeAt, t: +state.t.toFixed(2),
    wind: +state.wind.toFixed(1), tq: state.takeoffQ, total: state.total ? +state.total.toFixed(1) : 0,
  };
};
// deterministic simulation pump (software-GL headless runs are ~5fps; stepping
// lets tests/screenshots advance game time instantly). 60 steps = 1 game second.
window.__step = function (n) { for (var k = 0; k < n; k++) update(1 / 60); };
window.__bot = function (on) { state.bot = !!on; };
if (SHOT) {
  state.bot = true;
  // fast path: skip menus quickly
  state.phase = 'title';
}
if (FF > 0) window.__step(FF);
tune(false);
requestAnimationFrame(loop);
console.info('[dsj] deluxe ski jump gore edition ready');
</script>
