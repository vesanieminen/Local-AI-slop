<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="description" content="An infinite procedurally generated alien planet you walk on, raymarched per pixel: WebGL2, zero libraries, zero assets. A new planet every tap." />
<title>Planetwalk — a new alien planet every tap</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #05050a; color: #e8e8ea; overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  #hero {
    position: fixed; top: max(18px, env(safe-area-inset-top)); left: 20px;
    pointer-events: none; text-shadow: 0 2px 14px rgba(0,0,0,.9);
    animation: heroOut 1.2s ease 7s forwards;
  }
  #hero h1 { margin: 0; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  #hero p  { margin: 4px 0 0; font-size: 13px; color: #a7a7b2; }
  @keyframes heroOut { to { opacity: 0; transform: translateY(-8px); } }

  #hud {
    position: fixed; top: max(18px, env(safe-area-inset-top)); right: 20px;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #8f8f9a; text-align: right; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,.9);
  }

  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(4,4,8,.78) 40%, rgba(4,4,8,0));
    opacity: .95;
  }
  #pname {
    flex: 1; min-width: 0; font: 12.5px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #c8c8d2; text-shadow: 0 1px 8px rgba(0,0,0,.9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button {
    flex: none; border-radius: 999px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.07); color: #d9d9df;
    padding: 9px 15px; font-size: 13.5px; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background .15s ease, border-color .15s ease;
  }
  button:active, button:hover { background: rgba(255,255,255,.16); }

  #flash {
    position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none;
    transition: opacity .8s ease-out;
  }
  #flash.on { opacity: .9; transition: opacity .05s ease-in; }

  #joy { position: fixed; display: none; pointer-events: none; }
  #joyBase {
    position: absolute; width: 124px; height: 124px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.30); background: rgba(255,255,255,.05);
    transform: translate(-50%, -50%);
  }
  #joyKnob {
    position: absolute; width: 54px; height: 54px; border-radius: 50%;
    background: rgba(255,255,255,.28); border: 1px solid rgba(255,255,255,.35);
    transform: translate(-50%, -50%);
  }

  #fatal {
    position: fixed; inset: 0; display: none; place-content: center; text-align: center;
    padding: 24px; color: #c9c9d2; font-size: 15px; line-height: 1.6;
  }
  @media (max-width: 640px) {
    button { padding: 8px 12px; font-size: 12.5px; }
    #bar { gap: 6px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hero">
  <h1>Planetwalk</h1>
  <p>WASD / arrows walk &middot; drag look &middot; space jump &middot; phone: stick + drag</p>
</div>
<div id="hud">&hellip;</div>

<nav id="bar">
  <div id="pname">&mdash;</div>
  <button id="btnNew" aria-label="Fly to a new planet">New planet</button>
  <button id="btnMute" aria-label="Mute or unmute">Sound on</button>
</nav>

<div id="flash"></div>
<div id="joy"><div id="joyBase"></div><div id="joyKnob"></div></div>
<div id="fatal"></div>

<script>
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// Planetwalk — an alien planet under every step. One file, no libs, no assets.
//
// The ground is a procedural heightfield (domain-warped fBm continents +
// masked ridged fBm mountains) raymarched per pixel with conservative
// Lipschitz steps; water is an analytic plane reflecting the procedural sky
// (sun, moons, stars, clouds). A JS twin of the exact same noise — same
// mod-2^32 integer hash, same octaves — keeps the camera glued to the GPU's
// ground, so you really walk on it. One seed is a whole planet: offsets,
// palettes, sea level, snowline, sun, moons, cloud deck, wind, and a name.
//
// URL knobs (for headless capture and tinkering):
//   ?seed=N  ?t=seconds (pin animation)  ?px=scale  ?steps=march steps
// ─────────────────────────────────────────────────────────────────────────────

const qs = new URLSearchParams(location.search);
const isCoarse = matchMedia('(pointer: coarse)').matches;

// ── boot ─────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const pnameEl = document.getElementById('pname');
const flash = document.getElementById('flash');

const gl = canvas.getContext('webgl2', { antialias: false, depth: false, stencil: false, alpha: false });
function showFatal(msg) {
  const el = document.getElementById('fatal');
  el.style.display = 'grid';
  el.textContent = msg;
  hud.style.display = 'none'; document.getElementById('bar').style.display = 'none';
}
if (!gl) {
  showFatal('This demo needs WebGL2 — try a current Chrome, Firefox, Safari or Edge.');
  throw new Error('WebGL2 unavailable');
}
let dead = false;
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();                       // browsers will try to restore; the loop can't resume mid-shader
  dead = true;
  showFatal('The graphics context was lost — reload the page to keep walking.');
});

const VS = `#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
out vec4 o;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCamPos, uCamF, uCamR, uCamU;
uniform float uTanF;
uniform int   uSteps;
uniform vec2  uOfs[12];          // this planet's noise-space offsets

uniform float uSea, uSnow, uCloud, uFogD, uStar, uMoonAng, uMoonAng2, uMoonRing;
uniform vec3  uSunDir, uSunCol, uZen, uHor, uVegA, uVegB, uRock, uSand, uWaterC;
uniform vec3  uMoonDir, uMoonCol, uMoonDir2;

// ── noise (integer hash matches the JS twin exactly) ────────────────────────
float hash21(ivec2 p) {
  uint h = uint(p.x) * 668265261u + uint(p.y) * 374372273u;
  h ^= h >> 16u;
  h *= 2146125101u;
  h ^= h >> 15u;
  return float(h) / 4294967296.0;
}
float vnoise(vec2 p) {
  ivec2 i = ivec2(floor(p));
  vec2 f = p - vec2(i);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = hash21(i), b = hash21(i + ivec2(1, 0)), c = hash21(i + ivec2(0, 1)), d = hash21(i + ivec2(1, 1));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p, int n) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) {
    if (i >= n) break;
    s += a * vnoise(p);
    p = vec2(0.8 * p.x - 0.6 * p.y, 0.6 * p.x + 0.8 * p.y) * 2.02;
    a *= 0.5;
  }
  return (s - 0.5 * (1.0 - a)) / (1.0 - a);   // exact zero-centered range: ±0.5, independent of n
}

// ── the planet: warped continents + masked ridge mountains + ground detail ──
// wD weights the fine detail octave (1 at your feet → 0 far away, smoothly
// blended so there are no silhouette pops). |grad H| ≲ 2.6 → march is legal.
float H(vec2 xz, float wD) {
  vec2 q = xz * 0.0042 + uOfs[0];
  vec2 w = vec2(fbm(q * 0.55 + uOfs[2], 2), fbm(q * 0.55 + uOfs[3], 2));
  q += w * 1.4;
  float cont  = fbm(q, 4);
  float msk   = smoothstep(-0.06, 0.20, fbm(q * 0.55 + uOfs[4], 3));
  float ridge = fbm(q * 1.35 + w * 1.2 + uOfs[5], 5);
  ridge = pow(max(1.0 - 2.0 * abs(ridge), 0.0), 1.7);
  float hills = fbm(q * 2.2 + uOfs[6], 3);
  float h = cont * 30.0 + msk * ridge * 112.0 + hills * 11.0;
  if (wD > 0.0) h += fbm(xz * 0.03 + uOfs[7], 2) * 2.6 * wD;
  return h;
}

// ── moons: cratered discs with limb darkening + phase; one may be ringed ────
vec3 moonPart(vec3 rd, vec3 mdir, float mang, vec3 mcol, float ring, int idx) {
  if (mang <= 0.0) return vec3(0.0);
  float dm = length(rd - mdir);                 // chord ≈ 2·sin(θ/2)
  float r = dm / mang;
  if (r > 2.8) return vec3(0.0);
  vec3 c = vec3(0.0);
  vec3 rad = rd - mdir * dot(rd, mdir);         // radial offset on the sky sphere
  vec3 ta = normalize(vec3(mdir.z, 0.0, -mdir.x));
  vec3 tb = cross(mdir, ta);
  vec2 tc = vec2(dot(rad, ta), dot(rad, tb)) / mang;   // tangent-plane coords of the disc
  if (r <= 1.0) {
    float z = sqrt(max(1.0 - r * r, 0.0));
    float maria = fbm(tc * 2.2 + uOfs[9 + idx], 4);
    float phase = 0.35 + 0.65 * clamp(dot(mdir, uSunDir) * 1.4 + 0.2, 0.0, 1.0);
    c = mcol * (0.55 + 0.5 * maria) * (0.55 + 0.45 * z) * phase * 2.2;
    c *= smoothstep(1.0, 0.985, r);             // crisp limb
  } else if (ring > 0.5) {
    float u = tc.x, v = tc.y * 0.42;            // squash → tilted ellipse
    float rr = sqrt(u * u + v * v);
    if (rr > 1.3 && rr < 2.4) {
      float band = smoothstep(1.3, 1.5, rr) * (1.0 - smoothstep(2.2, 2.4, rr));
      float g = 0.55 + 0.45 * sin(rr * 42.0 + fbm(tc * 2.0 + uOfs[10], 2) * 6.0);
      c += mcol * band * g * 0.55;
    }
  }
  return c;
}

// ── sky split in two: base = gradient + sun + moons + stars (also the fog
//    tint); clouds only ever land on rays that actually see sky or water.
//    Painting clouds into the fog tint used to stripe distant mountains.
vec3 skyBase(vec3 rd) {
  float yy = max(rd.y, 0.0);
  vec3 c = mix(uHor, uZen, pow(yy, 0.55));

  float s = max(dot(rd, uSunDir), 0.0);
  c += uSunCol * (smoothstep(0.99985, 0.99995, s) * 22.0 + pow(s, 20.0) * 0.32 + pow(s, 3.0) * 0.06);

  c += moonPart(rd, uMoonDir, uMoonAng, uMoonCol, uMoonRing, 0);
  c += moonPart(rd, uMoonDir2, uMoonAng2, uMoonCol * 0.55, 0.0, 1);

  if (uStar > 0.01 && rd.y > 0.03) {           // twinkling stars
    vec2 sc = rd.xz / rd.y * 90.0;
    ivec2 si = ivec2(floor(sc));
    float hv = hash21(si + ivec2(131, 97));
    if (hv > 0.978) {
      vec2 sp = vec2(si) + vec2(hash21(si + ivec2(5, 51)), hash21(si + ivec2(17, 93)));
      float b = (hv - 0.978) / 0.022;
      float tw = 0.75 + 0.25 * sin(uTime * (1.5 + hv * 13.0) + hv * 100.0);
      c += vec3(0.85, 0.88, 1.0) * smoothstep(0.55, 0.0, length(sc - sp)) * b * b * uStar * tw * 0.9;
    }
  }

  // forward-scattering wedge toward the sun: the golden band along the horizon
  c = mix(c, uHor * 1.15, (1.0 - abs(rd.y)) * pow(max(dot(rd, uSunDir), 0.0), 6.0) * 0.55);
  return c;
}

vec3 skyCol(vec3 rd) {                            // base + the scrolling cloud deck
  vec3 c = skyBase(rd);
  if (uCloud > 0.02 && rd.y > 0.02) {            // fake volume: one scrolling fBm layer
    vec2 cp = rd.xz / rd.y * 700.0 + uOfs[7] * 3.0 + vec2(1.0, 0.35) * uTime * 9.0;
    float den = fbm(cp * 0.0015, 4);
    float thr = mix(0.14, -0.22, uCloud);
    float a = smoothstep(thr, thr + 0.16, den) * smoothstep(0.02, 0.14, rd.y);
    float lit = fbm(cp * 0.0015 + uSunDir.xz * 0.020 + uOfs[8], 4);
    float shade = clamp((lit - den) * 5.0 + 0.32 + 0.5 * uSunDir.y, 0.0, 1.0);
    vec3 litC  = mix(uHor, uSunCol, 0.35) * 1.25;
    vec3 darkC = mix(uZen, uHor, 0.30) * 0.75;
    c = mix(c, mix(darkC, litC, shade), a);
  }
  return c;
}

// ── ground: bands of veg / rock / beach / snow, strata speckle ──────────────
vec3 ground(vec3 p, vec3 n, vec3 rd) {
  float h = p.y, hh = h - uSea;
  float slope = 1.0 - n.y;

  float m = fbm(p.xz * 0.006 + uOfs[1], 3);
  vec3 veg = mix(uVegA, uVegB, smoothstep(-0.08, 0.16, m));
  float speck = fbm(p.xz * 0.09 + uOfs[10], 2) * 0.25;
  vec3 rock = uRock * (1.0 + speck) * (0.9 + 0.25 * fract(h * 0.09 + m * 2.0));   // strata bands

  float vegAmt = smoothstep(0.42, 0.18, slope) * (1.0 - smoothstep(uSnow - 30.0, uSnow, h));
  vec3 g = mix(rock, veg, vegAmt);

  float sandAmt = clamp(smoothstep(2.4, 0.4, abs(hh - 0.6)) * step(-0.5, hh), 0.0, 1.0);
  g = mix(g, uSand * (1.0 + speck * 0.4), sandAmt);

  float snowAmt = clamp(smoothstep(uSnow - 5.0, uSnow + 9.0, h) * smoothstep(0.5, 0.22, slope)
                        * smoothstep(-0.06, 0.10, m), 0.0, 1.0);   // patchy snow via veg noise
  g = mix(g, vec3(0.92, 0.95, 1.0), snowAmt);

  float ndl = max(dot(n, uSunDir), 0.0);
  vec3 sun = uSunCol * ndl * 1.35;
  vec3 amb = mix(uHor * 0.42, uZen * 0.5, 0.5 + 0.5 * n.y) * (1.0 + 0.6 * (1.0 - uSunDir.y));
  vec3 moonfill = uMoonCol * max(dot(n, uMoonDir), 0.0) * 0.22 * uStar;
  vec3 col = g * (sun + amb + moonfill + vec3(0.04, 0.05, 0.08) * uStar);   // starlight floor

  vec3 hn = normalize(uSunDir - rd);
  float spec = pow(max(dot(n, hn), 0.0), mix(35.0, 90.0, snowAmt)) * (0.08 + 0.5 * snowAmt);
  col += uSunCol * spec;
  return col;
}

// ── water: analytic plane, animated ripples, sky reflection, depth, foam ────
vec3 water(vec3 p, vec3 rd, float dist) {
  float depth = uSea - H(p.xz, clamp(1.0 - dist * 0.017, 0.0, 1.0));
  float e = 0.55;                                  // wide deltas keep normals smooth, not grainy
  float near = exp(-dist * 0.022);                 // ripples/glitter resolve only nearby
  int wo = dist < 25.0 ? 3 : 2;
  vec2 wp = p.xz * 0.16 + uOfs[11] + vec2(uTime * 0.45, uTime * 0.28);
  float a0 = fbm(wp, wo), a1 = fbm(wp + vec2(e * 0.16, 0.0), wo), a2 = fbm(wp + vec2(0.0, e * 0.16), wo);
  float ripple = mix(0.05, 0.62, near);
  vec3 n = normalize(vec3(-(a1 - a0) * ripple / e, 1.0, -(a2 - a0) * ripple / e));

  vec3 rr = reflect(rd, n);
  vec3 refl = skyCol(vec3(rr.x, max(rr.y, 0.03), rr.z));

  float facing = max(dot(n, -rd), 0.0);
  float F = 0.03 + 0.97 * pow(1.0 - facing, 5.0);

  vec3 deep = uWaterC * 0.08;
  vec3 shal = uWaterC * 0.60 + uSand * 0.12 * exp(-max(depth, 0.0) * 0.5);
  vec3 under = mix(shal, deep, 1.0 - exp(-max(depth, 0.0) * 0.28));

  vec3 col = mix(under, refl * (0.55 + 0.45 * F), clamp(F + 0.12, 0.0, 1.0));

  vec3 hn = normalize(uSunDir - rd);
  col += uSunCol * pow(max(dot(n, hn), 0.0), 110.0) * near * 0.9;              // glitter
  float d0 = max(depth, 0.0);
  float foam = smoothstep(0.5, 0.02, d0) * (0.55 + 0.45 * sin(d0 * 3.0 - fbm(p.xz * 0.12 + uOfs[11], 2) * 4.0 + uTime));
  col = mix(col, vec3(0.92, 0.95, 0.98), clamp(foam, 0.0, 1.0) * 0.40 * smoothstep(55.0, 12.0, dist));
  return col;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - uRes * 0.5) / sqrt(uRes.x * uRes.y);
  vec3 ro = uCamPos;
  vec3 rd = normalize(uCamF + uTanF * (uv.x * uCamR + uv.y * uCamU));

  const float MAXD = 300.0, MAXH = 138.0;   // MAXH > tallest possible peak (133.8 m)
  float tW = (rd.y < 0.0 && ro.y > uSea) ? (uSea - ro.y) / rd.y : 1e9;
  // legal early bound: a climbing ray is above every peak past this distance,
  // because H itself has a hard global ceiling (MAXH)
  float tEnd = rd.y > 0.0 ? min(MAXD, max(0.0, (MAXH - ro.y) / rd.y)) : MAXD;
  float t = 0.3, tPrev = 0.3;
  float hitH = 0.0;
  bool hit = false;
  for (int i = 0; i < 130; i++) {
    if (i >= uSteps) break;
    vec3 p = ro + rd * t;
    if (p.y > MAXH) {                          // above every peak: bound-march, no noise
      if (rd.y > 0.0) { t = MAXD + 1.0; break; }
      t += max((p.y - MAXH + 1.0) * 0.5, t * 0.02 + 0.3);
      if (t > tEnd) break;
      continue;                                // tPrev stays at the last sampled point
    }
    float wD = 1.0 - smoothstep(24.0, 34.0, t);   // detail octave fades out with distance
    float d = p.y - H(p.xz, wD);
    if (d < 0.0) {                             // crossed the surface — bisect [tPrev, t]
      float t0 = tPrev, t1 = t;
      float wDc = wD;
      for (int k = 0; k < 7; k++) {
        float tm = (t0 + t1) * 0.5;
        vec3 pm = ro + rd * tm;
        if (pm.y - H(pm.xz, wDc) < 0.0) t1 = tm; else t0 = tm;
      }
      t = (t0 + t1) * 0.5;
      hitH = H((ro + rd * t).xz, 1.0);
      hit = true;
      break;
    }
    // (no cheap "clear sky" shortcut here: H has no *local* bound — a ray
    //  skimming high ground can still meet a taller peak ahead. The only
    //  legal miss-above is the MAXH ceiling branch at the top of the loop.)
    if (p.y < uSea - 1.0) { t = tW + 0.5; break; }           // sank below sea level: ocean covers it
    // conservative (|grad H| ≲ 2.6) but capped by travel distance, so far
    // peaks are never one-shot skipped: no ghost ledges at the horizon
    tPrev = t;
    t += min(max(d * 0.27, t * 0.02 + 0.08), t * 0.15 + 0.5);
    if (t > tEnd) break;
  }

  vec3 col;
  float fogT;
  if (tW < 1e8 && (tW < t || !hit)) {          // the sea plane never ends; fog takes over
    col = water(ro + rd * tW, rd, tW);
    fogT = tW;
  } else if (hit) {
    vec3 p = ro + rd * t;
    float e = clamp(t * 0.02, 0.35, 4.0);
    float wN = clamp(1.0 - t * 0.025, 0.0, 1.0);
    float hL = H(p.xz - vec2(e, 0.0), wN), hR = H(p.xz + vec2(e, 0.0), wN);
    float hD = H(p.xz - vec2(0.0, e), wN), hU = H(p.xz + vec2(0.0, e), wN);
    vec3 n = normalize(vec3(hL - hR, 2.0 * e, hD - hU));
    if (hitH < uSea - 0.05) {                  // submerged floor found before the plane: same water shading
      col = water(ro + rd * tW, rd, tW);
      fogT = tW;
    } else {
      if (t < 45.0) {                         // ground detail bumps the normal, near only
        float e2 = 0.8;
        float b0 = fbm(p.xz * 0.11 + uOfs[8], 2);
        float b1 = fbm((p.xz + vec2(e2, 0.0)) * 0.11 + uOfs[8], 2);
        float b2 = fbm((p.xz + vec2(0.0, e2)) * 0.11 + uOfs[8], 2);
        float bumpAmp = 1.0 * (1.0 - t / 45.0);
        n = normalize(n + vec3(-(b1 - b0), 0.0, -(b2 - b0)) * bumpAmp * 2.4);
      }
      col = ground(p, n, rd);
      fogT = t;
    }
  } else {
    col = skyCol(rd);
    fogT = MAXD;
  }

  if (hit || tW < 1e8) {
    float fog = 1.0 - exp(-fogT * uFogD * 1.0);    // far peaks stay legible through the haze
    fog = max(fog, smoothstep(MAXD - 55.0, MAXD, min(fogT, MAXD)));   // hide the far cutoff
    col = mix(col, skyBase(rd), fog);            // haze tint, never the cloud pattern
    col += uSunCol * pow(max(dot(rd, uSunDir), 0.0), 22.0) * 0.10 * fog;
  }

  col = 1.0 - exp(-col * 1.28);                       // filmic-ish rolloff
  float lum = dot(col, vec3(0.299, 0.587, 0.114));    // gentle saturation lift
  col = mix(vec3(lum), col, 1.10);
  col = pow(col, vec3(1.0 / 2.2));
  col *= 1.0 - 0.13 * dot(uv, uv);                    // vignette
  o = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));

    // Without this the camera just rides any cliff face up through mountains.
    // Framerate-independent because both the stride and the rise budget scale
    // with dt. Airborne you (feet higher) hop onto ledges you'd jump for.
    const feet = cam.y - 1.75;
    const maxRise = 1.5 * Math.hypot(mx, mz) + 0.02;
    const walkable = (nx, nz) => Hcpu(nx, nz) - feet <= maxRise;
    if (walkable(cam.x + mx, cam.z + mz)) { cam.x += mx; cam.z += mz; }
    else if (walkable(cam.x + mx, cam.z)) cam.x += mx;     // slide along the wall
    else if (walkable(cam.x, cam.z + mz)) cam.z += mz;
  }

  if (keys.has('Space') && cam.grounded) { cam.vy = 5.3; cam.grounded = false; }

  const gh = Hcpu(cam.x, cam.z);
  const floorY = Math.max(gh, p.sea - 0.45) + 1.75;
  cam.y += cam.vy * dt; cam.vy -= 15 * dt;
  if (cam.y <= floorY) {
    if (!cam.grounded && cam.vy < -3) stepSound(true);
    cam.y = floorY; cam.vy = 0; cam.grounded = true;
  }

  const inWater = gh < p.sea - 0.3;
  if (inWater && !wasInWater) splashSound();
  wasInWater = inWater;

  if (cam.grounded && speedMoving(sp)) {
    const speed = run ? 9.5 : 4.6;
    cam.walkDist += speed * sp * dt;
    const stride = run ? 2.1 : 1.35;
    if (cam.walkDist > stride) { cam.walkDist -= stride; inWater ? splashSound() : stepSound(false); }
    cam.bob = Math.sin(cam.walkDist / stride * Math.PI * 2) * (run ? 0.09 : 0.055);
  } else cam.bob *= 0.85;

  if (windGain) {
    const alt = Math.max(0, cam.y - p.sea);
    windGain.gain.value = muted ? 0 : Math.min(0.10, 0.015 + sp * (run ? 0.075 : 0.036) + alt * 0.0016);
  }
}
const speedMoving = sp => sp > 0.12;

function draw(now) {
  const t = tPin !== null ? tPin : now / 1000;
  gl.useProgram(prog);
  gl.uniform2f(prog.u.uRes, canvas.width, canvas.height);
  gl.uniform1f(prog.u.uTime, t);
  const { F, Rv, U } = camBasis();
  gl.uniform3f(prog.u.uCamPos, cam.x, cam.y + cam.bob, cam.z);
  gl.uniform3fv(prog.u.uCamF, F);
  gl.uniform3fv(prog.u.uCamR, Rv);
  gl.uniform3fv(prog.u.uCamU, U);
  gl.uniform1f(prog.u.uTanF, 0.82);
  gl.uniform1i(prog.u.uSteps, steps);
  gl.uniform2fv(prog.u.uOfs, OFS);
  const j = planet.jit;
  gl.uniform1f(prog.u.uSea, planet.sea);
  gl.uniform1f(prog.u.uSnow, planet.snow);
  gl.uniform1f(prog.u.uCloud, planet.cloud);
  gl.uniform1f(prog.u.uFogD, planet.fog);
  gl.uniform1f(prog.u.uStar, planet.star);
  gl.uniform1f(prog.u.uMoonAng, planet.moonAng);
  gl.uniform1f(prog.u.uMoonAng2, planet.moon2Ang);
  gl.uniform1f(prog.u.uMoonRing, planet.moonRing);
  gl.uniform3fv(prog.u.uSunDir, planet.sunDir);
  gl.uniform3fv(prog.u.uSunCol, j.sun);
  gl.uniform3fv(prog.u.uZen, j.zen);
  gl.uniform3fv(prog.u.uHor, j.hor);
  gl.uniform3fv(prog.u.uVegA, j.vegA);
  gl.uniform3fv(prog.u.uVegB, j.vegB);
  gl.uniform3fv(prog.u.uRock, j.rock);
  gl.uniform3fv(prog.u.uSand, j.sand);
  gl.uniform3fv(prog.u.uWaterC, j.water);
  gl.uniform3fv(prog.u.uMoonDir, planet.moonDir);
  gl.uniform3fv(prog.u.uMoonCol, planet.moonCol);
  gl.uniform3fv(prog.u.uMoonDir2, planet.moon2Dir);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return t;
}

function frame(now) {
  if (dead) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  emaMs = emaMs * 0.88 + Math.min(400, now - prevNow) * 0.12; prevNow = now;

  stepPhysics(dt);
  const tUsed = draw(now);

  if (!pinScale && now - lastCtl > 600) {
    lastCtl = now;
    if (emaMs > 21 && scaleIdx > 0) { scaleIdx--; resize(); }
    else if (emaMs < 11.5 && scaleIdx < LADDER.length - 1 && LADDER[scaleIdx + 1] <= maxScale) { scaleIdx++; resize(); }
  }

  frames++; frameN++;
  if (now - fpsClock > 500 || frameN <= 3) {
    fps = Math.round(frames * 1000 / (now - fpsClock)); frames = 0; fpsClock = now;
    hud.textContent = `${fps} fps \u00b7 ${(pinScale ? pinnedPx : LADDER[scaleIdx])}\u00d7 \u00b7 ${steps} steps`;
    window.__perf = {
      fps, scale: pinScale ? pinnedPx : LADDER[scaleIdx], W: canvas.width, H: canvas.height, steps,
      seed: planet.seed, biome: planet.biome, name: planet.name, emaMs: Math.round(emaMs),
      frames: frameN, time: +tUsed.toFixed(3),
      cam: [+cam.x.toFixed(1), +cam.y.toFixed(1), +cam.z.toFixed(1), +cam.yaw.toFixed(3)],
    };
  }
  requestAnimationFrame(frame);
}

// ── go ───────────────────────────────────────────────────────────────────────
window.__walk = { cam, H: (x, z) => Hcpu(x, z) };   // for headless tests
const seed0 = qs.has('seed') ? ((+qs.get('seed')) >>> 0 || 1)
                             : ((((Date.now() ^ (performance.now() * 1000)) >>> 0) % 999998) + 1);
resize();
setPlanet(seed0, false);
requestAnimationFrame(frame);
</script>
</body>
