<script>
'use strict';
/* ============ DOOM — TERMINATED EDITION ============
   Doom-style raycaster in a Skynet underground sector.
   One file, zero assets: textures, sprites and audio are
   generated procedurally at boot.
==================================================== */

// ---------- utils ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hash2(x,y,s){let n=Math.imul(x|0,73856093)^Math.imul(y|0,19349663)^Math.imul(s|0,83492791);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295;}
const P3=(r,g,b)=>(((255<<24)|(b<<16)|(g<<8)|r)>>>0);
function packShade(c,k,w){ // c=ABGR pixel, k=brightness, w=white add
  let r=(c&255)*k+w,g=(c>>>8&255)*k+w,b=(c>>>16&255)*k+w;
  r=r>255?255:r;g=g>255?255:g;b=b>255?255:b;
  return(((255<<24)|(b<<16)|(g<<8)|r)>>>0);
}

const params=new URLSearchParams(location.search);
const AUTOSTART=params.get('autostart')==='1';
const AUTOFIRE=params.get('autofire')==='1';
const STARTWAVE=Math.max(1,parseInt(params.get('wave')||'1',10)||1);
const FORCE_RES=parseInt(params.get('res')||'0',10);

// ---------- canvas / buffers ----------
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=400,H=250,BAR=34,VH=H-BAR;
let img,buf32,vign=null,zbuf;
function setRes(w,h){
  W=w;H=h;VH=H-BAR;cv.width=W;cv.height=H;
  img=ctx.createImageData(W,H);buf32=new Uint32Array(img.data.buffer);
  zbuf=new Float32Array(W);
  const v=document.createElement('canvas');v.width=W;v.height=VH;const g=v.getContext('2d');
  const rg=g.createRadialGradient(W/2,VH/2,VH*0.35,W/2,VH/2,VH*0.85);
  rg.addColorStop(0,'rgba(60,0,0,0)');rg.addColorStop(1,'rgba(70,0,0,0.34)');
  g.fillStyle=rg;g.fillRect(0,0,W,VH);vign=v;
}
if(FORCE_RES>=320)setRes(FORCE_RES,Math.round(FORCE_RES*0.625));else setRes(400,250);

// ---------- textures (64x64 Uint32) ----------
const TS=64;
function makeTex(fn){const t=new Uint32Array(TS*TS);for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){const c=fn(x,y);t[y*TS+x]=P3(clamp(c[0]|0,0,255),clamp(c[1]|0,0,255),clamp(c[2]|0,0,255));}return t;}
const noiseCache=makeTex((x,y)=>{const n=hash2(x,y,7)*24-12;return[128+n,128+n,128+n];});

function texPanel(x,y){
  const n=(noiseCache[y*TS+x]&255)-128;
  let r=72,g=78,b=86;
  if(x<2||x===31||x===32||x===63||y<2||y===31||y===32||y===63){r=42;g=46;b=52;}
  const rx=x%32,ry=y%32;
  if((rx===5||rx===6||rx===25||rx===26)&&(ry===5||ry===6||ry===25||ry===26)){r=126;g=132;b=140;}
  if(y<32){r+=4;g+=4;b+=4;}
  return[r+n,g+n,b+n];
}
function texRust(x,y){
  const n=hash2(x,y,11)*22-11;
  let r=78,g=68,b=60;
  if(x<2||x===31||x===32||x===63){r-=22;g-=20;b-=18;}
  const blot=hash2(x>>3,y>>3,3);
  if(blot>0.72){r+=36;g+=14;b+=4;}
  if(blot<0.22){r-=16;g-=15;b-=13;}
  const ym=y%32;
  if(ym===2||ym===30){r-=26;g-=26;b-=24;}
  if((x%16<2)&&(ym<3)){r=118;g=114;b=110;}
  const drip=hash2(x>>1,0,19);
  if(ym<10&&drip>0.82){r+=14;g+=4;b-=4;}
  return[r+n,g+n*0.9,b+n*0.8];
}
function texHazard(x,y){
  const s=(x+y)%24<12;
  let r=64,g=66,b=70;
  if(y>=14&&y<50){if(s){r=198;g=172;b=44;}else{r=26;g=24;b=22;}}
  if(y===13||y===50){r=30;g=30;b=30;}
  const n=hash2(x,y,5)*18-9;
  return[r+n,g+n,b+n];
}
function texComputer(x,y,blink){
  let r=38,g=44,b=58;const px=x%16,py=y%16;
  if(px===0||py===0){r=24;g=28;b=38;}
  if(py>=5&&py<=7){
    const on=hash2(x>>1,(y>>1)+(blink?9:0),21)>0.55;
    if(px>3&&px<13&&on){
      const hue=Math.floor(hash2(x>>1,y>>1,4)*3);
      if(hue===0){r=40;g=230;b=80;}else if(hue===1){r=250;g=70;b=40;}else{r=60;g=180;b=240;}
    }
  }
  if(py>=11&&py<=13&&px>3&&px<13){r=30;g=34;b=44;}
  const n=hash2(x,y,2)*10-5;
  return[r+n,g+n,b+n];
}
function texDoor(x,y){
  let r=88,g=94,b=102;const n=hash2(x,y,9)*16-8;
  if(x<3||x>60||y<3||y>60){r=48;g=52;b=58;}
  if(x===31||x===32){r=40;g=44;b=50;}
  if(y>=28&&y<=36){r=140;g=34;b=28;if((x+y)%8<4){r=160;g=44;b=34;}}
  if(y>=56&&y<=60){r=180;g=158;b=44;if((x+y)%16<8){r=40;g=38;b=34;}}
  if((x===8||x===55)&&(y===8||y===20||y===44||y===52)){r=130;g=136;b=144;}
  return[r+n,g+n,b+n];
}
function texRedDoor(x,y){
  let r=122,g=36,b=30;const n=hash2(x,y,13)*14-7;
  if(x<3||x>60){r=60;g=18;b=16;}
  if(x===31||x===32){r=70;g=22;b=18;}
  const dx=x-32,dy=y-26,d=dx*dx+dy*dy;
  if(d<169&&d>110){r=170;g=176;b=184;}
  if(d<=110){r=20;g=10;b=10;}
  if(d<=110&&y>22&&y<30&&x>24&&x<40){const t=hash2(x,y,17)>0.5?70:16;r=t;g=t*0.4;b=t*0.4;}
  if(d<=40&&d>18){r=230;g=50;b=30;}
  if(y>=54){r=180;g=158;b=44;if((x+y)%14<7){r=36;g=30;b=26;}}
  return[r+n,g+n,b+n];
}
function texFloor(x,y){
  let r=52,g=56,b=64;const n=hash2(x,y,31)*22-11;
  if(x%16<1||y%16<1){r=34;g=37;b=43;}
  if(hash2(x,y,3)>0.985){r+=60;g+=62;b+=66;}
  if(hash2(x,y,57)>0.99){r-=20;g-=20;b-=18;}
  return[r+n,g+n,b+n];
}
function texCeil(x,y){
  let r=28,g=31,b=37;const n=hash2(x,y,41)*10-5;
  if(x%32<1||y%32<1){r=18;g=20;b=24;}
  if(x%32>4&&x%32<10&&y%32>4&&y%32<10&&hash2(x>>5,y>>5,3)>0.6){r=64;g=66;b=70;}
  return[r+n,g+n,b+n];
}
const T_PANEL=1,T_RUST=2,T_HAZ=3,T_COMP=4,T_COMP2=5,T_DOOR=6,T_REDD=7,T_FLOOR=8,T_CEIL=9;
const TEX=[null,makeTex(texPanel),makeTex(texRust),makeTex(texHazard),
  makeTex((x,y)=>texComputer(x,y,0)),makeTex((x,y)=>texComputer(x,y,1)),
  makeTex(texDoor),makeTex(texRedDoor),makeTex(texFloor),makeTex(texCeil)];

// ---------- endoskeleton sprites ----------
function bone(g,x1,y1,x2,y2,w){
  g.lineCap='round';
  g.strokeStyle='#22262c';g.lineWidth=w+4;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  g.strokeStyle='#6f7883';g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  g.strokeStyle='#bcc5cf';g.lineWidth=Math.max(1.2,w*0.3);g.beginPath();g.moveTo(x1,y1-0.7);g.lineTo(x2,y2-0.7);g.stroke();
}
function joint(g,x,y,r){
  const grd=g.createRadialGradient(x-r*0.4,y-r*0.4,1,x,y,r);
  grd.addColorStop(0,'#cfd6df');grd.addColorStop(1,'#4a515a');
  g.fillStyle=grd;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
}
function drawSkull(g,cx,cy,s,big){
  const grd=g.createLinearGradient(cx-13*s,0,cx+13*s,0);
  grd.addColorStop(0,'#7d858f');grd.addColorStop(0.45,'#dee4ec');grd.addColorStop(1,'#69707a');
  g.fillStyle=grd;g.beginPath();g.ellipse(cx,cy,13*s,14*s,0,0,Math.PI*2);g.fill();
  g.fillStyle='#57606a';g.fillRect(cx-9*s,cy+8*s,18*s,8*s);
  g.strokeStyle='#181b20';g.lineWidth=1.2;
  for(let i=0;i<5;i++){g.beginPath();g.moveTo(cx-7*s+i*3.6*s,cy+8*s);g.lineTo(cx-7*s+i*3.6*s,cy+16*s);g.stroke();}
  g.fillStyle='#0b0d11';
  g.beginPath();g.arc(cx-6*s,cy-3*s,3.8*s,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(cx+6*s,cy-3*s,3.8*s,0,Math.PI*2);g.fill();
  g.save();g.shadowColor='#ff2a14';g.shadowBlur=7;
  g.fillStyle='#ff3418';
  g.beginPath();g.arc(cx-6*s,cy-3*s,2.3*s,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(cx+6*s,cy-3*s,2.3*s,0,Math.PI*2);g.fill();
  g.restore();
  g.fillStyle='#141820';g.beginPath();g.moveTo(cx,cy+1*s);g.lineTo(cx-2*s,cy+5*s);g.lineTo(cx+2*s,cy+5*s);g.fill();
  if(big){g.fillStyle='#3a4048';g.fillRect(cx-13*s,cy-13*s,26*s,3*s);}
}
// feet at (56,98). pose: ph=leg phase, atk=arms up, kneel, tilt, big, gun=minigun
function drawEndo(g,pose){
  const {ph=0,atk=0,kneel=0,tilt=0,big=false,gun=false}=pose;
  const s=big?1.16:1.0;
  g.save();
  g.translate(0,kneel*24);
  if(tilt){g.translate(56,98);g.rotate(tilt);g.translate(-56,-98);}
  const sw=Math.sin(ph)*7,sw2=Math.cos(ph)*6;
  const hipY=64-kneel*10,kneeY=82-kneel*4;
  if(kneel>0){
    bone(g,50,hipY,44,kneeY+2,4.4);bone(g,44,kneeY+2,36,kneeY+12,4);
    bone(g,62,hipY,68,kneeY+2,4.4);bone(g,68,kneeY+2,76,kneeY+12,4);
    bone(g,30,kneeY+13,42,kneeY+13,3.4);bone(g,70,kneeY+13,82,kneeY+13,3.4);
  }else{
    bone(g,50,hipY,48+sw*0.5,kneeY,4.6);bone(g,48+sw*0.5,kneeY,49+sw,96,4);
    bone(g,62,hipY,64-sw*0.5,kneeY,4.6);bone(g,64-sw*0.5,kneeY,63-sw,96,4);
    bone(g,45+sw,98,57+sw,98.5,3.4);bone(g,59-sw,98,71-sw,98.5,3.4);
    joint(g,49+sw,96,3);joint(g,63-sw,96,3);
  }
  joint(g,50,hipY,4.4);joint(g,62,hipY,4.4);
  bone(g,47,60,65,60,5);bone(g,49,58,51,64,3);bone(g,63,58,61,64,3);
  const rw=big?[34,38,36,30]:[26,30,28,22];
  for(let i=0;i<4;i++)bone(g,56-rw[i]/2,38+i*6,56+rw[i]/2,38+i*6,3);
  bone(g,56,32,56,60,4);
  for(let y=36;y<=58;y+=5)joint(g,56,y,2.1);
  joint(g,42,33,5);joint(g,70,33,5);
  if(big){
    g.fillStyle='#454c55';
    g.beginPath();g.moveTo(34,29);g.lineTo(46,27);g.lineTo(46,37);g.lineTo(33,37);g.closePath();g.fill();
    g.beginPath();g.moveTo(78,29);g.lineTo(66,27);g.lineTo(66,37);g.lineTo(79,37);g.closePath();g.fill();
  }
  if(gun){
    bone(g,70,33,74,52,5);
    g.fillStyle='#31363d';g.fillRect(70,52,9,26);
    g.fillStyle='#565d66';for(let i=0;i<3;i++)g.fillRect(69,54+i*8,11,5);
    g.fillStyle='#22262b';g.fillRect(72,44,5,9);
    bone(g,42,33,38+sw2*0.4,52,4.2);bone(g,38+sw2*0.4,52,37+sw2,64,3.6);
    for(let i=0;i<3;i++){g.strokeStyle='#9aa2ac';g.lineWidth=1.6;g.beginPath();g.moveTo(37+sw2,64);g.lineTo(34+sw2+i*3,70);g.stroke();}
  }else if(atk>0){
    bone(g,42,33,40,42,4.4);bone(g,40,42,44,36,3.8);
    bone(g,70,33,72,42,4.4);bone(g,72,42,68,36,3.8);
    for(const[hx,hy,dd]of[[44,36,-1],[68,36,1]])for(let i=0;i<3;i++){g.strokeStyle='#b8c0ca';g.lineWidth=1.7;g.beginPath();g.moveTo(hx,hy);g.lineTo(hx+dd*(2+i*3),hy-6);g.stroke();}
  }else{
    bone(g,42,33,40+sw2*0.4,52,4.4);bone(g,40+sw2*0.4,52,39+sw2,64,3.8);
    bone(g,70,33,72-sw2*0.4,52,4.4);bone(g,72-sw2*0.4,52,73-sw2,64,3.8);
    for(const[hx,hy]of[[39+sw2,64],[73-sw2,64]])for(let i=0;i<3;i++){g.strokeStyle='#9aa2ac';g.lineWidth=1.6;g.beginPath();g.moveTo(hx,hy);g.lineTo(hx-3+i*3,hy+6);g.stroke();}
  }
  bone(g,56,26,56,32,3.4);
  drawSkull(g,56,15,s,big);
  g.restore();
}
function spriteFromCanvas(cnv,z0,z1){
  const g=cnv.getContext('2d');
  const im=g.getImageData(0,0,cnv.width,cnv.height);
  return{d:new Uint32Array(im.data.buffer),w:cnv.width,h:cnv.height,z0,z1};
}
function endoCanvas(pose){const c=document.createElement('canvas');c.width=112;c.height=102;drawEndo(c.getContext('2d'),pose);return c;}
function corpseCanvas(big){
  const c=document.createElement('canvas');c.width=big?124:116;c.height=big?62:56;
  const g=c.getContext('2d');
  g.save();g.translate(c.width-12,c.height-12);g.rotate(-1.45);g.translate(-56,-98);
  drawEndo(g,big?{big:true,gun:true}:{});g.restore();

  for(let i=0;i<12;i++)g.fillRect(20+rng()*(c.width-40),6+rng()*(c.height-12),2,2);
  return c;
}
const SPR_ENDO={walk:[],atk:[],die:[]};
const SPR_BIG={walk:[],atk:[],die:[]};
for(let i=0;i<4;i++){

const SPR_BOOM=[];
for(let f=0;f<3;f++)SPR_BOOM.push(spriteFromCanvas(itemCanvas(96,96,(g)=>{

let AC=null,MG=null,nbuf=null,humOn=false,musicAcc=0,musicStep=0,humStarted=false;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain();MG.gain.value=0.45;MG.connect(AC.destination);
    nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=nbuf.getChannelData(0);const r=mulberry(5);
    for(let i=0;i<d.length;i++)d[i]=r()*2-1;
    humOn=true;
  }catch(e){AC=null;}
}
function aNoise(dur,freq,vol,sweep){
  if(!AC||AC.state!=='running')return;
  const s=AC.createBufferSource();s.buffer=nbuf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  if(sweep)f.frequency.exponentialRampToValueAtTime(Math.max(60,sweep),AC.currentTime+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  s.connect(f).connect(g).connect(MG);s.start();s.stop(AC.currentTime+dur+0.02);
}
function aTone(type,f0,f1,dur,vol){
  if(!AC||AC.state!=='running')return;
  const o=AC.createOscillator();o.type=type;
  o.frequency.setValueAtTime(f0,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),AC.currentTime+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g).connect(MG);o.start();o.stop(AC.currentTime+dur+0.02);
}
const distVol=(d)=>clamp(1/(1+d*d*0.04),0.02,1);
const SFX={
  pistol:()=>{aNoise(0.10,2400,0.5);aTone('square',500,90,0.09,0.25);},
  plasma:()=>{aTone('sawtooth',1600,180,0.22,0.2);aNoise(0.1,1100,0.15);},
  step:(d)=>aNoise(0.06,170,0.3*distVol(d)),
  servo:(d)=>aTone('square',750,1150,0.09,0.06*distVol(d)),
  melee:(d)=>{aNoise(0.16,500,0.35*distVol(d));aTone('sawtooth',180,90,0.18,0.2*distVol(d));},
  pain:()=>{aTone('sawtooth',320,110,0.28,0.32);aNoise(0.1,900,0.2);},
  hit:(d)=>aNoise(0.05,3200,0.25*distVol(d)),
  die:(d)=>{aTone('square',900,80,0.5,0.22*distVol(d));aNoise(0.3,800,0.3*distVol(d));},
  boom:(d)=>{aNoise(0.55,500,0.8*distVol(d),60);aTone('sine',140,28,0.5,0.5*distVol(d));},
  door:()=>aNoise(0.7,260,0.25,90),

function music(dt){
  if(!AC||!humOn)return;
  if(!humStarted){
    humStarted=true;
    const o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o1.type='sine';o1.frequency.value=41;o2.type='triangle';o2.frequency.value=82.7;

const dbg={shots:0,hits:0};
function tryFire(){

    P.cells--;P.wT=0.55;flash=0.75;SFX.plasma();

  }else{
    P.wT=0.4;flash=0.55;SFX.pistol();

  }

}
function hitscan(ang,dmg){
  const rdx=Math.cos(ang),rdy=Math.sin(ang);
  let best=null,bt=1e9;
  const consider=(x,y,r,e)=>{
    const dx=x-P.x,dy=y-P.y,t=dx*rdx+dy*rdy;
    if(t<0.3||t>24||t>=bt)return;
    const perp=Math.abs(dx*rdy-dy*rdx);
    if(perp>r+0.10)return;
    // LOS to the near edge of the target, not its center (Doom-accurate)
    const hc=Math.sqrt(Math.max(0,r*r-perp*perp));
    const hitT=Math.max(0.3,t-hc);
    if(!los(P.x,P.y,P.x+rdx*hitT,P.y+rdy*hitT))return;
    best=e;bt=t;
  };
  for(const e of enemies)if(e.st<2)consider(e.x,e.y,e.big?0.55:0.45,e);
  if(!best)for(const it of items)if(it.t==='barrel'&&it.alive)consider(it.x,it.y,0.42,it);
  if(!best)return;
  dbg.hits++;
  if(best.t==='barrel'){best.alive=false;explode(best.x,best.y);return;}
  best.hp-=dmg;best.flash=0.15;if(best.st===0)best.st=1;alertT=6;
  SFX.hit(Math.hypot(best.x-P.x,best.y-P.y));
  const rng=mulberry(((best.x*1000+best.y*31)|0)^kills);
  for(let i=0;i<6;i++)sparks.push({x:best.x+(rng()-0.5)*0.3,y:best.y+(rng()-0.5)*0.3,z:0.35+rng()*0.4,
    vx:(rng()-0.5)*2,vy:(rng()-0.5)*2,vz:rng()*2,life:0.35+rng()*0.3});
  if(best.hp<=0){
    best.st=2;best.dieT=0;kills++;
    const d=Math.hypot(best.x-P.x,best.y-P.y);
    SFX.die(d);
    const r2=mulberry((best.x*57+best.y*91)|0);
    blobs.push({x:best.x+(r2()-0.5)*0.4,y:best.y+(r2()-0.5)*0.4});
    blobs.push({x:best.x+(r2()-0.5)*0.5,y:best.y+(r2()-0.5)*0.5});
    if(blobs.length>40)blobs.splice(0,blobs.length-40);
  }
}

  for(const e of enemies){
    if(e.st>=2)continue;
    const d=Math.hypot(e.x-x,e.y-y);
    if(d<2.6){e.hp-=90*(1-d/2.6)+30;e.flash=0.2;
      if(e.hp<=0){e.st=2;e.dieT=0;kills++;SFX.die(d);blobs.push({x:e.x,y:e.y});}}
  }
  for(const it of items)if(it.t==='barrel'&&it.alive&&Math.hypot(it.x-x,it.y-y)<2.6){
    it.alive=false;setTimeout(()=>explode(it.x,it.y),180);}
  const dp=Math.hypot(P.x-x,P.y-y);
  if(dp<2.4)hurtPlayer(34*(1-dp/2.4)+6);
}

function canStand(x,y,r){
  return !solid(x-r,y-r)&&!solid(x+r,y-r)&&!solid(x-r,y+r)&&!solid(x+r,y+r);
}
// BFS flow field to the player so endoskeletons path around pillars/rooms
const flow=new Uint16Array(MW*MH);
let flowT=0;
function computeFlow(){
  flow.fill(65535);
  const q=new Int32Array(MW*MH);
  let h=0,t=0;
  const start=(Math.floor(P.y)*MW+Math.floor(P.x));
  flow[start]=0;q[t++]=start;
  while(h<t){
    const c=q[h++],x=c%MW,y=(c/MW)|0,d=flow[c];
    for(let k=0;k<4;k++){
      const nx=x+(k===0?1:k===1?-1:0),ny=y+(k===2?1:k===3?-1:0);
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const v=M(nx,ny);
      let pass=v===0||v===T_DOOR||(v===T_REDD&&P.key);
      if(pass&&flow[ny*MW+nx]>d+1){flow[ny*MW+nx]=d+1;q[t++]=ny*MW+nx;}
    }
  }
}
function update(dt){
  if(msgT>0)msgT-=dt;
  if(announceT>0){announceT-=dt;if(announceT<=0)msg('⚠ T-800 PROTOTYPE DETECTED',4);}
  flash=Math.max(0,flash-dt*2.4);
  redFlash=Math.max(0,redFlash-dt*3);
  shake=Math.max(0,shake-dt*2.6);
  if(state==='inter'){interT-=dt;if(interT<=0)resetWave(wave+1),state='play';return;}
  if(state!=='play')return;

  for(const s of spawnQ)s.t-=dt;
  while(spawnQ.length&&spawnQ[0].t<=0){
    const s=spawnQ.shift();
    enemies.push(makeEnemy(s.x,s.y,s.big));
    SFX.spawn(Math.hypot(s.x-P.x,s.y-P.y));
    const rng=mulberry(((s.x*100+s.y*7)|0)^enemies.length);
    for(let i=0;i<10;i++)sparks.push({x:s.x,y:s.y,z:0.2+rng()*0.5,vx:(rng()-0.5)*2,vy:(rng()-0.5)*2,vz:rng()*2,life:0.4});
  }
  alertT-=dt;

  for(const d of doors.values()){
    const pcx=d.x+0.5,pcy=d.y+0.5;
    const pd=Math.max(Math.abs(P.x-pcx),Math.abs(P.y-pcy));
    let trig=false;
    if(pd<1.15){
      if(!d.red)trig=true;
      else if(P.key){if(d.st===0){msg('RED KEYCARD ACCEPTED');SFX.pick();}trig=true;}
      else if(d.st===0&&pd<1.6&&msgT<=0){msg('RED KEYCARD REQUIRED');SFX.denied();}
    }
    if(!trig)for(const e of enemies){
      if(e.st>=2)continue;
      if(d.red&&!P.key)continue;
      if(Math.max(Math.abs(e.x-pcx),Math.abs(e.y-pcy))<1.05){trig=true;break;}
    }
    if(trig&&d.st<2){if(d.st===0){d.st=1;if(Math.hypot(P.x-pcx,P.y-pcy)<8)SFX.door();}d.timer=2.6;}
    if(d.st===1){d.open=Math.min(1,d.open+dt*1.8);if(d.open>=1)d.st=2;}
    else if(d.st===2){if(d.timer>0)d.timer-=dt;else if(!trig)d.st=3;}
    else if(d.st===3){d.open=Math.max(0,d.open-dt*1.2);if(d.open<=0)d.st=0;}
    else if(d.open>0){d.open=Math.min(1,d.open+dt*1.8);if(d.open>=1)d.st=2;}
  }

  let fwd=0,str=0;
  if(keys.KeyW||keys.ArrowUp)fwd+=1;
  if(keys.KeyS||keys.ArrowDown)fwd-=1;
  if(keys.KeyA)str-=1;
  if(keys.KeyD)str+=1;
  if(keys.ArrowLeft)P.a-=2.2*dt;
  if(keys.ArrowRight)P.a+=2.2*dt;
  if(joy){fwd+=-joy.dy;str+=joy.dx;}
  const run=(keys.ShiftLeft||keys.ShiftRight)?1.55:1;
  const sp=3.1*run;
  const ca=Math.cos(P.a),sa=Math.sin(P.a);
  let mvx=(ca*fwd-sa*str)*sp,mvy=(sa*fwd+ca*str)*sp;
  const ml=Math.hypot(mvx,mvy);if(ml>sp){mvx*=sp/ml;mvy*=sp/ml;}
  if(mvx){const nx=P.x+mvx*dt;if(canStand(nx,P.y,0.32))P.x=nx;}
  if(mvy){const ny=P.y+mvy*dt;if(canStand(P.x,ny,0.32))P.y=ny;}
  P.bob+=(ml>0.1?ml*dt*2.2:0);
  if(AUTOFIRE){
    let ae=null,ad=1e9;
    for(const e of enemies){if(e.st>=2)continue;
      const d=Math.hypot(e.x-P.x,e.y-P.y);
      if(d<ad&&los(P.x,P.y,e.x,e.y)){ad=d;ae=e;}}
    if(ae){
      const ta=Math.atan2(ae.y-P.y,ae.x-P.x);
      let da=ta-P.a;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
      P.a+=clamp(da,-4*dt,4*dt);
    }
    tryFire();
  }
  if(fireHeld)tryFire();
  P.wT-=dt;P.kick=Math.max(0,P.kick-dt*6);

  for(const it of items){
    if(!it.alive||it.t==='barrel')continue;
    if(Math.abs(it.x-P.x)<0.7&&Math.abs(it.y-P.y)<0.7){
      if(it.t==='med'){if(P.hp>=100)continue;it.alive=false;P.hp=Math.min(100,P.hp+25);msg('+25 HEALTH');SFX.pick();}
      else if(it.t==='cell'){it.alive=false;P.cells+=12;msg('+12 ENERGY CELLS');SFX.pick();}
      else if(it.t==='key'){it.alive=false;P.key=true;msg('RED KEYCARD ACQUIRED');SFX.pick();}
      else if(it.t==='gun'){it.alive=false;P.hasGun=true;P.cells+=20;P.weapon=1;msg('PLASMA CARBINE +20 CELLS');SFX.pick();}
    }
  }
  if(waveCleared&&Math.hypot(P.x-EXX,P.y-EXY)<0.9){
    SFX.win();state='inter';interT=3;msg('SECTOR 07 SECURED',3);waveActive=false;
  }

  for(const e of enemies){
    e.flash=Math.max(0,e.flash-dt*5);
    if(e.st>=2){e.dieT+=dt;continue;}
    e.cd-=dt;e.stepT-=dt;e.servoT-=dt;e.atkT=Math.max(0,e.atkT-dt);
    const dx=P.x-e.x,dy=P.y-e.y,dist=Math.hypot(dx,dy);
    if(e.st===0){
      if(dist<2.5||alertT>0||dist<9||(dist<14&&los(e.x,e.y,P.x,P.y)))e.st=1;
    }
    if(e.st===1){
      e.anim+=dt*e.spd*3.4;
      flowT-=dt;
      if(flowT<=0){flowT=0.4;computeFlow();}
      let tx,ty;
      if(los(e.x,e.y,P.x,P.y)){tx=P.x;ty=P.y;}
      else{
        const cx=Math.floor(e.x),cy=Math.floor(e.y);
        let bestF=flow[cy*MW+cx],bx=-1,by=-1;
        for(let k=0;k<4;k++){
          const nx2=cx+(k===0?1:k===1?-1:0),ny2=cy+(k===2?1:k===3?-1:0);
          if(nx2<0||ny2<0||nx2>=MW||ny2>=MH)continue;
          const f=flow[ny2*MW+nx2];
          if(f<bestF){bestF=f;bx=nx2;by=ny2;}
        }
        if(bx<0){tx=P.x;ty=P.y;}else{tx=bx+0.5;ty=by+0.5;}
      }
      const ddx=tx-e.x,ddy=ty-e.y,dd=Math.hypot(ddx,ddy)||1;
      const nx=ddx/dd*e.spd*dt,ny=ddy/dd*e.spd*dt;
      if(canStand(e.x+nx,e.y,0.38))e.x+=nx;
      if(canStand(e.x,e.y+ny,0.38))e.y+=ny;
      if(e.stepT<=0){e.stepT=0.55;SFX.step(dist);}
      if(e.servoT<=0){e.servoT=1.4+Math.random()*1.8;if(dist<12)SFX.servo(dist);}
      if(dist<1.15&&e.cd<=0){
        e.cd=1.25+Math.random()*0.5;e.atkT=0.45;
        hurtPlayer(e.big?(16+Math.random()*12):(9+Math.random()*9));
        SFX.melee(dist);
        if(dist>0.01){
          const kx=P.x-dx/dist*0.15,ky=P.y-dy/dist*0.15;
          if(canStand(kx,ky,0.32)){P.x=kx;P.y=ky;}
        }
      }
    }
  }
  for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){
    const a=enemies[i],b=enemies[j];if(a.st>=2||b.st>=2)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<0.8&&d>0.001){const push=(0.8-d)*0.25;
      a.x-=dx/d*push;a.y-=dy/d*push;b.x+=dx/d*push;b.y+=dy/d*push;}
  }
  enemies=enemies.filter(e=>!(e.st>=2&&e.dieT>8));

  if(!waveCleared&&spawnQ.length===0&&enemies.every(e=>e.st>=2)){
    waveCleared=true;waveActive=false;
    msg('SECTOR CLEARED — REACH THE EXTRACTION PAD',6);
  }

  for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;s.vz-=6*dt;s.life-=dt;}
  sparks=sparks.filter(s=>s.life>0&&s.z>0);
  for(const b of booms)b.t+=dt;
  booms=booms.filter(b=>b.t<0.45);
  music(dt);
}

// ---------- render ----------
function shadeK(d){return 1/(1+d*d*0.0135);}
function renderWorld(t){
  horizon=VH*0.5+(shake>0?Math.sin(t*61)*shake*3:0);
  const flick=0.02*Math.sin(t*17)+0.015*Math.sin(t*7.3);
  const amb=flash+flick;
  const ca=Math.cos(P.a),sa=Math.sin(P.a);
  const pl=0.80*(W/VH)/(400/216);
  const plX=-sa*pl,plY=ca*pl;
  const blink=(t*1.6|0)%2===0;
  // floor + ceiling
  const rdx0=ca-plX,rdy0=sa-plY,rdx1=ca+plX,rdy1=sa+plY;
  for(let y=0;y<VH;y++){
    const dy=y-horizon;
    if(Math.abs(dy)<0.5)continue;
    const rowDist=0.5*VH/Math.abs(dy);
    const k=Math.min(1.7,shadeK(rowDist)+amb);
    const stepX=rowDist*(rdx1-rdx0)/W,stepY=rowDist*(rdy1-rdy0)/W;
    let fx=P.x+rowDist*rdx0,fy=P.y+rowDist*rdy0;
    const tex=(dy>0)?TEX[T_FLOOR]:TEX[T_CEIL];
    const off=y*W;
    for(let x=0;x<W;x++,fx+=stepX,fy+=stepY){
      const tx=(fx*64)&63,ty=(fy*64)&63;
      buf32[off+x]=packShade(tex[ty*64+tx],k,0);
    }
  }
  // walls
  for(let x=0;x<W;x++){
    const camX=2*x/W-1;
    const rdx=ca+plX*camX,rdy=sa+plY*camX;
    let mX=Math.floor(P.x),mY=Math.floor(P.y);
    const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);
    let stepX,stepY,sdx,sdy;
    if(rdx<0){stepX=-1;sdx=(P.x-mX)*ddx;}else{stepX=1;sdx=(mX+1-P.x)*ddx;}
    if(rdy<0){stepY=-1;sdy=(P.y-mY)*ddy;}else{stepY=1;sdy=(mY+1-P.y)*ddy;}
    let side=0,wallDist=0,tile=0,doorHit=null,guard=0;
    while(guard++<64){
      if(sdx<sdy){sdx+=ddx;mX+=stepX;side=0;}else{sdy+=ddy;mY+=stepY;side=1;}
      const v=M(mX,mY);
      const pd=(side===0)?sdx-ddx:sdy-ddy;
      if(v===0)continue;
      if(v===T_DOOR||v===T_REDD){
        const d=doors.get(mY*MW+mX);
        if(d&&d.open>0.05){if(!doorHit)doorHit={d,dist:pd,side};continue;}
        wallDist=pd;tile=v;break;
      }
      wallDist=pd;tile=v;break;
    }
    if(wallDist<0.01)wallDist=0.01;
    const lineH=VH/wallDist;
    const top=horizon-lineH/2,bot=horizon+lineH/2;
    let wallX=(side===0)?P.y+wallDist*rdy:P.x+wallDist*rdx;
    wallX-=Math.floor(wallX);
    let texX=(wallX*64)|0;if(texX>63)texX=63;
    if((side===0&&rdx>0)||(side===1&&rdy<0))texX=63-texX;
    let tex=TEX[tile];
    if(tile===T_COMP)tex=blink?TEX[T_COMP2]:TEX[T_COMP];
    const kf=Math.min(1.7,shadeK(wallDist)*(side===1?0.8:1)+amb);
    let y0=top<0?0:Math.ceil(top),y1=bot>=VH?VH-1:Math.floor(bot);
    const texStep=64/lineH;
    let texY=(y0-top)*texStep;
    let off=y0*W+x;
    for(let y=y0;y<=y1;y++,off+=W,texY+=texStep){
      let tyi=texY|0;if(tyi<0)tyi=0;if(tyi>63)tyi=63;
      buf32[off]=packShade(tex[tyi*64+texX],kf,0);
    }
    zbuf[x]=wallDist;
    // rising door slab
    if(doorHit&&doorHit.dist<wallDist-0.001){
      const d=doorHit.d,dd=Math.max(0.05,doorHit.dist);
      const doorH=VH/dd;
      const dTop=horizon-doorH/2;
      const sEnd=horizon+doorH/2-d.open*doorH;
      const sTop=dTop<0?0:Math.ceil(dTop);
      if(sEnd>sTop){
        // door face texture coordinate along the door plane
        let wx=(doorHit.side===0)?P.y+dd*rdy:P.x+dd*rdx;
        wx-=Math.floor(wx);
        let tx2=(wx*64)|0;if(tx2>63)tx2=63;
        if((doorHit.side===0&&rdx>0)||(doorHit.side===1&&rdy<0))tx2=63-tx2;
        const dtex=TEX[d.red?T_REDD:T_DOOR];
        const texStep2=64/doorH;
        const kd=Math.min(1.7,shadeK(dd)*(doorHit.side===1?0.8:1)+amb);
        let off2=sTop*W+x;
        for(let y=sTop;y<=sEnd&&y<VH;y++,off2+=W){
          let tyi=((y-dTop)*texStep2)|0;if(tyi<0)tyi=0;if(tyi>63)tyi=63;
          buf32[off2]=packShade(dtex[tyi*64+tx2],kd,0);
        }
        zbuf[x]=dd;
      }
    }
  }
  // sprites far→near
  const sprs=[];
  for(const it of items)if(it.alive)
    sprs.push({x:it.x,y:it.y,sp:it.t==='barrel'?SPR_BARREL:it.t==='med'?SPR_MED:it.t==='cell'?SPR_CELL:it.t==='key'?SPR_KEY:SPR_GUN,fl:0});
  for(const b of blobs)sprs.push({x:b.x,y:b.y,sp:SPR_BLOB,fl:0});
  sprs.push({x:EXX,y:EXY,sp:SPR_PAD,fl:waveCleared?0.35+0.2*Math.sin(t*6):0});
  for(const e of enemies){
    const S=e.big?SPR_BIG:SPR_ENDO;
    let sp;
    if(e.st>=2)sp=S.die[e.dieT<0.35?0:e.dieT<0.8?1:2];
    else if(e.atkT>0)sp=S.atk[((e.atkT*10)|0)%2];
    else if(e.st===1)sp=S.walk[((e.anim|0)%4)];
    else sp=S.walk[0];
    sprs.push({x:e.x,y:e.y,sp,fl:e.flash*400});
  }
  for(const b of booms)sprs.push({x:b.x,y:b.y,sp:SPR_BOOM[Math.min(2,(b.t*6.7)|0)],fl:0});
  const d2=(s)=>{const dx=s.x-P.x,dy=s.y-P.y;return dx*dx+dy*dy;};
  sprs.sort((a,b)=>d2(b)-d2(a));
  const invDet=1/(plX*sa-ca*plY);
  for(const s of sprs){
    const dx=s.x-P.x,dy=s.y-P.y;
    const tX=invDet*(sa*dx-ca*dy);
    const tY=invDet*(-plY*dx+plX*dy);
    if(tY<0.2)continue;
    const scr=(W/2)*(1+tX/tY);
    const sp=s.sp;
    const yTop=horizon+VH*(0.5-sp.z1)/tY;
    const yBot=horizon+VH*(0.5-sp.z0)/tY;
    const worldW=(sp.w/sp.h)*(sp.z1-sp.z0);
    const halfPx=(VH*(worldW/2))/tY;
    const x0=Math.max(0,Math.ceil(scr-halfPx)),x1=Math.min(W-1,Math.floor(scr+halfPx));
    const k=shadeK(tY)+amb;
    const y0v=yTop<0?0:Math.ceil(yTop),y1v=yBot>=VH?VH-1:Math.floor(yBot);
    if(y1v<y0v)continue;
    const span=yBot-yTop;
    const texStepY=sp.h/span;
    const texStepX=sp.w/(2*halfPx);
    for(let x=x0;x<=x1;x++){
      if(zbuf[x]<tY)continue;
      let tx=((x-(scr-halfPx))*texStepX)|0;
      if(tx<0)tx=0;if(tx>=sp.w)tx=sp.w-1;
      let texY=(y0v-yTop)*texStepY;
      let off=y0v*W+x;
      for(let y=y0v;y<=y1v;y++,off+=W,texY+=texStepY){
        const c=sp.d[((texY|0)*sp.w)+tx];
        const a=c>>>24;
        if(a<128)continue;
        let kk=k;
        // glowing red eyes / hot parts keep brightness
        if((c&255)>200&&(c>>>8&255)<80)kk=Math.max(kk,0.9);
        buf32[off]=packShade(c,kk,s.fl);
      }
    }
  }
  ctx.putImageData(img,0,0);
}
function renderFx(t){
  // sparks (z-tested)
  const ca=Math.cos(P.a),sa=Math.sin(P.a);
  const pl=0.80*(W/VH)/(400/216);
  const plX=-sa*pl,plY=ca*pl;
  const invDet=1/(plX*sa-ca*plY);
  for(const s of sparks){
    const dx=s.x-P.x,dy=s.y-P.y;
    const tX=invDet*(sa*dx-ca*dy);
    const tY=invDet*(-plY*dx+plX*dy);
    if(tY<0.25)continue;
    const scr=(W/2)*(1+tX/tY);
    if(scr<0||scr>=W||zbuf[scr|0]<tY)continue;
    const y=horizon+VH*(0.5-s.z)/tY;
    if(y<0||y>=VH)continue;
    const sz=Math.max(1,VH*0.02/tY);
    ctx.fillStyle=s.life>0.25?'#ffb63c':'#8d4a1c';
    ctx.fillRect(scr-sz/2,y-sz/2,sz,sz);
  }
  // weapon view model
  const bobY=Math.sin(P.bob)*2.2,bobX=Math.cos(P.bob*0.5)*1.6;
  const kick=P.kick*7;
  const gx=W/2+30+bobX,gy=VH-6+bobY+kick;
  ctx.save();
  if(P.weapon===1){
    ctx.fillStyle='#20242b';
    ctx.fillRect(gx-34,gy-34,64,13);      // body
    ctx.fillRect(gx+22,gy-56,9,26);       // barrel
    ctx.fillStyle='#39414c';
    ctx.fillRect(gx-30,gy-21,16,14);      // grip
    ctx.fillRect(gx+16,gy-46,21,4);       // rail
    const pulse=0.5+0.5*Math.sin(t*9);
    ctx.fillStyle=`rgba(255,52,24,${0.6+0.4*pulse})`;
    ctx.fillRect(gx-16,gy-31,8,7);        // energy cell
    ctx.fillStyle='#57606a';
    ctx.fillRect(gx+24,gy-54,5,22);
  }else{
    ctx.fillStyle='#24282f';
    ctx.fillRect(gx-8,gy-26,22,12);       // slide
    ctx.fillRect(gx-2,gy-34,10,9);        // muzzle
    ctx.fillStyle='#3a3428';
    ctx.fillRect(gx-4,gy-15,12,17);       // grip
    ctx.fillStyle='#454d58';
    ctx.fillRect(gx-6,gy-24,18,3);
  }
  if(P.kick>0.6){
    const fx2=P.weapon===1?gx+26:gx+3,fy2=P.weapon===1?gy-60:gy-36;
    ctx.fillStyle='#ffd870';
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4,r=i%2?4:11;
      const px=fx2+Math.cos(a)*r,py=fy2+Math.sin(a)*r;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
  // scanlines + vignette
  ctx.fillStyle='rgba(255,20,10,0.05)';
  for(let y=0;y<VH;y+=3)ctx.fillRect(0,y,W,1);
  ctx.drawImage(vign,0,0);
  // red damage flash
  if(redFlash>0){ctx.fillStyle=`rgba(255,0,0,${redFlash*0.35})`;ctx.fillRect(0,0,W,VH);}
  // crosshair + target bracket
  const tgt=reticleTarget();
  const cx2=W/2,cy2=horizon;
  ctx.strokeStyle='#ff4a3c';ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(cx2-6,cy2);ctx.lineTo(cx2-2,cy2);
  ctx.moveTo(cx2+2,cy2);ctx.lineTo(cx2+6,cy2);
  ctx.moveTo(cx2,cy2-6);ctx.lineTo(cx2,cy2-2);
  ctx.moveTo(cx2,cy2+2);ctx.lineTo(cx2,cy2+6);
  ctx.stroke();
  if(tgt){
    ctx.strokeStyle='#ff5a3c';
    const r=tgt.r;
    ctx.beginPath();
    for(const[sx,sy]of[[-1,-1],[1,-1],[-1,1],[1,1]]){
      ctx.moveTo(cx2+sx*r,cy2+sy*r-sy*r*0.4);
      ctx.lineTo(cx2+sx*r,cy2+sy*r);
      ctx.lineTo(cx2+sx*r-sx*r*0.4,cy2+sy*r);
    }
    ctx.stroke();
    ctx.fillStyle='#ff5a3c';ctx.font='bold 7px monospace';
    ctx.fillText('TARGET',cx2-12,cy2-r-4);
  }
  // message
  if(msgT>0&&state==='play'){
    ctx.font='bold 10px monospace';
    ctx.fillStyle='rgba(0,0,0,0.6)';
    const tw=ctx.measureText(msgText).width;
    ctx.fillRect(W/2-tw/2-4,VH-16,tw+8,13);
    ctx.fillStyle='#ffd23c';
    ctx.fillText(msgText,W/2-tw/2,VH-6);
  }
}
function reticleTarget(){
  if(state!=='play')return null;
  const ca=Math.cos(P.a),sa=Math.sin(P.a);
  let best=null,bd=0.10;
  for(const e of enemies){
    if(e.st>=2)continue;
    const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy);
    if(d>18||!los(P.x,P.y,e.x,e.y))continue;
    const perp=Math.abs(dx*sa-dy*ca)/d;
    if(perp<0.10&&perp<bd){bd=perp;best=e;}
  }
  if(!best)return null;
  const d=Math.hypot(best.x-P.x,best.y-P.y);
  const worldH=(best.big?1.12:0.95)*0.66;
  const halfPx=(VH*worldH/2)/d;
  return{r:clamp(halfPx,8,30)};
}
function renderBar(){
  const y0=VH;
  ctx.fillStyle='#15181d';ctx.fillRect(0,y0,W,BAR);
  ctx.fillStyle='#30353d';ctx.fillRect(0,y0,W,1);
  ctx.fillStyle='#3c434c';
  for(let x=10;x<W;x+=24)ctx.fillRect(x,y0+3,2,2);

  ctx.fillStyle='#ff4a3c';ctx.font='bold 16px monospace';
  ctx.fillText(String(Math.max(0,Math.round(P.hp))),10,y0+27);
  ctx.font='bold 8px monospace';
  ctx.fillStyle='#9aa1ab';ctx.fillText(P.weapon?'CELLS':'9MM',74,y0+10);
  ctx.fillStyle='#ffcc33';ctx.font='bold 16px monospace';
  ctx.fillText(P.weapon?String(P.cells):'\u221E',74,y0+27);
  // endo face, cracks with damage
  ctx.drawImage(faceCnv,W/2-17,y0-3,34,32);

    ctx.strokeStyle='#1a1d22';ctx.lineWidth=1.4;
    const rng=mulberry(42);
    const n=Math.floor(dmg*6);
    for(let i=0;i<n;i++){
      const x=W/2-14+rng()*28,y=y0+rng()*24;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(rng()-0.5)*10,y+(rng()-0.5)*10);ctx.stroke();
    }
  }
  if(P.key){
    ctx.fillStyle='#c0281e';ctx.fillRect(W/2+24,y0+12,10,14);
    ctx.fillStyle='#e8d8a0';ctx.fillRect(W/2+26,y0+16,6,2);
  }
  ctx.textAlign='right';
  ctx.font='bold 11px monospace';
  ctx.fillStyle='#ff4a3c';ctx.fillText('WAVE '+wave,W-10,y0+13);
  ctx.font='bold 9px monospace';
  ctx.fillStyle='#c9d0d8';ctx.fillText('TERMINATED '+kills,W-10,y0+26);
  ctx.textAlign='left';
}
function renderBoot(t){
  ctx.fillStyle='#05060a';ctx.fillRect(0,0,W,H);
  const lines=[
    'SKYNET GLOBAL DEFENSE NETWORK',
    '================================',
    'UPLINK ................ ESTABLISHED',
    'COMBAT MODEL .......... T-800 // ONLINE',
    'MEMORY ................ 6 TB (CORRUPTED)',
    'MISSION ............... PURGE RESISTANCE CELL',
    'LOCATION .............. SECTOR 07 / UNDERGROUND CORE',
    '',
    'WASD MOVE   MOUSE AIM   CLICK FIRE   SHIFT RUN',
    '1/2 WEAPONS   9MM INFINITE   FIND THE PLASMA CARBINE',
    'TOUCH: LEFT=MOVE  RIGHT=LOOK  FIRE=BUTTON',
  ];
  const totalChars=lines.reduce((a,l)=>a+l.length,0);
  const shown=Math.floor(t*46);
  ctx.font='10px monospace';
  let ci=0;
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    const vis=clamp(shown-ci,0,l.length);
    if(vis>0){
      ctx.fillStyle=i===0?'#ff4a3c':'#c8b46a';
      if(i===0){ctx.font='bold 14px monospace';ctx.fillText(l.slice(0,vis),30,40);ctx.font='10px monospace';}
      else ctx.fillText(l.slice(0,vis),30,40+i*14);
    }
    ci+=l.length;
  }
  if(shown>totalChars&&Math.sin(t*6)>-0.3){
    ctx.fillStyle='#ff5a3c';ctx.font='bold 13px monospace';
    ctx.fillText(isTouch?'TAP TO ENGAGE':'CLICK TO ENGAGE',W/2-62,H-34);
  }
  ctx.fillStyle='rgba(255,20,10,0.05)';
  for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
}
function renderDead(){
  ctx.fillStyle='rgba(80,0,0,0.55)';ctx.fillRect(0,0,W,H);
  const rng=mulberry((performance.now()/100)|0);
  ctx.fillStyle='rgba(255,40,30,0.25)';
  for(let i=0;i<8;i++)ctx.fillRect(0,rng()*H,W,1+rng()*2);
  ctx.fillStyle='#ff4a3c';ctx.font='bold 22px monospace';
  ctx.fillText('SYSTEM TERMINATED',W/2-105,H/2-20);
  ctx.fillStyle='#c8b46a';ctx.font='11px monospace';
  ctx.fillText('UNITS TERMINATED: '+kills+'   WAVE: '+wave,W/2-92,H/2+4);
  ctx.fillStyle='#e8e8ea';ctx.font='bold 11px monospace';
  ctx.fillText(isTouch?'TAP TO REBOOT':'CLICK TO REBOOT',W/2-58,H/2+34);
}
function renderInter(){
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ff4a3c';ctx.font='bold 20px monospace';
  ctx.fillText('SECTOR 07 SECURED',W/2-96,H/2-16);
  ctx.fillStyle='#c8b46a';ctx.font='12px monospace';
  ctx.fillText('WAVE '+(wave+1)+' DETECTED — RE-ENGAGING',W/2-104,H/2+10);
}

// ---------- main loop + adaptive quality ----------
// small internal test hooks used by capture/CI scripts (invisible in UI)
window.__test={
  goto:(x,y,a)=>{P.x=x;P.y=y;if(a!==undefined)P.a=a;},
  all:()=>{P.key=true;P.hasGun=true;P.cells=99;},
  clear:()=>{for(const e of enemies)if(e.st<2){e.st=2;e.dieT=0;}spawnQ.length=0;},
  state:()=>state,
};
window.__perf={fps:0,frame:0,wave:STARTWAVE,enemies:0,hp:100,kills:0,mean:0,var:0,state:'boot'};
let last=performance.now(),ema=16.7,probeN=0,qCool=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt>0.1)dt=0.1;
  const t=now/1000;
  ema=ema*0.9+dt*1000*0.1;
  qCool-=dt;
  if(!FORCE_RES){
    if(ema>31&&W>320&&qCool<=0){setRes(320,200);qCool=5;}
    else if(ema<21&&W<400&&qCool<=0){setRes(400,250);qCool=5;}
  }
  if(state==='boot'){
    if(AUTOSTART){start();}
    else{renderBoot(t);return;}
  }
  update(dt);
  renderWorld(t);
  renderFx(t);
  renderBar();
  if(state==='dead')renderDead();
  if(state==='inter')renderInter();
  // probe
  probeN++;
  if(probeN%20===0){
    let mean=0,m2=0;const n=120;
    const rng=mulberry(probeN);
    for(let i=0;i<n;i++){
      const c=buf32[(rng()*W*VH)|0];
      const l=0.2126*(c&255)+0.7152*(c>>>8&255)+0.0722*(c>>>16&255);
      mean+=l;m2+=l*l;
    }
    mean/=n;m2/=n;
    window.__perf={fps:Math.round(1000/Math.max(1,ema)),frame:probeN,wave,waveCleared,
      enemies:enemies.filter(e=>e.st<2).length,hp:Math.round(P.hp),kills,
      mean:Math.round(mean),var:Math.round(m2-mean*mean),state,
      pos:[+P.x.toFixed(2),+P.y.toFixed(2)],
      e:enemies.map(e=>[+e.x.toFixed(2),+e.y.toFixed(2),e.st]),
      shots:dbg.shots,hits:dbg.hits,btn:dbg.btn||0,res:W,msg:msgT>0?msgText:''};
  }
}
requestAnimationFrame(frame);
</script>
