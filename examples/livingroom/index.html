<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Living Room — WebGPU Real-Time</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; }

    #hud {
      position: absolute; top: 12px; left: 12px; width: 280px;
      background: rgba(15, 15, 17, 0.82); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 10px;
      color: #e6e6e6; padding: 12px 14px; font-size: 12px; line-height: 1.45;
      user-select: none;
    }
    #hud h1 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
    #stats { color: #9ad0a0; white-space: pre-wrap; margin-bottom: 8px; }
    #hud .row { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; gap: 8px; }
    #hud label { color: #b9b9b9; }
    #hud input[type=range] { width: 128px; }
    #hud select, #hud button {
      background: #26262b; color: #e6e6e6; border: 1px solid #3c3c44;
      border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer;
    }
    #hud button:hover { background: #33333a; }
    #hud .value { color: #f0f0f0; min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
    #hud .hint { color: #8a8a90; font-size: 11px; margin-top: 8px; }

    #error {
      position: absolute; inset: 0; display: none; place-items: center;
      color: #f0f0f0; background: #16161a; padding: 40px; text-align: center; font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Living Room · WebGPU Real-Time</h1>
    <div id="stats">Loading…</div>
    <div class="row">
      <label for="cameraSelect">Camera</label>
      <select id="cameraSelect"></select>
    </div>
    <div class="row">
      <label for="exposure">Exposure</label>
      <input id="exposure" type="range" min="0.2" max="3" step="0.01" />
      <span class="value" id="exposureVal"></span>
    </div>
    <div class="row">
      <label for="envRotation">Env rotation</label>
      <input id="envRotation" type="range" min="0" max="360" step="0.5" />
      <span class="value" id="envRotationVal"></span>
    </div>
    <div class="row">
      <label for="envIntensity">Env indirect</label>
      <input id="envIntensity" type="range" min="0" max="2" step="0.01" />
      <span class="value" id="envIntensityVal"></span>
    </div>
    <div class="row">
      <label for="sunIntensity">Sun</label>
      <input id="sunIntensity" type="range" min="0" max="5" step="0.02" />
      <span class="value" id="sunIntensityVal"></span>
    </div>
    <div class="row">
      <label for="bloomStrength">Bloom</label>
      <input id="bloomStrength" type="range" min="0" max="2" step="0.01" />
      <span class="value" id="bloomStrengthVal"></span>
    </div>
    <div class="row">
      <label for="bloomThreshold">Bloom thresh</label>
      <input id="bloomThreshold" type="range" min="0" max="1" step="0.01" />
      <span class="value" id="bloomThresholdVal"></span>
    </div>
    <div class="row">
      <label for="bloomRadius">Bloom radius</label>
      <input id="bloomRadius" type="range" min="0" max="1" step="0.01" />
      <span class="value" id="bloomRadiusVal"></span>
    </div>
    <div class="row">
      <label for="aoStrength">AO strength</label>
      <input id="aoStrength" type="range" min="0" max="2" step="0.01" />
      <span class="value" id="aoStrengthVal"></span>
    </div>
    <div class="row">
      <label for="aoRadius">AO radius</label>
      <input id="aoRadius" type="range" min="0.05" max="1" step="0.01" />
      <span class="value" id="aoRadiusVal"></span>
    </div>
    <div class="hint">Orbit: drag · zoom: wheel · pan: right-drag.<br/>
      AgX + exposure 1.15 mirrors Blender (AgX +0.2 EV).<br/>
      Sun position/color are sampled from the HDRI; its intensity is a separate slider.
      Nudge env rotation until sunlight enters the +Z window wall.</div>
  </div>
  <div id="error"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
