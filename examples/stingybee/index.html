      }
      if (e.type === 'picnicker' && !run && e.state !== 'angry') {
        ctx.fillStyle = '#ffe9b3'; ell(14, -38, 6, 3); ctx.fill();
        ctx.fillStyle = '#8bc34a'; rr(10, -44, 8, 5, 2); ctx.fill();
        ctx.fillStyle = '#f2c94c'; rr(10, -40, 8, 3, 2); ctx.fill();
        ctx.fillStyle = '#e57373'; rr(10, -38, 8, 3, 2); ctx.fill();
      }
      break;
    }
  }
  drawWelts(e);
  angryMarks(e);
  ctx.restore();
}

// ---- bees
function drawBeeBody(x, y, face, wingT, size, dizzy) {
  ctx.save(); ctx.translate(x, y); ctx.scale(face * size, size);
  // wings first (behind+front blur)
  const flap = Math.sin(wingT) * .9;
  ctx.fillStyle = 'rgba(230,246,255,.75)';
  ctx.save(); ctx.translate(-2, -10); ctx.rotate(-.5 - flap * .5); ell(6, 0, 12, 5); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(3, -10); ctx.rotate(.45 + flap * .55); ell(7, 0, 13, 5.5); ctx.fill(); ctx.restore();
  // body
  ctx.fillStyle = '#3a2d12';
  rr(-14, -9, 26, 18, 9); ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = '#ffd23e';
  rr(-14, -9, 26, 18, 9); ctx.fill();
  ctx.fillStyle = '#3a2d12';
  rr(-6, -9, 5, 18, 1); ctx.fill(); rr(3, -9, 5, 18, 1); ctx.fill();
  ctx.restore();
  // stinger
  ctx.fillStyle = '#dfe6ec';
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-20, -2); ctx.lineTo(-14, 3); ctx.closePath(); ctx.fill();
  // head
  ctx.fillStyle = '#ffd23e'; circle(15, -4, 8); ctx.fill();
  // eye
  if (dizzy) {
    ctx.strokeStyle = '#3a2d12'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(14, -8); ctx.lineTo(20, -2); ctx.moveTo(20, -8); ctx.lineTo(14, -2); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; circle(17, -6, 4.5); ctx.fill();
    ctx.fillStyle = '#222'; circle(18.5, -6, 2.2); ctx.fill();
    ctx.fillStyle = '#fff'; circle(19.4, -7, .8); ctx.fill();
  }
  // blush + smile
  ctx.fillStyle = 'rgba(255,120,120,.5)'; circle(13, -1, 2.2); ctx.fill();
  ctx.strokeStyle = '#3a2d12'; ctx.lineWidth = 1.2;
  if (!dizzy) { ctx.beginPath(); ctx.arc(17, -2, 3, .3, 2.4); ctx.stroke(); }
  // antennae
  ctx.strokeStyle = '#3a2d12'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(16, -11); ctx.quadraticCurveTo(22, -18, 25, -17); ctx.stroke();
  ctx.fillStyle = '#3a2d12'; circle(25, -17, 1.8); ctx.fill();
  ctx.restore();
}
function drawMiniBee(x, y, face, wingT, size) { drawBeeBody(x, y, face, wingT, size, false); }

function drawPlayer(t) {
  // trail
  for (const tr of player.trail) {
    const a = 1 - tr.t / .3;
    ctx.fillStyle = `rgba(255,220,90,${.18 * a})`;
    circle(tr.x, tr.y, 10 * a + 2); ctx.fill();
  }
  // shadow — bobbing altitude
  const bob = Math.sin(player.bobT) * 5;
  const alt = clamp(Math.hypot(player.vx, player.vy) / 600, 0, 1) * 8;
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ell(player.x, player.y + 14, 12 - alt * .4, 4.5 - alt * .15); ctx.fill();
  const sq = 1 + player.squash * .25;
  ctx.save();
  ctx.translate(player.x, player.y - 26 - bob - alt);
  ctx.scale(1 / sq, sq);
  if (player.dizzy > 0) {
    ctx.rotate(Math.sin(t * 20) * .3);
    // dizzy stars
    for (let i = 0; i < 3; i++) {
      const a = t * 6 + i / 3 * TAU;
      drawStar(Math.cos(a) * 22, Math.sin(a) * 10 - 16, 5, '#ffe27a');
    }
  }
  if (player.lungeT > 0) { ctx.rotate(Math.atan2(player.vy, player.vx * player.face) * player.face * .5); }
  drawBeeBody(0, 0, player.face, player.wingT, 1.15, player.dizzy > 0);
  ctx.restore();
}

function drawStar(x, y, r, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * TAU - Math.PI / 2, R = i % 2 ? r * .45 : r;
    const px = x + Math.cos(a) * R, py = y + Math.sin(a) * R;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}

// ------------------------------------------------------------------ HUD
function chip(x, y, w, h) {
  ctx.fillStyle = 'rgba(20,40,15,.42)';
  rr(x, y, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1.5;
  rr(x, y, w, h, h / 2); ctx.stroke();
}

function drawHUD() {
  ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const fs = clamp(15 * (cssW / 900), 12, 17);
  ctx.font = `bold ${16 + fs * .6}px system-ui`;
  ctx.textBaseline = 'middle';

  // stars chip
  const top = 12 + safeTop;
  chip(10 + safeL, top, 120, 40);
  drawStar(34 + safeL, top + 20, 12, '#ffd93d');
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.fillText(stars, 52 + safeL, top + 21);
  // mute chip (desktop / wide screens only)
  const mx = 140 + safeL;
  if (cssW >= 560) {
  chip(mx, top, 44, 40);
  ctx.fillStyle = A.muted ? '#888' : '#ffe27a';
  ctx.beginPath();
  ctx.moveTo(mx + 16, top + 26); ctx.lineTo(mx + 16, top + 14); ctx.lineTo(mx + 22, top + 14); ctx.lineTo(mx + 28, top + 8);
  ctx.lineTo(mx + 28, top + 32); ctx.lineTo(mx + 22, top + 26); ctx.closePath(); ctx.fill();
  if (!A.muted) { ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mx + 28, top + 20, 7, -.9, .9); ctx.stroke(); }
  else { ctx.strokeStyle = '#ff8a80'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(mx + 32, top + 12); ctx.lineTo(mx + 44, top + 28); ctx.moveTo(mx + 44, top + 12); ctx.lineTo(mx + 32, top + 28); ctx.stroke(); }
  }

  // gamepad status
  if (gpToastT > 0) {
    const t = gpToastT > 2.4 ? (3 - gpToastT) / .6 : gpToastT < .6 ? gpToastT / .6 : 1;
    ctx.globalAlpha = clamp(t, 0, 1);
    const w = 200;
    chip(cssW / 2 - w / 2, top + 56, w, 36);
    ctx.fillStyle = '#b9f6ca'; ctx.textAlign = 'center';
    drawGamepadIcon(cssW / 2 - 70, top + 74, .8);
    ctx.fillText('GAMEPAD READY', cssW / 2 + 12, top + 75);
    ctx.globalAlpha = 1;
  }

  // rank + honeycomb
  const rc = cssW < 560 ? 10.5 : 15, gap = 4, hw = 7 * (rc * 1.75 + gap);
  const hx = cssW - hw - 14 - safeR, hy = top;
  chip(hx - 12, hy, hw + 24, 44);
  ctx.fillStyle = '#ffe27a'; ctx.textAlign = 'right';
  ctx.font = `bold ${cssW < 560 ? 11 : 13}px system-ui`;
  ctx.fillText(rankOf(level) + ' · LV ' + level, cssW - 20 - safeR, hy + (cssW < 560 ? 11 : 12));
  const full = Math.floor(honey), frac = honey - full;
  for (let i = 0; i < 7; i++) {
    const cx = hx + i * (rc * 1.75 + gap) + rc, cy = hy + 30;
    hexPath(cx, cy, rc * .62);
    if (i < full) { ctx.fillStyle = '#f4b942'; ctx.fill(); }
    else if (i === full && frac > 0) {
      ctx.save(); ctx.clip(); ctx.fillStyle = '#f4b942';
      ctx.fillRect(cx - rc, cy + rc - rc * 2 * frac, rc * 2, rc * 2 * frac); ctx.restore();
    }
    ctx.strokeStyle = 'rgba(255,226,122,.6)'; ctx.lineWidth = 2; hexPath(cx, cy, rc * .62); ctx.stroke();
  }

  // which world are we in?
  if (started) {
    ctx.font = `800 ${cssW < 560 ? 11 : 13}px system-ui`; ctx.textAlign = 'center';
    const label = worldName + ' · WORLD ' + worldNum + ' · ' + THEME.tag;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,20,0,.5)';
    ctx.strokeText(label, cssW / 2, top + 52);
    ctx.fillStyle = 'rgba(255,246,216,.9)'; ctx.fillText(label, cssW / 2, top + 52);
  }

  // toasts
  let ty = top + (gpToastT > 0 ? 104 : 76);
  for (const tt of toasts) {
    const a = tt.t < .15 ? tt.t / .15 : tt.t > 2.9 ? (3.4 - tt.t) / .5 : 1;
    ctx.globalAlpha = clamp(a, 0, 1) * (tt.t < .3 ? ease(tt.t / .3) : 1);
    ctx.font = `900 ${clamp(cssW / 30, 18, 30)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(30,20,0,.75)';
    ctx.strokeText(tt.text, cssW / 2, ty);
    ctx.fillStyle = '#fff6d8'; ctx.fillText(tt.text, cssW / 2, ty);
    ctx.globalAlpha = 1;
    ty += 42;
  }

  // zone compass arrows (drawn in world space later — here just labels handled there)
  drawTouchControls();
  ctx.restore();
}

function hexPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU + Math.PI / 6;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawGamepadIcon(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#b9f6ca';
  rr(-16, -8, 32, 16, 8); ctx.fill();
  ctx.beginPath(); ctx.arc(-8, -2, 2, 0, TAU); ctx.arc(6, -3, 1.8, 0, TAU); ctx.arc(10, 1, 1.8, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawTouchControls() {
  if (touch.joyId !== -1) {
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3;
    circle(touch.ox, touch.oy, 44); ctx.stroke();
    const d = Math.hypot(touch.dx, touch.dy), m = Math.min(d, 44);
    const kx = touch.ox + (d ? touch.dx / d : 0) * m, ky = touch.oy + (d ? touch.dy / d : 0) * m;
    ctx.fillStyle = 'rgba(255,255,255,.4)'; circle(kx, ky, 22); ctx.fill();
  }
  const b = stingBtn();
  const pulse = 1 + Math.sin(tPlay * 4) * .03;
  ctx.save(); ctx.translate(b.x, b.y); ctx.scale(pulse, pulse);
  const grad = ctx.createRadialGradient(0, -b.r * .3, 10, 0, 0, b.r);
  grad.addColorStop(0, touch.btnHeld ? '#ffd54f' : '#ffca28');
  grad.addColorStop(1, touch.btnHeld ? '#ff8f00' : '#f57f17');
  ctx.fillStyle = grad;
  circle(0, 0, b.r); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; circle(0, 0, b.r); ctx.stroke();
  // bee glyph on button
  drawBeeBody(0, -b.r * .18, 1, tPlay * 40, b.r / 34, false);
  ctx.fillStyle = '#5b3a00'; ctx.font = `900 ${b.r * .32}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('STING!', 0, b.r * .62);
  ctx.restore();
}

// ---- zone compass (points to every POI plus the portal to the next world)
function drawCompass() {
  const vwHalf = cssW / 2 / SCALE, vhHalf = cssH / 2 / SCALE;
  for (const key in ZONES) {
    const z = ZONES[key];
    const dx = z.x - player.x, dy = z.y - player.y;
    if (Math.abs(dx) < vwHalf - 60 && Math.abs(dy) < vhHalf - 60) continue;
    const ex = clamp(z.x - cam.x, -vwHalf + 70, vwHalf - 70);
    const ey = clamp(z.y - cam.y, -vhHalf + 70, vhHalf - 70);
    ctx.save(); ctx.translate(ex, ey);
    ctx.fillStyle = 'rgba(20,40,15,.55)';
    hexPath(0, 0, 34); ctx.fill();
    ctx.strokeStyle = 'rgba(255,226,122,.35)'; ctx.lineWidth = 2; hexPath(0, 0, 34); ctx.stroke();
    ctx.save(); ctx.rotate(Math.atan2(dy, dx));
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(12, -8); ctx.lineTo(12, 8); ctx.closePath(); ctx.fill();
    ctx.restore();
    // icon
    if (key === 'hive') { ctx.fillStyle = '#f4b942'; ell(0, 2, 9, 7); ctx.fill(); }
    else if (key === 'picnic') { ctx.fillStyle = '#e2493f'; rr(-9, -6, 18, 13, 3); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -6, 5, Math.PI, 0); ctx.stroke(); }
    else if (key === 'barn') { ctx.fillStyle = '#b5382e'; rr(-9, -4, 18, 13, 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-11, -4); ctx.lineTo(0, -13); ctx.lineTo(11, -4); ctx.closePath(); ctx.fill(); }
    else if (key === 'pond') { ctx.fillStyle = '#5fb6e4'; ell(0, 2, 10, 7); ctx.fill(); }
    ctx.restore();
  }
  // the magic dandelion gets its own compass hex — endless worlds, that way
  {
    const dx = portal.x - player.x, dy = portal.y - player.y;
    if (!(Math.abs(dx) < vwHalf - 60 && Math.abs(dy) < vhHalf - 60)) {
      const ex = clamp(portal.x - cam.x, -vwHalf + 70, vwHalf - 70);
      const ey = clamp(portal.y - cam.y, -vhHalf + 70, vhHalf - 70);
      ctx.save(); ctx.translate(ex, ey);
      ctx.fillStyle = 'rgba(50,40,10,.6)';
      hexPath(0, 0, 34); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,170,.55)'; ctx.lineWidth = 2; hexPath(0, 0, 34); ctx.stroke();
      ctx.save(); ctx.rotate(Math.atan2(dy, dx));
      ctx.fillStyle = '#fff3b0';
      ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(12, -8); ctx.lineTo(12, 8); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.9)'; circle(0, 0, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.2;
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU + tPlay * .8;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 11, Math.sin(a) * 11); ctx.stroke();
      }
      ctx.restore();
    }
  }
}

// ------------------------------------------------------------------ main draw
function worldView() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const shx = (rng() - .5) * shake, shy = (rng() - .5) * shake;
  ctx.translate(cssW / 2 + shx, cssH / 2 + shy);
  ctx.scale(SCALE, SCALE);
  ctx.translate(-cam.x, -cam.y);
}

function visible(x, y, pad) {
  const vwHalf = cssW / 2 / SCALE + pad, vhHalf = cssH / 2 / SCALE + pad;
  return Math.abs(x - cam.x) < vwHalf && Math.abs(y - cam.y) < vhHalf;
}

function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = THEME ? `hsl(${THEME.ground.h}, ${THEME.ground.s}%, ${Math.max(4, THEME.ground.l - 10)}%)` : '#4e9e44';
  ctx.fillRect(0, 0, cssW, cssH);
  worldView();

  // ground
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(groundCv, 0, 0, Math.ceil(WW / GS), Math.ceil(WH / GS), 0, 0, WW, WH);

  // cloud shadows
  ctx.fillStyle = 'rgba(20,50,10,.08)';
  for (const cl of clouds) { if (visible(cl.x, cl.y, 400)) { ell(cl.x, cl.y, cl.rx, cl.ry); ctx.fill(); } }

  // zone labels on ground (subtle)
  ctx.font = '900 26px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const key in ZONES) {
    const z = ZONES[key];
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillText(z.name, z.x, z.y - z.r * .75);
  }

  drawPond(t);

  // ground-level decor
  for (const tf of tufts) if (visible(tf.x, tf.y, 30)) drawTuft(tf, t);
  for (const r of rocks) if (visible(r.x, r.y, 40)) drawRock(r);
  for (const dd of dandelionSpots) if (visible(dd.x, dd.y, 30)) drawDandelion(dd, t);
  drawAmbient(t);

  // sort-able actors by y
  const actors = [];
  for (const tr of trees) if (visible(tr.x, tr.y, 120)) actors.push([tr.y, () => drawTree(tr, t)]);
  for (const b of bushes) if (visible(b.x, b.y, 60)) actors.push([b.y, () => drawBush(b)]);
  for (const f of flowers) if (visible(f.x, f.y, 40)) actors.push([f.y, () => drawFlower(f, t)]);
  actors.push([HIVE.y, () => drawHive(t)]);
  actors.push([BARN.y + 80, () => drawBarn(t)]);
  actors.push([TABLE.y, () => drawPicnic(t)]);
  if (visible(portal.x, portal.y, 140)) actors.push([portal.y, () => drawPortal(t)]);
  for (const e of animals) if (e.state !== 'gone' && visible(e.x, e.y, 140)) actors.push([e.y, () => drawCritter(e, t)]);
  if (bear.state !== 'gone' && visible(bear.x, bear.y, 180)) actors.push([bear.y, () => drawCritter(bear, t)]);

  // bee is flying: draw above ground actors below her, below trees above — just use y-26
  actors.push([player.y - 26, () => drawPlayer(t)]);
  for (const b of buddies) if (visible(b.x, b.y, 60)) actors.push([b.y, () => drawBeeBody(b.x, b.y, b.face, b.wing, .62, false)]);

  actors.sort((a, b) => a[0] - b[0]);
  for (const [, fn] of actors) fn();

  // sting aim-lock — show little beekeepers exactly who they are about to sting
  if (started && player.dizzy <= 0) {
    const tgt = nearestTarget(STING_RANGE);
    if (tgt) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,226,122,.45)';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 9]);
      ctx.lineDashOffset = -tPlay * 40;
      circle(tgt.x, tgt.y - tgt.r * .8, tgt.r + 18 + Math.sin(tPlay * 6) * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
    ctx.fillStyle = p.col; circle(p.x, p.y, p.r * (1 - p.t / p.life * .5)); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const s of hitSpark) {
    ctx.globalAlpha = 1 - s.t / s.life;
    ctx.strokeStyle = '#fff3a3'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * .02, s.y - s.vy * .02); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const p of pops) {
    ctx.globalAlpha = clamp(1.2 - p.t, 0, 1);
    ctx.font = `900 ${p.size}px system-ui`; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,40,0,.6)';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  for (const p of confetti) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
    ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  drawCompass();

  // vignette
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const vg = ctx.createRadialGradient(cssW / 2, cssH / 2, Math.min(cssW, cssH) * .45, cssW / 2, cssH / 2, Math.max(cssW, cssH) * .72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,30,5,.35)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, cssW, cssH);

  drawHUD();

  // world-travel flash
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,250,225,${(flash * .95).toFixed(3)})`;
    ctx.fillRect(0, 0, cssW, cssH);
  }

  if (!started) drawStart();
}

// ---- start screen
function drawStart() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = 'rgba(10,26,4,.62)'; ctx.fillRect(0, 0, cssW, cssH);
  const cx = cssW / 2, cy = cssH / 2;
  const s = clamp(cssW / 800, .7, 1.4);

  ctx.save(); ctx.translate(cx, cy - 150 * s);
  ctx.scale(s, s);
  // logo card
  ctx.fillStyle = 'rgba(255,247,220,.96)';
  rr(-220, -90, 440, 190, 34); ctx.fill();
  ctx.strokeStyle = '#f4b942'; ctx.lineWidth = 8;
  rr(-220, -90, 440, 190, 34); ctx.stroke();
  ctx.fillStyle = '#5b3a00'; ctx.font = '900 58px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('STINGY BEE', 0, -26);
  ctx.fillStyle = '#8a5a17'; ctx.font = '700 20px system-ui';
  ctx.fillText('ENDLESS GARDEN MAY-HEM', 0, 26);
  // bouncing bee over the logo
  const bt = performance.now() / 1000;
  ctx.save(); ctx.translate(-172 + Math.sin(bt * 1.4) * 8, -90 + Math.sin(bt * 3) * 8);
  drawBeeBody(0, 0, 1, bt * 46, 1.6, false);
  ctx.restore();
  ctx.restore();

  ctx.fillStyle = '#fff6d8'; ctx.textAlign = 'center';
  ctx.font = `900 ${26 * s}px system-ui`;
  ctx.fillText('PRESS ANY KEY · ANY BUTTON · OR TAP', cx, cy + 60 * s);
  ctx.font = `700 ${15 * s}px system-ui`;
  ctx.fillStyle = 'rgba(255,246,216,.75)';
  ctx.fillText('GAMEPAD: left stick flies · A or RT stings      KEYBOARD: WASD flies · SPACE stings', cx, cy + 96 * s);
  ctx.fillText('TOUCH: drag to fly · big STING button — or just FLY INTO things!', cx, cy + 122 * s);
  ctx.fillText('sheep, geese, bunnies, frogs, goats, raccoons, owls, hedgehogs, penguins & flamingos await', cx, cy + 150 * s);
  ctx.fillStyle = '#ffe9a3';
  ctx.fillText('find the glowing MAGIC DANDELION — it blows you to a BRAND-NEW WORLD, forever & ever', cx, cy + 178 * s);
}

// ------------------------------------------------------------------ start & loop
function startGame() {
  if (started) return;
  started = true;
  A.ensure();
  addToast('FLY AROUND AND STING!');
  addToast('FIND THE MAGIC DANDELION!');
}

let lastT = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (freeze > 0) { freeze -= dt; dt *= 0.1; }
  if (started) update(dt);
  else {
    for (const cl of clouds) cl.x += cl.v * dt;
    hiveBees.forEach(hb => hb.a += hb.spd * dt);
    // gamepad can also start the game (and some browsers only report pads by polling)
    for (const gp of (navigator.getGamepads ? navigator.getGamepads() : [])) {
      if (!gp) continue;
      if (!gpConnected) { gpConnected = true; gpToastT = 3; }
      if (gp.buttons.some(b => b.pressed)) { startGame(); break; }
    }
  }
  draw(now / 1000);
  tickCount++;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener('visibilitychange', () => { lastT = performance.now(); });

// first world: ?world=NN picks the seed, otherwise every visit starts at world 1
// and marches onward through the magic dandelion. There are always more.
genWorld((() => {
  const w = parseInt(new URLSearchParams(location.search).get('world'), 10);
  return Number.isFinite(w) ? clamp(w, 1, 99999) : 1;
})());

// expose probe + test hooks for headless verification
let tickCount = 0;
window.__probe = {
  get stars() { return stars; },
  get level() { return level; },
  get t() { return tPlay; },
  get fled() { return animals.filter(a => a.state === 'gone' || a.state === 'fleeing').length + (bear.state === 'gone' || bear.state === 'fleeing' ? 1 : 0); },
  get bee() { return { x: player.x, y: player.y, started }; },
  get cd() { return player.cd; },
  get gp() { return gpConnected; },
  get targets() { return animals.filter(a => a.state === 'wander' || a.state === 'angry').map(a => ({ x: a.x, y: a.y, n: a.name || a.type })); },
  get frame() { return tickCount; },
  get animals() { return animals.length + 1; },
  get world() { return { num: worldNum, name: worldName, biome: THEME.id, size: [WW, WH], portal: { x: portal.x, y: portal.y } }; },
};
window.__tp = (x, y) => { player.x = x; player.y = y; cam.x = x; cam.y = y - 60; };
window.__sting = () => { stingQueued = true; };
window.__keys = keys;
window.__goto = n => genWorld(n);
window.__openSpot = () => {
  let best = null, bd = -1;
  for (let y = 500; y < WH - 400; y += 150) for (let x = 400; x < WW - 400; x += 150) {
    if (Math.abs(x - BARN.x) < 250 && Math.abs(y - BARN.y) < 200) continue;
    if (dist2(x, y, POND_E.x, POND_E.y) < 900 * 900) continue;
    const nd = Math.min(...trees.map(t => Math.hypot(t.x - x, t.y - y)));
    if (nd > bd) { bd = nd; best = [x, y]; }
  }
  return best;
};

// ---- screenshot/test mode: ?shot=1 autostarts and scripts a sting spree
if (location.search.includes('shot')) {
  startGame();
  const scripted = [
    [0.6, () => { player.x = ZONES.picnic.x + 60; player.y = ZONES.picnic.y - 40; cam.x = player.x; cam.y = player.y - 60; }],
    [1.0, () => { stingQueued = true; }],
    [1.7, () => { stingQueued = true; }],
    [2.4, () => { stingQueued = true; }],   // target #1 flees
    [3.0, () => { stingQueued = true; }],
    [3.6, () => { stingQueued = true; }],   // target #2 flees
    [4.2, () => { stingQueued = true; }],
    [4.9, () => { stingQueued = true; }],
    [5.5, () => { stingQueued = true; }],
    [6.2, () => { stingQueued = true; }],
    [6.9, () => { stingQueued = true; }],
    [7.4, () => { stingQueued = true; }],
    [7.9, () => { stingQueued = true; }],
    [8.3, () => { stingQueued = true; }],
    [8.7, () => { stingQueued = true; }],
    [9.0, () => { stingQueued = true; }],
  ];
  let si = 0;
  const iv = setInterval(() => {
    while (si < scripted.length && scripted[si][0] <= tPlay) scripted[si++][1]();
    if (si >= scripted.length) clearInterval(iv);
  }, 50);
  // keep the bee from wandering off; nudge toward nearest target
  const origUpdate = update;
  update = function (dt) {
    origUpdate(dt);
    if (started && tPlay < 9 && player.lungeT <= 0 && player.dizzy <= 0) {
      const tgt = nearestTarget(320);
      if (tgt) {
        const dx = tgt.x - player.x, dy = tgt.y - 30 - player.y, d = Math.hypot(dx, dy) || 1;
        player.vx = lerp(player.vx, dx / d * 320, .1);
        player.vy = lerp(player.vy, dy / d * 320, .1);
      }
    }
  };
}
