   fill the honey bar to recruit your own buzzing possé.

   than before, with a glowing MAGIC DANDELION that blows you
   off to a brand-new world — meadows, sunflower fields,
   autumn woods, firefly nights, beaches and snowy gardens.
   There are endless worlds. Just keep finding dandelions.

     ⌨️ keyboard WASD / arrows        = fly    SPACE = STING
     📱 touch     drag anywhere = fly   big STING button

   ============================================================ */

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rng = mulberry32(987654321);
const rand = (a, b) => a + rng() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];

// ------------------------------------------------------------------ audio (all synthesized)
const A = {
  ctx: null, master: null, buzzGain: null, buzzFilter: null, started: false, muted: false,
  ensure() {
    if (this.started) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.started = true;
    const ac = this.ctx = new AC();
    this.master = ac.createGain(); this.master.gain.value = 0.5; this.master.connect(ac.destination);
    this.busic = ac.createGain(); this.busic.gain.value = 1; this.busic.connect(this.master);

    // hive buzz — two detuned saws through a lowpass, driven by flight speed
    this.buzzGain = ac.createGain(); this.buzzGain.gain.value = 0;
    this.buzzFilter = ac.createBiquadFilter(); this.buzzFilter.type = 'lowpass'; this.buzzFilter.frequency.value = 800;
    this.buzzGain.connect(this.buzzFilter); this.buzzFilter.connect(this.master);
    const o1 = ac.createOscillator(), o2 = ac.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'sawtooth';
    o1.frequency.value = 108; o2.frequency.value = 115.5;
    const lfo = ac.createOscillator(), lfoG = ac.createGain();
    lfo.frequency.value = 5.3; lfoG.gain.value = 7;
    lfo.connect(lfoG); lfoG.connect(o1.frequency); lfoG.connect(o2.frequency);
    o1.connect(this.buzzGain); o2.connect(this.buzzGain);
    o1.start(); o2.start(); lfo.start();

    this._sched = null; this._step = 0; this._nextT = ac.currentTime + 0.1;
    this._sched = setInterval(() => this._musicTick(), 120);
  },
  setBuzz(speedN) {
    if (!this.started || this.muted) { if (this.buzzGain) this.buzzGain.gain.value = 0; return; }
    this.buzzGain.gain.value = 0.012 + speedN * 0.035;
    this.buzzFilter.frequency.value = 500 + speedN * 900;
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.started) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  env(g, t, a, d, peak) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  tone(type, f0, f1, t, dur, peak, dest) {
    const ac = this.ctx; const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    this.env(g, t, 0.008, dur, peak);
    o.connect(g); g.connect(dest || this.master); o.start(t); o.stop(t + dur + 0.1);
  },
  noise(t, dur, peak, freq, type) {
    const ac = this.ctx;
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ac.createBufferSource(); s.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq || 2000; f.Q.value = 1;
    const g = ac.createGain(); this.env(g, t, 0.005, dur, peak);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  // --- sfx
  whoosh() { const t = this.ctx.currentTime; this.tone('sine', 300, 900, t, 0.09, 0.10); },
  travel() { const t = this.ctx.currentTime; [523, 659, 784, 1047].forEach((f, i) => this.tone('triangle', f, f * 1.01, t + i * 0.08, 0.22, 0.14, this.busic)); this.tone('sine', 1400, 2800, t + 0.2, 0.4, 0.08); },
  stingHit() { const t = this.ctx.currentTime; this.tone('square', 500, 1400, t, 0.09, 0.14); this.tone('sine', 900, 1800, t, 0.12, 0.10); this.noise(t, 0.06, 0.10, 3000, 'highpass'); },
  bigHit() { const t = this.ctx.currentTime; this.tone('square', 300, 900, t, 0.12, 0.18); this.noise(t, 0.1, 0.14, 1500); },
  flee() { const t = this.ctx.currentTime; [660, 830, 990, 1320].forEach((f, i) => this.tone('triangle', f, f, t + i * 0.09, 0.16, 0.16)); this.noise(t + 0.2, 0.3, 0.05, 900); },
  bonk() { const t = this.ctx.currentTime; this.tone('sine', 220, 55, t, 0.25, 0.35); this.noise(t, 0.15, 0.18, 400, 'lowpass'); },
  pop() { const t = this.ctx.currentTime; this.tone('triangle', 700, 1250, t, 0.09, 0.16); },
  levelUp() { const t = this.ctx.currentTime; [523, 659, 784, 1047, 1319].forEach((f, i) => { this.tone('square', f, f, t + i * 0.1, 0.22, 0.13, this.busic); this.tone('triangle', f / 2, f / 2, t + i * 0.1, 0.25, 0.16, this.busic); }); },
  roar() { const t = this.ctx.currentTime; this.tone('sawtooth', 110, 60, t, 0.5, 0.25); this.noise(t, 0.45, 0.12, 300, 'lowpass'); },
  gamepadJingle() { const t = this.ctx.currentTime; [784, 988, 1175].forEach((f, i) => this.tone('triangle', f, f, t + i * 0.07, 0.14, 0.12)); },
  // --- tiny cheerful ukulele-ish loop
  _musicTick() {
    const ac = this.ctx; if (!ac || this.muted) return;
    const stepDur = 60 / 128 / 2; // eighth notes
    while (this._nextT < ac.currentTime + 0.3) {
      const s = this._step % 32, t = this._nextT;
      const PENTA = [262, 294, 330, 392, 440, 523, 587, 659];
      const MEL = [4, null, 2, 4, 6, null, 5, 4, 2, null, 0, 2, 4, null, null, null, 3, null, 4, 5, 7, null, 6, 5, 4, 4, 2, null, 0, null, 2, null];
      const BASS = [0, 0, 3, 3, 4, 4, 2, 2];
      const bn = Math.floor(s / 4) % 8;
      const m = MEL[s];
      if (m != null) this.tone('triangle', PENTA[m], PENTA[m], t, stepDur * 1.6, 0.05, this.busic);
      if (s % 4 === 0) this.tone('sine', PENTA[BASS[bn]] / 2, PENTA[BASS[bn]] / 2, t, stepDur * 1.8, 0.09, this.busic);
      if (s % 2 === 1) this.noise(t, 0.02, 0.012, 9000, 'highpass');
      this._nextT += stepDur; this._step++;
    }
  },
};

// ------------------------------------------------------------------ input
const keys = {};
let gpConnected = false, gpToastT = 0;

// touch state
const touch = { joyId: -1, ox: 0, oy: 0, dx: 0, dy: 0, btnHeld: false, btnPtr: -1 };
let stingQueued = false;

function stingBtn() { // screen-space big button
  const r = Math.max(58, Math.min(cssW, cssH) * 0.11);
  return { x: cssW - r - 18 - safeR, y: cssH - r - 18 - safeBot, r };
}

window.addEventListener('keydown', e => {
  if (!started) { startGame(); return; }
  if (e.code === 'Space' || e.code === 'Enter') stingQueued = true;
  keys[e.code] = true;
  if (e.code === 'KeyM') A.toggleMute();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

cvs.addEventListener('pointerdown', e => {
  try { cvs.setPointerCapture(e.pointerId); } catch (_) { /* synthetic / inactive pointers */ }
  if (!started) { startGame(); return; }
  const b = stingBtn();
  if (e.pointerType !== 'mouse' && dist2(e.clientX, e.clientY, b.x, b.y) < (b.r * 1.35) ** 2) {
    touch.btnHeld = true; touch.btnPtr = e.pointerId; stingQueued = true; return;
  }
  if (touch.joyId === -1 && e.pointerType !== 'mouse') {
    touch.joyId = e.pointerId; touch.ox = e.clientX; touch.oy = e.clientY; touch.dx = 0; touch.dy = 0;
  }
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerId === touch.joyId) {
    touch.dx = e.clientX - touch.ox; touch.dy = e.clientY - touch.oy;
  }
});
const endPtr = e => {
  if (e.pointerId === touch.joyId) { touch.joyId = -1; touch.dx = 0; touch.dy = 0; }
  if (e.pointerId === touch.btnPtr) { touch.btnHeld = false; touch.btnPtr = -1; }
};
cvs.addEventListener('pointerup', endPtr);
cvs.addEventListener('pointercancel', endPtr);

window.addEventListener('gamepadconnected', e => {
  gpConnected = true; gpToastT = 3;
  if (A.started) A.gamepadJingle();
});

function pollMove() { // returns {x,y} normalized with strength
  let x = 0, y = 0;
  if (keys.KeyA || keys.ArrowLeft) x -= 1;
  if (keys.KeyD || keys.ArrowRight) x += 1;
  if (keys.KeyW || keys.ArrowUp) y -= 1;
  if (keys.KeyS || keys.ArrowDown) y += 1;
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of gps) {
    if (!gp) continue;
    const dz = v => Math.abs(v) < 0.22 ? 0 : (v - Math.sign(v) * 0.22) / 0.78;
    x += dz(gp.axes[0] || 0) + dz(gp.axes[2] || 0);
    y += dz(gp.axes[1] || 0) + dz(gp.axes[3] || 0);
    if (gp.buttons[12] && gp.buttons[12].pressed) x -= 1;
    if (gp.buttons[15] && gp.buttons[15].pressed) x += 1;
    if (gp.buttons[13] && gp.buttons[13].pressed) y -= 1;
    if (gp.buttons[14] && gp.buttons[14].pressed) y += 1;
    for (const bi of [0, 2, 5, 7]) { // A ✕ RB RT
      const pressed = gp.buttons[bi] && (gp.buttons[bi].pressed || gp.buttons[bi].value > 0.6);
      if (pressed && !gp._stingPrev?.[bi]) stingQueued = true;
      (gp._stingPrev = gp._stingPrev || {})[bi] = pressed;
    }
  }
  if (touch.joyId !== -1) {
    const d = Math.hypot(touch.dx, touch.dy);
    if (d > 8) { const s = Math.min(1, d / 60); x += touch.dx / d * s; y += touch.dy / d * s; }
  }
  const m = Math.hypot(x, y);
  if (m > 1) { x /= m; y /= m; }
  return { x, y, m: Math.min(1, m) };
}

// ------------------------------------------------------------------ critters
// Every critter: side-view cartoon, feet at y=0, drawn facing +x.
const WELT_OFF = [[.2, -.8], [-.3, -1], [.5, -.5], [-.1, -.5], [.3, -1.2], [-.5, -.7]];

const CRITTER_S = {
  dog:      { r: 26, hp: 3, spd: 55 },
  cat:      { r: 25, hp: 3, spd: 60 },
  duck:     { r: 22, hp: 2, spd: 40, amphib: true },
  pig:      { r: 34, hp: 4, spd: 45 },
  cow:      { r: 48, hp: 5, spd: 30 },
  horse:    { r: 50, hp: 5, spd: 38 },
  rooster:  { r: 20, hp: 2, spd: 70 },
  sheep:    { r: 30, hp: 3, spd: 42 },
  goose:    { r: 21, hp: 2, spd: 88 },
  bunny:    { r: 16, hp: 2, spd: 95 },
  frog:     { r: 15, hp: 1, spd: 55, amphib: true },
  goat:     { r: 32, hp: 3, spd: 55 },
  raccoon:  { r: 24, hp: 3, spd: 65 },
  hedgehog: { r: 16, hp: 2, spd: 40 },
  owl:      { r: 24, hp: 2, spd: 58 },
  penguin:  { r: 26, hp: 3, spd: 45, amphib: true },
  flamingo: { r: 28, hp: 3, spd: 62 },
  picnicker:{ r: 32, hp: 3, spd: 130, human: true },
  jogger:   { r: 30, hp: 3, spd: 150, human: true },
  kid:      { r: 24, hp: 3, spd: 120, human: true },
  farmer:   { r: 36, hp: 4, spd: 110, human: true },
};
const CRITTER_NAMES = {
  picnicker: ['GREG', 'HANK', 'BRENDA', 'EARL'],
  jogger: ['PAMELA', 'RALPH', 'SUSAN', 'DENNIS'],
  kid: ['MILO', 'ZOE', 'LEO', 'MAIA'],
  farmer: ['ERNE', 'MO', 'JEBB', 'CLEM'],
  goose: ['HONK'],
  penguin: ['PIP'],
  flamingo: ['FLAMINGO'],
  owl: ['PROFESSOR HOOT'],
};

function makeCritter(type, x, y, home) {
  const s = CRITTER_S[type];
  return {
    type, x, y, home, r: s.r, hp: s.hp, maxhp: s.hp, spd: s.spd,
    dir: rng() < .5 ? -1 : 1, phase: rng() * TAU, angryT: 0,
    state: 'wander', wt: rand(0, 3), tx: x, ty: y, welts: [], hurtT: 0,
    human: !!s.human, amphib: !!s.amphib,
    name: s.name || (CRITTER_NAMES[type] ? pick(CRITTER_NAMES[type]) : ''),
    spawnT: 0, swatT: rand(0.5, 2), seed: rng(),
  };
}
const animals = [];

// Gerald the bear — big honey thief (his home moves to a new corner in every world)
const bear = {
  type: 'bear', x: 0, y: 0, home: { x: 0, y: 0, r: 420 }, r: 60,
  hp: 12, maxhp: 12, spd: 55, dir: 1, phase: 0, angryT: 0, state: 'wander',
  wt: 0, tx: 0, ty: 0, welts: [], hurtT: 0, human: false, amphib: false, name: 'GERALD',
  spawnT: 0, seed: .42, enraged: false,
};

// ------------------------------------------------------------------ world generator (the infinite bit)
function genWorld(num) {
  worldNum = Math.max(1, num | 0);
  rng = mulberry32((worldNum * 1103515245 + 12345) >>> 0);
  THEME = BIOMES[(worldNum - 1) % BIOMES.length];
  WW = Math.round(rand(6200, 7000) / 50) * 50;
  WH = Math.round(rand(4200, 4800) / 50) * 50;
  worldName = pick(WORLD_ADJ) + ' ' + pick(WORLD_NOUN);

  // --- zones: hive at heart, picnic/farm/pond scattered around it
  const cx = WW / 2, cy = WH / 2;
  ZONES = { hive: { x: cx, y: cy, r: 300, name: 'HOME' } };
  const zoneR = { picnic: 400, barn: 430, pond: 340 };
  const a0 = rng() * TAU;
  for (let i = 0; i < 3; i++) {
    const k = ['picnic', 'barn', 'pond'][i];
    const a = a0 + i * (TAU / 3) + rand(-.45, .45);
    const d = rand(.32, .42) * Math.min(WW, WH);
    ZONES[k] = {
      x: clamp(cx + Math.cos(a) * d * 1.28, 700, WW - 700),
      y: clamp(cy + Math.sin(a) * d, 560, WH - 560),
      r: zoneR[k], name: THEME.zoneNames[k],
    };
  }
  HIVE = { x: cx, y: cy };
  TABLE = { x: ZONES.picnic.x - 20, y: ZONES.picnic.y + 60 };
  BARN = { x: ZONES.barn.x + 160, y: ZONES.barn.y - 140 };
  POND_E = { x: ZONES.pond.x, y: ZONES.pond.y, rx: ZONES.pond.r * .92, ry: ZONES.pond.r * .64 };
  ZONES.pond.cracks = [];
  for (let i = 0; i < 7; i++) ZONES.pond.cracks.push({ a: rng() * TAU, b: rand(-.5, .5) });

  // fences around the farm pen
  fencePts = [];
  {
    const R = 330, bx = ZONES.barn.x, by = ZONES.barn.y;
    for (let a = 0; a < 12; a++) {
      const a0f = a / 12 * TAU;
      fencePts.push({ x: bx + Math.cos(a0f) * R, y: by + Math.sin(a0f) * R * .8 });
    }
  }

  // --- the magic dandelion: fly into it and a fresh world blooms
  {
    const a = rng() * TAU;
    let px = clamp(cx + Math.cos(a) * rand(1500, 2100), 300, WW - 300);
    let py = clamp(cy + Math.sin(a) * rand(1100, 1500), 340, WH - 300);
    if (inPond(px, py, 160)) { px = clamp(px + 620, 300, WW - 300); py = clamp(py + 320, 340, WH - 300); }
    portal = { x: px, y: py };
  }

  // --- flowers (nectar): scattered fields + loose blooms
  fields.length = 0; flowers.length = 0;
  {
    for (let i = 0; i < 10; i++) fields.push({
      x: rand(WW * .12, WW * .88), y: rand(WH * .12, WH * .88),
      rx: rand(260, 430), ry: rand(150, 300),
    });
    const cols = [['#ff7eb6', '#ffd93d'], ['#b388ff', '#ffeb3b'], ['#7ee8fa', '#ff8fab'], ['#ffffff', '#ffca28'], ['#ffab40', '#fff176'], ['#f06292', '#fff59d']];
    for (const f of fields) {
      for (let i = 0; i < 16; i++) {
        const a = rng() * TAU, d = Math.sqrt(rng());
        flowers.push({ x: f.x + Math.cos(a) * f.rx * d, y: f.y + Math.sin(a) * f.ry * d, col: pick(cols), ready: rng() < .8, grow: rand(0, 3), sway: rng() * TAU });
      }
    }
    const nScatter = Math.round(34 * (WW * WH) / (3800 * 2600));
    for (let i = 0; i < nScatter; i++) flowers.push({ x: rand(60, WW - 60), y: rand(60, WH - 60), col: pick(cols), ready: rng() < .7, grow: rand(0, 3), sway: rng() * TAU });
  }

  // --- decor
  tufts.length = 0; bushes.length = 0; rocks.length = 0; dandelionSpots.length = 0; trees = [];
  {
    const ar = (WW * WH) / (3800 * 2600); // area ratio vs the original meadow
    for (let i = 0; i < 700 * THEME.tuftMul * ar; i++) tufts.push({ x: rand(0, WW), y: rand(0, WH), h: rand(5, 11), lean: rand(-.4, .4), c: rand(0, 1) });
    for (let i = 0; i < 40 * ar; i++) trees.push({ x: rand(80, WW - 80), y: rand(80, WH - 80), s: rand(.8, 1.35), sway: rng() * TAU, kind: pick(THEME.treeKinds) });
    trees = trees.filter(tr => dist2(tr.x, tr.y, ZONES.hive.x, ZONES.hive.y) > 320 * 320 && dist2(tr.x, tr.y, ZONES.picnic.x, ZONES.picnic.y) > 260 * 260);
    for (let i = 0; i < 30 * ar; i++) bushes.push({ x: rand(60, WW - 60), y: rand(60, WH - 60), s: rand(.7, 1.2) });
    for (let i = 0; i < 16 * ar; i++) rocks.push({ x: rand(60, WW - 60), y: rand(60, WH - 60), s: rand(.6, 1.1), seed: rng() * 10 });
    // border trees so the world feels enclosed
    for (let x = 30; x < WW; x += 120) {
      trees.push({ x: x + rand(-25, 25), y: rand(10, 60), s: rand(1.1, 1.5), sway: rng() * TAU, kind: pick(THEME.treeKinds) });
      trees.push({ x: x + rand(-25, 25), y: rand(WH - 60, WH - 10), s: rand(1.1, 1.5), sway: rng() * TAU, kind: pick(THEME.treeKinds) });
    }
    for (let y = 60; y < WH - 60; y += 130) {
      trees.push({ x: rand(10, 60), y: y + rand(-20, 20), s: rand(1.1, 1.5), sway: rng() * TAU, kind: pick(THEME.treeKinds) });
      trees.push({ x: rand(WW - 60, WW - 10), y: y + rand(-20, 20), s: rand(1.1, 1.5), sway: rng() * TAU, kind: pick(THEME.treeKinds) });
    }
    for (let i = 0; i < 60 * THEME.dandies * ar; i++) dandelionSpots.push({ x: rand(40, WW - 40), y: rand(40, WH - 40), s: rand(.8, 1.3) });
  }
  // keep decor out of the pond
  for (const a of [trees, bushes, rocks, flowers, tufts, dandelionSpots]) {
    for (let i = a.length - 1; i >= 0; i--) { const o = a[i]; if (inPond(o.x, o.y, 30)) a.splice(i, 1); }
  }
  for (let i = trees.length - 1; i >= 0; i--) { // also keep picnic lawn & farm pen clearish
    const tr = trees[i];
    if (dist2(tr.x, tr.y, ZONES.picnic.x, ZONES.picnic.y) < 210 * 210) trees.splice(i, 1);
  }
  // keep flowers clear of the hive and barn buildings
  for (let i = flowers.length - 1; i >= 0; i--) {
    const f = flowers[i];
    if (dist2(f.x, f.y, HIVE.x, HIVE.y) < 110 * 110) flowers.splice(i, 1);
    if (Math.abs(f.x - BARN.x) < 170 && Math.abs(f.y - BARN.y) < 110) flowers.splice(i, 1);
  }

  // clouds (drifting shadows)
  clouds.length = 0;
  for (let i = 0, n = Math.min(26, Math.round(9 * (WW * WH) / (3800 * 2600))); i < n; i++) clouds.push({ x: rand(0, WW), y: rand(0, WH), rx: rand(180, 340), ry: rand(90, 160), v: rand(6, 14) });

  // hive bees
  hiveBees.length = 0;
  for (let i = 0; i < 14; i++) hiveBees.push({ a: rng() * TAU, rad: rand(30, 90), spd: rand(0.5, 1.3) * (rng() < .5 ? -1 : 1), bob: rng() * TAU, phase: rng() * TAU });

  // --- animals: the biome's own menagerie, grouped around the zones
  animals.length = 0;
  const spawnAt = (key, type) => {
    const z = ZONES[key], s = CRITTER_S[type];
    let x, y;
    if (key === 'pond' && s.amphib) {
      const a = rng() * TAU, d = Math.sqrt(rng()) * .55;
      x = z.x + Math.cos(a) * POND_E.rx * d; y = z.y + Math.sin(a) * POND_E.ry * d;
    } else {
      const a = rng() * TAU, d = .45 + rng() * .55;
      x = z.x + Math.cos(a) * z.r * d; y = z.y + Math.sin(a) * z.r * d * .8;
    }
    animals.push(makeCritter(type, x, y, z));
  };
  for (const key of ['picnic', 'barn', 'pond']) for (const [type, n] of THEME.spawns[key]) for (let i = 0; i < n; i++) spawnAt(key, type);
  for (const [type, n] of THEME.spawns.wild) {
    for (let i = 0; i < n; i++) {
      let x, y, tries = 0;
      do {
        x = rand(WW * .15, WW * .85); y = rand(WH * .15, WH * .85);
        tries++;
      } while (tries < 30 && (dist2(x, y, HIVE.x, HIVE.y) < 800 * 800 || inPond(x, y, 120) || (Math.abs(x - BARN.x) < 220 && Math.abs(y - BARN.y) < 160)));
      animals.push(makeCritter(type, x, y, { x, y, r: 360 }));
    }
  }

  // --- Gerald gets a fresh corner of the map to guard
  {
    let x, y, tries = 0;
    do {
      x = rand(400, WW - 400); y = rand(400, WH - 400);
      tries++;
    } while (tries < 40 && (dist2(x, y, HIVE.x, HIVE.y) < 1200 * 1200 || inPond(x, y, 150)));
    bear.x = x; bear.y = y; bear.tx = x; bear.ty = y;
    bear.home = { x, y, r: 420 };
    bear.state = 'wander'; bear.hp = bear.maxhp; bear.welts = []; bear.angryT = 0; bear.enraged = false; bear.hurtT = 0; bear.spawnT = 0;
  }

  // --- ground texture + you, dropped at the new hive
  buildGround();
  ambient.length = 0;
  player.x = HIVE.x; player.y = HIVE.y - 160; player.vx = player.vy = 0;
  player.dizzy = 0; player.lungeT = 0; player.cd = 0; player.trail.length = 0;
  cam.x = player.x; cam.y = player.y - 100;
  portalCd = 1.6;
  for (const b of buddies) { b.x = player.x + rand(-30, 30); b.y = player.y - rand(20, 60); b.vx = b.vy = 0; }
  if (started) {
    addToast('WORLD ' + worldNum + ' — ' + worldName + '!');
    addToast(THEME.tag + '!');
  }
}

// ---- grass base (offscreen texture at 1/3 world res, soft painterly speckle).
// The canvas is allocated ONCE at max world size and reused by every world, so
// travelling to a new world never churns GPU memory — we only paint and blit
// the current world's sub-rect.
const GS = 3; // ground supersample divisor
const GWMAX = Math.ceil(7000 / GS), GHMAX = Math.ceil(4800 / GS);
const groundCv = document.createElement('canvas');
groundCv.width = GWMAX; groundCv.height = GHMAX;
const groundG = groundCv.getContext('2d');
function buildGround() {
  const g = groundG;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, GWMAX, GHMAX);
  const gh = THEME.ground.h, gs = THEME.ground.s, gl = THEME.ground.l;
  g.scale(1 / GS, 1 / GS);
  g.fillStyle = `hsl(${gh}, ${gs}%, ${gl}%)`;
  g.fillRect(0, 0, WW, WH);
  // broad sunlit patches
  for (let i = 0; i < 90; i++) {
    const x = rand(0, WW), y = rand(0, WH), r = rand(160, 420);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `hsla(${gh + rand(-8, 12)}, ${gs + 8}%, ${clamp(gl + rand(2, 9), 4, 92)}%, .18)`);
    grad.addColorStop(1, `hsla(${gh}, ${gs}%, ${gl}%, 0)`);
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  // darker shade patches
  for (let i = 0; i < 50; i++) {
    const x = rand(0, WW), y = rand(0, WH), r = rand(140, 340);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `hsla(${gh + 6}, ${gs}%, ${Math.max(4, gl - 12)}%, .14)`);
    grad.addColorStop(1, `hsla(${gh + 6}, ${gs}%, ${Math.max(4, gl - 12)}%, 0)`);
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  // fine grass flecks
  const fleck = Math.round(40000 * (WW * WH) / (3800 * 2600));
  const colA = `hsla(${gh - 4}, ${gs + 2}%, ${clamp(gl + 7, 0, 96)}%, .25)`;
  const colB = `hsla(${gh + 8}, ${gs}%, ${Math.max(4, gl - 9)}%, .18)`;
  for (let i = 0; i < fleck; i++) {
    const x = rand(0, WW), y = rand(0, WH);
    g.fillStyle = rng() < .5 ? colA : colB;
    g.fillRect(x, y, rand(2.5, 4.5), rand(2.5, 5));
  }
  // dirt paths between POIs, feathered
  const path = (a, b) => {
    const mx = (a.x + b.x) / 2 + rand(-80, 80), my = (a.y + b.y) / 2 + rand(-80, 80);
    const pc = THEME.pathCols;
    g.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      g.strokeStyle = pc[i]; g.lineWidth = [64, 44, 26][i];
      g.beginPath(); g.moveTo(a.x, a.y);
      g.quadraticCurveTo(mx, my, b.x, b.y);
      g.stroke();
    }
    // wheel ruts
    g.strokeStyle = pc[1]; g.lineWidth = 3;
    g.beginPath(); g.moveTo(a.x, a.y); g.quadraticCurveTo(mx - 8, my - 8, b.x, b.y); g.stroke();
    g.beginPath(); g.moveTo(a.x, a.y); g.quadraticCurveTo(mx + 8, my + 8, b.x, b.y); g.stroke();
  };
  path(ZONES.hive, ZONES.picnic); path(ZONES.hive, ZONES.barn); path(ZONES.hive, ZONES.pond);
  path(ZONES.hive, portal);
}

// ------------------------------------------------------------------ feedback helpers
function addPop(x, y, text, col, size = 22) { pops.push({ x, y, text, col, t: 0, size }); }
function addToast(text) { toasts.push({ text, t: 0 }); if (toasts.length > 3) toasts.shift(); }
function burst(x, y, n, col, spd = 140, life = .6, r = 4) {
  for (let i = 0; i < n; i++) {
    const a = rng() * TAU, v = rand(spd * .3, spd);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, t: 0, life: rand(life * .6, life), col, r: rand(r * .5, r), grav: 160 });
  }
}
function confettiBurst(x, y, n = 60) {
  for (let i = 0; i < n; i++) {
    const a = rng() * TAU, v = rand(80, 340);
    confetti.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, t: 0, life: rand(1, 1.8), rot: rng() * TAU, vr: rand(-8, 8), col: pick(['#ff5b5b', '#ffd93d', '#63e055', '#57c8ff', '#ff8ae2', '#ffffff']), w: rand(5, 9), h: rand(7, 12) });
  }
}
function dust(x, y) { burst(x, y, 4, 'rgba(210,190,150,.8)', 60, .5, 5); }
function sparks(x, y) {
  for (let i = 0; i < 10; i++) {
    const a = rng() * TAU, v = rand(60, 220);
    hitSpark.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: rand(.15, .35) });
  }
}

function addStars(n) { stars += n; }
function addHoney(n) {
  honey += n;
  if (honey >= 7) {
    honey -= 7; level++;
    addToast('LEVEL ' + level + ' — ' + rankOf(level) + '!');
    confettiBurst(player.x, player.y - 40, 90);
    confettiBurst(HIVE.x, HIVE.y - 60, 60);
    for (let i = 0; i < 2; i++) if (buddies.length < 14) buddies.push({ x: HIVE.x, y: HIVE.y - 40, vx: 0, vy: 0, bob: rng() * TAU, face: 1, wing: rng() * TAU });
    if (A.started) A.levelUp();
  }
}

// ------------------------------------------------------------------ sting logic
const STING_RANGE = 300, STING_CD = 0.42;
const FEATHERY = new Set(['duck', 'rooster', 'goose', 'owl', 'flamingo']);

function nearestTarget(range) {
  let best = null, bd = range * range;
  const all = animals.concat([bear]);
  for (const e of all) {
    if (e.state === 'gone' || e.state === 'fleeing') continue;
    const d = dist2(player.x, player.y, e.x, e.y - e.r * .8);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function doSting() {
  if (player.cd > 0 || player.dizzy > 0) return;
  const t = nearestTarget(STING_RANGE);
  let dx = player.face, dy = -0.1;
  if (t) {
    const ty = t.y - t.r * .8;
    const d = Math.hypot(t.x - player.x, ty - player.y) || 1;
    dx = (t.x - player.x) / d; dy = (ty - player.y) / d;
  }
  player.vx = dx * 1500; player.vy = dy * 1500;
  player.lungeT = 0.18; player.cd = STING_CD; player.squash = 1;
  player.lungeSet = new Set();
  if (A.started) A.whoosh();
}

function stingTarget(e) {
  if (e.state !== 'wander' && e.state !== 'angry' && e.state !== 'charge') return;
  e.hp--;
  e.welts.push(WELTSN(e)); e.hurtT = 0.9;
  sparks(player.x, player.y);
  burst(e.x, e.y - e.r, 8, FEATHERY.has(e.type) ? '#ffffff' : '#ffe27a', 160, .5, 4);
  player.vx *= -0.35; player.vy = player.vy * -0.35 - 120;
  shake = Math.max(shake, 6); freeze = Math.max(freeze, 0.045);
  addStars(5); addHoney(0.34);
  addPop(e.x, e.y - e.r * 2.1, '+5', '#ffd93d', 24);
  if (A.started) A.stingHit();
  if (e.type === 'bear') {
    if (A.started) A.roar();
    shake = Math.max(shake, 10);
    if (e.hp <= e.maxhp * 0.5) { e.enraged = true; e.angryT = 8; }
  }
  if (e.hp <= 0) fleeCritter(e);
  else { e.state = 'angry'; e.angryT = 6; e.dir = player.x < e.x ? 1 : -1; }
}
function WELTSN(e) { return WELT_OFF[(e.welts.length + 2) % WELT_OFF.length]; }

function fleeCritter(e) {
  e.state = 'fleeing'; e.hp = 0;
  const fleeingName = e.name || e.type.toUpperCase();
  addToast(fleeingName + ' RAN AWAY! +30');
  addStars(30); addHoney(1);
  confettiBurst(e.x, e.y - e.r, 45);
  burst(e.x, e.y, 16, 'rgba(220,200,160,.9)', 120, .8, 7);
  if (A.started) e.type === 'bear' ? A.roar() : A.flee();
  e.spawnT = (e.type === 'bear' ? rand(22, 28) : rand(8, 14));
  if (e.type === 'bear') {
    shake = 14; confettiBurst(e.x, e.y - 80, 120);
    addToast('GERALD GAVE UP! HONEY SAVED!'); addStars(100); addHoney(3);
    honeyPotTimer = 4; // dropped honey pot celebration
  }
}
let honeyPotTimer = 0;

function bonkPlayer(fx, fy, label) {
  if (player.dizzy > 0) return;
  const d = Math.hypot(fx, fy) || 1;
  player.vx = fx / d * 900; player.vy = fy / d * 900 - 200;
  player.dizzy = 0.6; player.cd = 0.3;
  shake = Math.max(shake, 9);
  addPop(player.x, player.y - 46, 'BONK!', '#ff6b6b', 28);
  burst(player.x, player.y - 20, 12, '#ffe27a', 180, .8, 4);
  if (A.started) A.bonk();
}

// ------------------------------------------------------------------ update
function update(dt) {
  tPlay += dt;
  player.cd = Math.max(0, player.cd - dt);
  if (player.dizzy > 0) {
    player.dizzy -= dt;
    player.vx *= Math.pow(.05, dt); player.vy *= Math.pow(.05, dt);
  } else if (player.lungeT > 0) {
    pollMove(); // keep pads polled for sting button edges — the lunge owns the velocity now
  } else {
    const mv = pollMove();
    const top = 520;
    player.vx = lerp(player.vx, mv.x * top, 1 - Math.pow(.0001, dt));
    player.vy = lerp(player.vy, mv.y * top, 1 - Math.pow(.0001, dt));
  }
  if (stingQueued) { doSting(); stingQueued = false; }
  if (touch.btnHeld && player.cd <= 0 && player.dizzy <= 0 && player.lungeT <= 0) stingQueued = true;

  player.lungeT = Math.max(0, player.lungeT - dt);
  if (Math.abs(player.vx) > 8) player.face = player.vx > 0 ? 1 : -1;
  player.x = clamp(player.x + player.vx * dt, 30, WW - 30);
  player.y = clamp(player.y + player.vy * dt, 40, WH - 30);
  // soft world-edge bumper
  if (player.x <= 32 || player.x >= WW - 32) player.vx *= -0.6;
  if (player.y <= 42 || player.y >= WH - 32) player.vy *= -0.6;
  player.bobT += dt * (6 + Math.hypot(player.vx, player.vy) * .01);
  player.wingT += dt * 46;
  player.squash = Math.max(0, player.squash - dt * 3);

  // trail
  if (Math.hypot(player.vx, player.vy) > 60) {
    player.trail.push({ x: player.x, y: player.y, t: 0 });
    if (player.trail.length > 14) player.trail.shift();
  }
  for (let i = player.trail.length - 1; i >= 0; i--) { player.trail[i].t += dt; if (player.trail[i].t > .3) player.trail.splice(i, 1); }

  // decor collisions (trees)
  for (const tr of trees) {
    const rr2 = 26 * tr.s + player.r;
    const d2 = dist2(player.x, player.y, tr.x, tr.y - 20 * tr.s);
    if (d2 < rr2 * rr2 && d2 > 1) {
      const d = Math.sqrt(d2), push = (rr2 - d);
      player.x += (player.x - tr.x) / d * push; player.y += (player.y - (tr.y - 20 * tr.s)) / d * push;
      player.vx += (player.x - tr.x) / d * 200 * dt * 60;
      player.vy += (player.y - (tr.y - 20 * tr.s)) / d * 200 * dt * 60;
    }
  }
  // hive is a solid little building
  {
    const rr2 = 66 + player.r;
    const d2 = dist2(player.x, player.y, HIVE.x, HIVE.y - 20);
    if (d2 < rr2 * rr2 && d2 > 1) {
      const d = Math.sqrt(d2), push = rr2 - d;
      player.x += (player.x - HIVE.x) / d * push; player.y += (player.y - (HIVE.y - 20)) / d * push;
    }
  }
  // barn solid
  {
    const bx = BARN.x, by = BARN.y;
    if (Math.abs(player.x - bx) < 150 + player.r && Math.abs(player.y - by) < 90 + player.r) {
      const ox = (150 + player.r) - Math.abs(player.x - bx);
      const oy = (90 + player.r) - Math.abs(player.y - by);
      if (ox < oy) player.x += (player.x < bx ? -ox : ox); else player.y += (player.y < by ? -oy : oy);
    }
  }

  // flowers
  for (const f of flowers) {
    if (!f.ready) { f.grow += dt; if (f.grow > 4) { f.ready = true; f.grow = 0; } }
    if (f.ready && dist2(player.x, player.y, f.x, f.y - 10) < 34 * 34) {
      f.ready = false; f.grow = 0;
      addStars(2); addHoney(0.5);
      burst(f.x, f.y - 12, 8, '#fff3a3', 100, .6, 3);
      addPop(f.x, f.y - 34, '♪', '#ffffff', 20);
      if (A.started) A.pop();
    }
  }

  // animals
  for (const e of animals) updateCritter(e, dt, animals);
  updateCritter(bear, dt, animals);

  // bear contact bonk + enrage chase
  if (bear.state === 'charge' || bear.state === 'wander' || bear.state === 'angry') {
    if (dist2(player.x, player.y, bear.x, bear.y - 40) < (bear.r + 22) ** 2) {
      bonkPlayer(player.x - bear.x, player.y - (bear.y - 40), 'BONK');
    }
    if (bear.enraged && bear.state !== 'fleeing' && dist2(player.x, player.y, bear.x, bear.y) < 700 * 700 && bear.state !== 'charge') {
      bear.state = 'charge'; bear.tx = player.x; bear.ty = player.y;
    }
  }
  // angry humans swat
  for (const e of animals) {
    if (!e.human || e.state !== 'angry') continue;
    e.swatT -= dt;
    const d2 = dist2(player.x, player.y, e.x, e.y - e.r * 1.4);
    if (d2 < 78 * 78 && e.swatT <= 0) {
      e.swatT = 1.1;
      if (dist2(player.x, player.y, e.x + e.dir * 30, e.y - e.r * 1.7) < 66 * 66) {
        bonkPlayer(player.x - e.x, player.y - (e.y - e.r * 1.4));
      } else {
        if (A.started) A.whoosh();
      }
    }
  }

  // buddy bees follow in a snake
  let px = player.x, py = player.y - 26;
  for (const b of buddies) {
    b.bob += dt * (5 + Math.sin(b.bob) * 2); b.wing += dt * 44;
    const tx = px - 34, ty = py - 10 + Math.sin(b.bob) * 10;
    b.vx = lerp(b.vx, (tx - b.x) * 6, 1 - Math.pow(.0001, dt));
    b.vy = lerp(b.vy, (ty - b.y) * 6, 1 - Math.pow(.0001, dt));
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (Math.abs(b.vx) > 8) b.face = b.vx > 0 ? 1 : -1;
    px = b.x; py = b.y;
  }

  // hive bees
  for (const hb of hiveBees) {
    hb.a += hb.spd * dt; hb.bob += dt * 5;
  }

  // clouds
  for (const cl of clouds) { cl.x += cl.v * dt; if (cl.x - cl.rx > WW) cl.x = -cl.rx; }

  // particles etc
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt; }
  for (let i = particles.length - 1; i >= 0; i--) if (particles[i].t > particles[i].life) particles.splice(i, 1);
  for (const p of confetti) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.vx *= Math.pow(.3, dt); p.rot += p.vr * dt; }
  for (let i = confetti.length - 1; i >= 0; i--) if (confetti[i].t > confetti[i].life) confetti.splice(i, 1);
  for (const p of hitSpark) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  for (let i = hitSpark.length - 1; i >= 0; i--) if (hitSpark[i].t > hitSpark[i].life) hitSpark.splice(i, 1);
  for (const p of pops) { p.t += dt; p.y -= 40 * dt; }
  for (let i = pops.length - 1; i >= 0; i--) if (pops[i].t > 1.1) pops.splice(i, 1);
  for (const tt of toasts) tt.t += dt;
  for (let i = toasts.length - 1; i >= 0; i--) if (toasts[i].t > 3.4) toasts.splice(i, 1);
  if (gpToastT > 0) gpToastT -= dt;
  if (honeyPotTimer > 0) honeyPotTimer -= dt;

  // lunge hits (generous hitbox)
  if (player.lungeT > 0 && player.lungeSet) {
    const all = animals.concat([bear]);
    for (const e of all) {
      if (e.state === 'gone' || e.state === 'fleeing') continue;
      if (player.lungeSet.has(e)) continue;
      if (dist2(player.x, player.y, e.x, e.y - e.r * .8) < (e.r + 40) ** 2) {
        player.lungeSet.add(e);
        stingTarget(e);
      }
    }
  }
  // bump-sting: little kids just fly straight into things — that counts, and it's funny
  if (player.cd <= 0 && player.dizzy <= 0 && player.lungeT <= 0) {
    for (const e of animals) {
      if (e.state === 'gone' || e.state === 'fleeing') continue;
      if (dist2(player.x, player.y, e.x, e.y - e.r * .8) < (e.r + 16) ** 2) {
        player.cd = STING_CD * .7; // stingTarget bounces the bee off, so this can't machine-gun
        stingTarget(e);
        break;
      }
    }
  }

  // the magic dandelion — fly into it and a whole new world blooms
  if (portalCd > 0) portalCd -= dt;
  else if (dist2(player.x, player.y, portal.x, portal.y - 24) < 62 * 62) {
    travelTo(worldNum + 1);
    return; // this frame's world just changed; start fresh next frame
  }
  if (flash > 0) flash = Math.max(0, flash - dt * 1.8);
  updateAmbient(dt);

  // camera
  cam.x = lerp(cam.x, player.x, 1 - Math.pow(.02, dt));
  cam.y = lerp(cam.y, player.y - 100, 1 - Math.pow(.02, dt));
  shake = Math.max(0, shake - dt * 30);

  // buzz audio tracks speed
  if (A.started) A.setBuzz(clamp(Math.hypot(player.vx, player.vy) / 520, 0, 1));
}

function travelTo(n) {
  if (A.started) { A.travel(); A.whoosh(); }
  genWorld(n);
  flash = 1;
  confettiBurst(player.x, player.y - 40, 80);
}

// biome weather: floating dander / leaves / snow / fireflies / sand glints
function updateAmbient(dt) {
  const type = THEME.amb;
  if (type !== 'none') {
    const want = type === 'twinkle' ? 34 : 60;
    if (ambient.length < want && rng() < .8) {
      const x = cam.x + rand(-cssW / SCALE * .6, cssW / SCALE * .6);
      const y = cam.y + rand(-cssH / SCALE * .6, cssH / SCALE * .6);
      if (x > 20 && x < WW - 20 && y > 20 && y < WH - 20) {
        ambient.push({
          type, x, y, t: 0, life: type === 'twinkle' ? rand(.8, 2) : rand(3, 7),
          ph: rng() * TAU, s: rand(.7, 1.3), vx: rand(-12, 12),
        });
      }
    }
  }
  for (let i = ambient.length - 1; i >= 0; i--) {
    const p = ambient[i]; p.t += dt;
    if (p.type === 'leaf') { p.y += 46 * p.s * dt; p.x += Math.sin(p.t * 1.6 + p.ph) * 24 * dt + p.vx * dt; }
    else if (p.type === 'snow') { p.y += 30 * p.s * dt; p.x += Math.sin(p.t * 1.2 + p.ph) * 18 * dt + p.vx * .3 * dt; }
    else if (p.type === 'fluff') { p.x += Math.sin(p.t * .9 + p.ph) * 16 * dt + 10 * dt; p.y -= 8 * dt + Math.sin(p.t * 2 + p.ph) * 8 * dt; }
    else if (p.type === 'firefly') { p.x += Math.sin(p.t * 1.2 + p.ph) * 18 * dt; p.y += Math.cos(p.t * .9 + p.ph * 1.7) * 14 * dt; }
    if (p.t > p.life) ambient.splice(i, 1);
  }
}

function updateCritter(e, dt, others) {
  e.hurtT = Math.max(0, e.hurtT - dt);
  e.phase += dt * 8;
  if (e.angryT > 0) e.angryT -= dt;

  if (e.state === 'gone') {
    e.spawnT -= dt;
    if (e.spawnT <= 0) {
      e.state = 'wander'; e.hp = e.maxhp; e.welts = []; e.enraged = false; e.angryT = 0;
      const a = rng() * TAU;
      e.x = e.home.x + Math.cos(a) * e.home.r * .9;
      e.y = e.home.y + Math.sin(a) * e.home.r * .9;
      if (e.type === 'bear') { addToast('GERALD IS BACK…'); if (A.started) A.roar(); }
    }
    return;
  }

  if (e.state === 'fleeing') {
    // run toward world edge away from home, poof when far away
    const dx = e.x - e.home.x, dy = e.y - e.home.y;
    const d = Math.hypot(dx, dy) || 1;
    e.x += (dx / d) * e.spd * 1.8 * dt; e.y += (dy / d) * e.spd * 1.8 * dt;
    e.dir = dx / d > 0 ? 1 : -1;
    if (rng() < .3) dust(e.x, e.y);
    if (e.x < -40 || e.x > WW + 40 || e.y < -40 || e.y > WH + 40 || d > e.home.r * 2.6) e.state = 'gone';
    return;
  }

  if (e.state === 'charge') { // bear chase
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    e.x += dx / d * 130 * dt; e.y += dy / d * 130 * dt;
    e.dir = dx > 0 ? 1 : -1; e.phase += dt * 6;
    if (!player.dizzy && dist2(e.x, e.y - 40, player.x, player.y) > 500 * 500) e.state = 'angry', e.angryT = 4;
    return;
  }

  if (e.state === 'angry') {
    // stomp around near the stinger for a moment
    if (e.angryT <= 0) { e.state = 'wander'; e.wt = 0; return; }
    e.tx = player.x + rand(-60, 60); e.ty = player.y + rand(-60, 60);
    stepToward(e, dt, 1.05);
    pondClamp(e);
    if (rng() < .06 && !FEATHERY.has(e.type) && !e.amphib) addPop(e.x, e.y - e.r * 2.2, 'HMPF!', '#ff8a80', 16);
    return;
  }

  // wander
  e.wt -= dt;
  if (e.wt <= 0) {
    e.wt = rand(1.5, 4);
    const a = rng() * TAU, d = rng() * (e.home.r * .8);
    e.tx = clamp(e.home.x + Math.cos(a) * d, 60, WW - 60);
    e.ty = clamp(e.home.y + Math.sin(a) * d * .8, 80, WH - 60);
    if (rng() < .3) { e.tx = e.x; e.ty = e.y; } // nap sometimes
  }
  stepToward(e, dt, e.type === 'duck' ? 1 : .7);
  // keep in home zone
  const hd = Math.hypot(e.x - e.home.x, e.y - e.home.y);
  if (hd > e.home.r) { e.tx = e.home.x; e.ty = e.home.y; }
  pondClamp(e);
}

function stepToward(e, dt, mul) {
  const dx = e.tx - e.x, dy = e.ty - e.y;
  const d = Math.hypot(dx, dy);
  if (d < 8) { return; }
  const s = e.spd * mul * dt;
  e.x += dx / d * Math.min(s, d); e.y += dy / d * Math.min(s, d);
  if (Math.abs(dx) > 6) e.dir = dx > 0 ? 1 : -1;
}

// nobody except the water folk wades the pond — everyone else walks around it
function pondClamp(e) {
  if (e.type === 'bear') return; // Gerald wades wherever he pleases
  const nx = (e.x - POND_E.x) / POND_E.rx, ny = (e.y - POND_E.y) / POND_E.ry;
  const d = nx * nx + ny * ny;
  if (e.amphib) {
    if (d > .8) {
      const s = Math.sqrt(d);
      e.x = POND_E.x + nx / s * POND_E.rx * .78; e.y = POND_E.y + ny / s * POND_E.ry * .78;
    }
  } else if (d < 1) {
    const s = Math.sqrt(d) || .001;
    e.x = POND_E.x + nx / s * POND_E.rx * 1.04; e.y = POND_E.y + ny / s * POND_E.ry * 1.04;
    e.tx = e.x; e.ty = e.y;
  }
}

// ------------------------------------------------------------------ drawing bits
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.closePath(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.closePath(); }

// ---- draw world pieces
function drawPond(t) {
  const P = ZONES.pond, w = THEME.water, frozen = THEME.frozen;
  ctx.save(); ctx.translate(P.x, P.y);
  ctx.fillStyle = w[0]; ell(0, 0, P.r * 1.02, P.r * .72 * 1.02); ctx.fill();
  ctx.fillStyle = w[1]; ell(0, 0, P.r, P.r * .72); ctx.fill();
  ctx.fillStyle = w[2]; ell(-P.r * .18, -P.r * .12, P.r * .55, P.r * .32); ctx.fill();
  if (frozen) {
    // ice: snow rim + cracks
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 9; ell(0, 0, P.r, P.r * .72); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.5;
    for (const c of P.cracks) {
      ctx.beginPath();
      ctx.moveTo(Math.cos(c.a) * P.r * .12, Math.sin(c.a) * P.r * .09);
      ctx.lineTo(Math.cos(c.a + c.b) * P.r * .5, Math.sin(c.a + c.b) * P.r * .36);
      ctx.lineTo(Math.cos(c.a + c.b * 2) * P.r * .9, Math.sin(c.a + c.b * 2) * P.r * .64);
      ctx.stroke();
    }
  } else {
    // shimmer arcs
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2.5;
    for (let i = 0; i < 5; i++) {
      const a = i * 1.3 + t * .4;
      const ox = Math.cos(i * 2.1) * P.r * .4, oy = Math.sin(i * 1.7) * P.r * .25;
      ctx.beginPath(); ctx.arc(ox + Math.sin(a) * 4, oy, 10 + i * 4, .2, Math.PI - .2); ctx.stroke();
    }
    // lily pads
    const lilies = [[-120, -60], [90, 70], [30, -100], [160, -20]];
    for (const [lx, ly] of lilies) {
      ctx.fillStyle = '#3e8f3a'; ell(lx, ly, 26, 17); ctx.fill();
      ctx.fillStyle = '#4fae47'; ell(lx - 3, ly - 3, 22, 13); ctx.fill();
      ctx.strokeStyle = '#376f2f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 20, ly + 10); ctx.stroke();
    }
  }
  // reeds
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * TAU + .4;
    const x = Math.cos(a) * P.r * 1.02, y = Math.sin(a) * P.r * .74;
    const sway = Math.sin(t * 1.6 + i) * 3;
    ctx.strokeStyle = frozen ? 'rgba(255,255,255,.7)' : '#4a8f3e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + sway, y - 18, x + sway * 2, y - 34); ctx.stroke();
  }
  ctx.restore();
}

function drawHive(t) {
  ctx.save(); ctx.translate(HIVE.x, HIVE.y);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ell(0, 6, 70, 22); ctx.fill();
  // stand legs + crossbar
  ctx.fillStyle = '#8a5a33'; rr(-44, -16, 9, 24, 3); ctx.fill(); rr(35, -16, 9, 24, 3); ctx.fill();
  rr(-48, -20, 96, 7, 3); ctx.fill();
  // skep dome bands (stacked arcs, wide at bottom)
  const dome = (w, y, h) => { ctx.beginPath(); ctx.moveTo(-w, y); ctx.bezierCurveTo(-w * 1.05, y - h * 1.25, w * 1.05, y - h * 1.25, w, y); ctx.closePath(); };
  const bands = [[58, -16, 30], [49, -34, 26], [39, -50, 22], [27, -64, 18], [14, -75, 13]];
  const grd = ctx.createLinearGradient(-60, 0, 60, -80);
  grd.addColorStop(0, '#d99a26'); grd.addColorStop(.5, '#f6c34e'); grd.addColorStop(1, '#e7a832');
  for (const [w, y, h] of bands) {
    dome(w, y, h);
    ctx.fillStyle = grd; ctx.fill();
    ctx.strokeStyle = 'rgba(150,95,20,.55)'; ctx.lineWidth = 2.5; ctx.stroke();
  }
  // rim highlight on each band
  ctx.strokeStyle = 'rgba(255,240,190,.5)'; ctx.lineWidth = 2;
  for (const [w, y, h] of bands) { ctx.beginPath(); ctx.moveTo(-w * .82, y - 2); ctx.quadraticCurveTo(0, y - h * .95, w * .82, y - 2); ctx.stroke(); }
  if (THEME.snowCaps) { // fresh snow on each shelf of the dome
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    for (const [w, y, h] of bands) { ell(0, y - h * .82, w * .62, 4.5); ctx.fill(); }
  }
  // top knob
  ctx.fillStyle = '#f6c34e'; circle(0, -84, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(150,95,20,.55)'; ctx.lineWidth = 2; circle(0, -84, 6); ctx.stroke();
  // entrance
  ctx.fillStyle = '#5b3a17'; ell(0, -14, 13, 12); ctx.fill();
  ctx.fillStyle = '#3d250c'; ell(0, -15, 9, 8); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,120,.28)'; ell(0, -16, 14, 13); ctx.fill(); // entrance glow
  // little welcome sign
  ctx.fillStyle = '#a4713f'; rr(64, -40, 6, 44, 2); ctx.fill();
  ctx.fillStyle = '#ffe9c4'; rr(46, -66, 44, 26, 5); ctx.fill();
  ctx.fillStyle = '#8a5a33'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('HIVE', 68, -48);
  // ambient bees circling entrance
  for (const hb of hiveBees) {
    const x = Math.cos(hb.a) * hb.rad, y = -34 + Math.sin(hb.bob) * 8 + Math.sin(hb.a) * hb.rad * .4;
    drawMiniBee(x, y, hb.a < 0 ? -1 : 1, hb.a * 6, .5);
  }
  if (honeyPotTimer > 0) { // celebration pot next to hive
    const x = 96, y = 6, pop = clamp((4 - honeyPotTimer) * 3, 0, 1);
    ctx.save(); ctx.translate(x, y); ctx.scale(pop, pop);
    ctx.fillStyle = '#b06d2e'; rr(-20, -34, 40, 40, 12); ctx.fill();
    ctx.fillStyle = '#d78a3d'; rr(-24, -44, 48, 14, 7); ctx.fill();
    ctx.fillStyle = '#ffd93d'; ell(0, -44, 16, 6); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawBarn(t) {
  ctx.save(); ctx.translate(BARN.x, BARN.y);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ell(0, 92, 150, 26); ctx.fill();
  // body
  ctx.fillStyle = '#b5382e'; rr(-140, -40, 280, 130, 6); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.08)'; rr(-140, 40, 280, 50, 6); ctx.fill();
  // roof
  ctx.fillStyle = '#7e4a3a';
  ctx.beginPath(); ctx.moveTo(-160, -34); ctx.lineTo(0, -116); ctx.lineTo(160, -34); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8f5642';
  ctx.beginPath(); ctx.moveTo(-150, -40); ctx.lineTo(0, -110); ctx.lineTo(150, -40); ctx.closePath(); ctx.fill();
  if (THEME.snowCaps) {
    ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-152, -40); ctx.lineTo(0, -110); ctx.lineTo(152, -40); ctx.stroke();
  }
  // door
  ctx.fillStyle = '#f5e7c8'; rr(-46, -4, 92, 94, 4); ctx.fill();
  ctx.fillStyle = '#b5382e'; rr(-38, 4, 76, 86, 3); ctx.fill();
  ctx.strokeStyle = '#f5e7c8'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-38, 4); ctx.lineTo(38, 90); ctx.moveTo(38, 4); ctx.lineTo(-38, 90); ctx.stroke();
  // hayloft window
  ctx.fillStyle = '#f5e7c8'; rr(-20, -84, 40, 34, 4); ctx.fill();
  ctx.fillStyle = '#7a5230'; rr(-14, -78, 28, 22, 3); ctx.fill();
  ctx.restore();
  // fence
  ctx.save();
  for (const p of fencePts) {
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(0,0,0,.10)'; ell(0, 2, 12, 4); ctx.fill();
    ctx.fillStyle = '#c89a66'; rr(-3, -26, 6, 28, 2); ctx.fill();
    ctx.restore();
  }
  ctx.strokeStyle = '#c89a66'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < fencePts.length; i++) {
    const p = fencePts[i];
    if (i === 0) ctx.moveTo(p.x, p.y - 14); else ctx.lineTo(p.x, p.y - 14);
  }
  ctx.closePath(); ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i < fencePts.length; i++) {
    const p = fencePts[i];
    if (i === 0) ctx.moveTo(p.x, p.y - 24); else ctx.lineTo(p.x, p.y - 24);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function drawPicnic(t) {

  ctx.fillStyle = '#a5652f'; rr(-104, -16, 30, 6, 3); ctx.fill();

  ctx.fillStyle = '#8bc34a'; rr(-10, -42, 14, 12, 4); ctx.fill(); // juice box

}

function drawTree(tr, t) {
  const sway = Math.sin(t * 1.1 + tr.sway) * 3 * tr.s;
  const P = THEME;
  ctx.save(); ctx.translate(tr.x, tr.y);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ell(6, 4, 34 * tr.s, 12 * tr.s); ctx.fill();

  if (tr.kind === 'pine') {
    ctx.fillStyle = P.trunk; rr(-5 * tr.s, -26 * tr.s, 10 * tr.s, 28 * tr.s, 3); ctx.fill();
    const cy = -30 * tr.s;
    ctx.fillStyle = P.leaf;
    for (let i = 0; i < 3; i++) {
      const w = (34 - i * 8) * tr.s, y = cy - i * 22 * tr.s, h = 30 * tr.s;
      ctx.beginPath(); ctx.moveTo(-w + sway * .3 * i, y); ctx.lineTo(sway, y - h); ctx.lineTo(w + sway * .3 * i, y); ctx.closePath(); ctx.fill();
    }
    if (P.snowCaps) {
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      for (let i = 0; i < 3; i++) { const w = (30 - i * 8) * tr.s, y = cy - i * 22 * tr.s - 8 * tr.s; ell(sway * .6, y, w * .55, 4.5 * tr.s); ctx.fill(); }
    }
    ctx.restore(); return;
  }
  if (tr.kind === 'palm') {
    ctx.strokeStyle = '#9a6b3f'; ctx.lineWidth = 9 * tr.s; ctx.lineCap = 'round';
    const topX = sway * 2 + 14 * tr.s, topY = -78 * tr.s;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(10 * tr.s, -40 * tr.s, topX, topY); ctx.stroke();
    ctx.strokeStyle = P.leaf; ctx.lineWidth = 7 * tr.s;
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI * .9 + i * Math.PI * .18;
      ctx.beginPath(); ctx.moveTo(topX, topY);
      ctx.quadraticCurveTo(topX + Math.cos(a) * 30 * tr.s, topY + Math.sin(a) * 20 * tr.s - 8, topX + Math.cos(a) * 52 * tr.s, topY + Math.sin(a) * 10 * tr.s + 14);
      ctx.stroke();
    }
    ctx.fillStyle = '#8a5a33'; circle(topX - 6, topY + 8, 5 * tr.s); ctx.fill(); circle(topX + 6, topY + 10, 5 * tr.s); ctx.fill();
    ctx.restore(); return;
  }
  // round leafy tree
  ctx.fillStyle = P.trunk; rr(-6 * tr.s, -34 * tr.s, 12 * tr.s, 38 * tr.s, 3); ctx.fill();
  ctx.fillStyle = P.trunkD; rr(-6 * tr.s, -34 * tr.s, 4 * tr.s, 38 * tr.s, 3); ctx.fill();
  const cx = sway, cy = -52 * tr.s;
  ctx.fillStyle = P.leaf;
  circle(cx, cy, 30 * tr.s); ctx.fill();
  circle(cx - 22 * tr.s, cy + 12 * tr.s, 20 * tr.s); ctx.fill();
  circle(cx + 22 * tr.s, cy + 12 * tr.s, 21 * tr.s); ctx.fill();
  ctx.fillStyle = P.leafL;
  circle(cx - 8 * tr.s, cy - 12 * tr.s, 18 * tr.s); ctx.fill();
  circle(cx + 14 * tr.s, cy - 4 * tr.s, 14 * tr.s); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  circle(cx - 10 * tr.s, cy - 16 * tr.s, 8 * tr.s); ctx.fill();
  if (P.snowCaps) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ell(cx, cy - 20 * tr.s, 18 * tr.s, 6 * tr.s); ctx.fill(); }
  ctx.restore();
}

function drawFlower(f, t) {
  ctx.save(); ctx.translate(f.x, f.y);
  const sway = Math.sin(t * 2 + f.sway) * .08;
  ctx.rotate(sway);
  ctx.strokeStyle = THEME.stem; ctx.lineWidth = 3;
  if (f.ready) {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(2, -8, 0, -16); ctx.stroke();
    ctx.fillStyle = THEME.stem; ell(5, -8, 5, 3); ctx.fill();
    const n = 6;
    ctx.fillStyle = f.col[0];
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + t * .2;
      circle(Math.cos(a) * 7, -16 + Math.sin(a) * 7, 5.4); ctx.fill();
    }
    ctx.fillStyle = f.col[1]; circle(0, -16, 5); ctx.fill();
  } else {
    // droopy regrowing bud
    const g = clamp(f.grow / 4, 0, 1);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(3, -6, 6, -4 - g * 8); ctx.stroke();
    ctx.fillStyle = THEME.leafL; circle(6, -4 - g * 8, 3.5 + g * 2); ctx.fill();
  }
  ctx.restore();
}

function drawTuft(tf, t) {
  const sway = Math.sin(t * 2.2 + tf.x * .05) * 1.5;
  ctx.strokeStyle = tf.c > .5 ? THEME.grassA : THEME.grassB;
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(tf.x, tf.y); ctx.quadraticCurveTo(tf.x + sway * .5, tf.y - tf.h * .6, tf.x - 3 + sway, tf.y - tf.h);
  ctx.moveTo(tf.x, tf.y); ctx.quadraticCurveTo(tf.x + sway, tf.y - tf.h * .7, tf.x + 3 + sway, tf.y - tf.h * .9);
  ctx.stroke();
}

function drawDandelion(d, t) {
  const sway = Math.sin(t * 1.5 + d.x * .05) * 2;
  ctx.save(); ctx.translate(d.x, d.y);
  ctx.strokeStyle = THEME.stem; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(sway, -12, sway * 1.6, -22 * d.s); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  circle(sway * 1.6, -22 * d.s, 7 * d.s); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + t * .3;
    ctx.beginPath();
    ctx.moveTo(sway * 1.6, -22 * d.s);
    ctx.lineTo(sway * 1.6 + Math.cos(a) * 11 * d.s, -22 * d.s + Math.sin(a) * 11 * d.s);
    ctx.stroke();
  }
  ctx.restore();
}

function drawRock(r) {
  ctx.save(); ctx.translate(r.x, r.y);
  const s = r.s;
  ctx.fillStyle = 'rgba(0,0,0,.14)'; ell(4 * s, 2, 20 * s, 7 * s); ctx.fill();
  ctx.fillStyle = '#9ba3a6';
  ell(0, -8 * s, 19 * s, 12 * s); ctx.fill();
  ctx.fillStyle = '#aab2b5';
  ell(-4 * s, -11 * s, 12 * s, 8 * s); ctx.fill();
  ctx.fillStyle = 'rgba(70,80,84,.35)';
  ell(7 * s, -4 * s, 8 * s, 5 * s); ctx.fill();
  ctx.fillStyle = THEME.moss; ell(-14 * s, -2 * s, 5 * s, 2.4 * s); ctx.fill(); // moss
  if (THEME.snowCaps) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ell(-2 * s, -13 * s, 10 * s, 4 * s); ctx.fill(); }
  ctx.restore();
}

function drawBush(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.fillStyle = 'rgba(0,0,0,.14)'; ell(3, 3, 26 * b.s, 9 * b.s); ctx.fill();
  ctx.fillStyle = THEME.leaf;
  circle(-12 * b.s, -8 * b.s, 14 * b.s); ctx.fill();
  circle(12 * b.s, -8 * b.s, 15 * b.s); ctx.fill();
  circle(0, -14 * b.s, 15 * b.s); ctx.fill();
  ctx.fillStyle = THEME.leafL; circle(-4 * b.s, -16 * b.s, 10 * b.s); ctx.fill();
  ctx.fillStyle = '#e5585d';
  circle(8 * b.s, -12 * b.s, 2.5); ctx.fill(); circle(-9 * b.s, -14 * b.s, 2.5); ctx.fill();
  if (THEME.snowCaps) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ell(0, -22 * b.s, 14 * b.s, 5 * b.s); ctx.fill(); }
  ctx.restore();
}

// the magic dandelion: this world's exit to the next one
function drawPortal(t) {
  ctx.save(); ctx.translate(portal.x, portal.y);
  const pulse = 1 + Math.sin(t * 2.4) * .08;
  // glow
  const g = ctx.createRadialGradient(0, -26, 4, 0, -26, 70 * pulse);
  g.addColorStop(0, 'rgba(255,240,170,.55)'); g.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = g; circle(0, -26, 70 * pulse); ctx.fill();
  // stem
  ctx.strokeStyle = THEME.stem; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(6, -18, 0, -34); ctx.stroke();
  // dandelion head
  ctx.fillStyle = 'rgba(255,255,255,.92)'; circle(0, -40, 9); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.4;
  const r1 = 17 * pulse;
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * TAU + t * .6;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 6, -40 + Math.sin(a) * 6);
    ctx.lineTo(Math.cos(a) * r1, -40 + Math.sin(a) * r1); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.9)'; circle(Math.cos(a) * r1, -40 + Math.sin(a) * r1, 1.6); ctx.fill();
  }
  // orbiting sparkles
  for (let i = 0; i < 3; i++) {
    const a = t * 1.8 + i / 3 * TAU;
    drawStar(Math.cos(a) * 30, -40 + Math.sin(a) * 12, 4, 'rgba(255,220,120,.9)');
  }
  // label
  ctx.font = '900 13px system-ui'; ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,25,0,.55)';
  ctx.strokeText('MAGIC DANDELION', 0, -74);
  ctx.fillStyle = '#fff3b0'; ctx.fillText('MAGIC DANDELION', 0, -74);
  ctx.restore();
}

function drawAmbient(t) {
  for (const p of ambient) {
    if (!visible(p.x, p.y, 40)) continue;
    const a = clamp(Math.sin(clamp(p.t / p.life, 0, 1) * Math.PI) * 1.5, .05, 1);
    ctx.globalAlpha = a;
    if (p.type === 'leaf') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.t * 2 + p.ph);
      ctx.fillStyle = p.s > 1 ? '#d97b2f' : '#e8a33d'; ell(0, 0, 6 * p.s, 3 * p.s); ctx.fill(); ctx.restore();
    } else if (p.type === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,.85)'; circle(p.x, p.y, 2.2 * p.s + 1); ctx.fill();
    } else if (p.type === 'fluff') {
      ctx.fillStyle = 'rgba(255,255,255,.75)'; circle(p.x, p.y, 2.4 * p.s + 1); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const an = i / 4 * TAU + p.ph;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(an) * 4.5 * p.s, p.y + Math.sin(an) * 4.5 * p.s); ctx.stroke();
      }
    } else if (p.type === 'firefly') {
      const g = .5 + .5 * Math.sin(t * 4 + p.ph);
      ctx.fillStyle = `rgba(200,255,140,${.15 + .25 * g})`; circle(p.x, p.y, 6); ctx.fill();
      ctx.fillStyle = 'rgba(240,255,180,.95)'; circle(p.x, p.y, 1.8); ctx.fill();
    } else if (p.type === 'twinkle') {
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.6;
      const r = 5 * p.s * (.4 + .6 * Math.sin(t * 6 + p.ph));
      ctx.beginPath(); ctx.moveTo(p.x - r, p.y); ctx.lineTo(p.x + r, p.y); ctx.moveTo(p.x, p.y - r); ctx.lineTo(p.x, p.y + r); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// ---- critter drawing ------------------------------------------------------
function drawWelts(e) {
  ctx.fillStyle = '#ff8d8d';
  for (const w of e.welts) {
    const x = w[0] * e.r, y = w[1] * e.r;
    circle(x, y, 4.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)'; circle(x - 1, y - 1, 1.6); ctx.fill(); ctx.fillStyle = '#ff8d8d';
  }
}

function angryMarks(e) {
  if (e.angryT <= 0 || e.state === 'fleeing') return;
  ctx.save(); ctx.globalAlpha = .5 + .5 * Math.abs(Math.sin(tPlay * 6));
  ctx.fillStyle = 'rgba(255,244,179,.92)';
  ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    const ang = i / 12 * TAU, R = i % 2 ? 7 : 13;
    const px2 = e.r * .8 + Math.cos(ang) * R, py2 = -e.r * 2.35 + Math.sin(ang) * R;
    if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d84343'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('!', e.r * .8, -e.r * 2.35 + 4.5);
  ctx.restore();
}

function drawCritter(e, t) {
  if (e.state === 'gone') return;
  const r = e.r;
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = 'rgba(0,0,0,.17)'; ell(0, 2, r * .85, r * .3); ctx.fill();
  ctx.scale(e.dir, 1);
  const hurt = e.hurtT > 0 ? Math.sin(e.hurtT * 40) * .06 : 0;
  ctx.rotate(hurt);
  const run = e.state === 'fleeing' || e.state === 'charge' || (e.state === 'angry');
  const ph = e.phase * (run ? 2.2 : 1);

  switch (e.type) {
    case 'dog': {
      const leg = Math.sin(ph) * 6;
      ctx.strokeStyle = '#c08a4e'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-10, -18); ctx.lineTo(-10 + leg, 0); ctx.moveTo(10, -18); ctx.lineTo(10 - leg, 0); ctx.stroke();
      ctx.fillStyle = '#d8a25e'; ell(0, -30, 22, 15); ctx.fill();
      ctx.strokeStyle = '#d8a25e'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-20, -36); ctx.quadraticCurveTo(-30, -46 + Math.sin(t * 8) * 4, -26, -52); ctx.stroke();
      circle(16, -44, 11); ctx.fill(); // head
      ctx.fillStyle = '#c08a4e'; ell(24, -41, 7, 5); ctx.fill(); // snout
      ctx.fillStyle = '#3a2a1a'; circle(27, -42, 2); ctx.fill();  // nose
      circle(18, -47, 2); ctx.fill(); // eye
      ctx.fillStyle = '#b6813f'; ell(11, -52, 5, 8); ctx.fill(); // ear
      ctx.fillStyle = '#3a2a1a';
      if (e.angryT > 0) { ctx.beginPath(); ctx.moveTo(14, -52); ctx.lineTo(22, -49); ctx.stroke(); }
      break;
    }
    case 'cat': {
      const leg = Math.sin(ph) * 5;
      ctx.strokeStyle = '#8e9bb3'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-9, -17); ctx.lineTo(-9 + leg, 0); ctx.moveTo(9, -17); ctx.lineTo(9 - leg, 0); ctx.stroke();
      ctx.fillStyle = '#a6b3c9'; ell(0, -28, 20, 14); ctx.fill();
      ctx.strokeStyle = '#a6b3c9'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-18, -32); ctx.quadraticCurveTo(-34, -40 + Math.sin(t * 2) * 6, -30, -56); ctx.stroke();
      circle(15, -40, 10); ctx.fill();
      ctx.fillStyle = '#a6b3c9';
      ctx.beginPath(); ctx.moveTo(9, -48); ctx.lineTo(7, -58); ctx.lineTo(14, -51); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(18, -49); ctx.lineTo(22, -58); ctx.lineTo(24, -48); ctx.closePath(); ctx.fill();
      circle(18, -42, 2); ctx.fill();
      ctx.fillStyle = '#333'; circle(18, -42, 1.4); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(20, -39); ctx.lineTo(28, -40); ctx.moveTo(20, -37); ctx.lineTo(28, -36); ctx.stroke();
      break;
    }
    case 'duck': {
      const bob = Math.sin(t * 4 + e.seed * 9) * 2;
      ctx.fillStyle = 'rgba(255,255,255,.4)'; ell(0, 2, 22, 8); ctx.fill(); // ripple
      ctx.fillStyle = '#fdfdfd'; ell(0, -10 + bob, 17, 11); ctx.fill();
      ctx.fillStyle = '#f2f2f2'; ell(-6, -8 + bob, 10, 7); ctx.fill();
      circle(12, -20 + bob, 8); ctx.fill();
      ctx.fillStyle = '#f4a63a'; ell(19, -18 + bob, 6, 3.5); ctx.fill();
      ctx.fillStyle = '#333'; circle(14, -22 + bob, 1.8); ctx.fill();
      break;
    }
    case 'goose': {
      const hiss = e.angryT > 0 || run;
      const stretch = hiss ? Math.sin(t * 12) * 2 : 0;
      ctx.strokeStyle = '#f4a63a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(-3, 0); ctx.moveTo(5, -8); ctx.lineTo(5, 0); ctx.stroke();
      ctx.fillStyle = '#fbfbfb'; ell(0, -16, 14, 10); ctx.fill(); // body
      ctx.beginPath(); ctx.moveTo(-12, -20); ctx.lineTo(-20, -26); ctx.lineTo(-10, -24); ctx.closePath(); ctx.fill(); // tail cocked up
      ctx.strokeStyle = '#fbfbfb'; ctx.lineWidth = 6; // long hissing neck
      ctx.beginPath(); ctx.moveTo(9, -20); ctx.quadraticCurveTo(15, -30 - stretch, 14, -38 - stretch); ctx.stroke();
      circle(14, -41 - stretch, 6); ctx.fill();
      ctx.fillStyle = '#f4a63a';
      ctx.beginPath(); ctx.moveTo(19, -42 - stretch); ctx.lineTo(26, -40 - stretch + (hiss ? 3 : 0)); ctx.lineTo(19, -38 - stretch); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#222'; circle(16, -43 - stretch, 1.6); ctx.fill();
      ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-4, -16); ctx.quadraticCurveTo(4, -12, 8, -18); ctx.stroke(); // wing line
      break;
    }
    case 'bunny': {
      const hop = run ? Math.abs(Math.sin(ph * .9)) * 8 : Math.abs(Math.sin(ph * .35)) * 2;
