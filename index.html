class Player {
  constructor(song) {
    this.song = song;
    this.playing = false; this.muted = false;
    this.ctx = null; this.master = null;
    this.ev = [];
    for (const t of song.tracks) for (const e of t.ev) this.ev.push(e);
    this.ev.sort((a, b) => a[0] - b[0]);
    this.songLen = song.end * STEP;
  }
  async toggle() { this.playing ? this.stop() : await this.start(); return this.playing; }
  async start() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.build = buildChannels(this.ctx);
    }
    await this.ctx.resume();
    this.t0 = this.ctx.currentTime + 0.15;
    this.playing = true; this.tick = 0; this.base = 0;
    this.timer = setInterval(() => this.schedule(), 100);
    this.schedule();
  }
  stop() { this.playing = false; clearInterval(this.timer); if (this.ctx) this.ctx.suspend(); }
  applyMute() {
    if (!this.build || !this.ctx) return;
    this.build.master.gain.setTargetAtTime(this.muted ? 0.0001 : 0.85, this.ctx.currentTime, 0.05);
  }
  schedule() {
    if (!this.playing) return;
    const c = this.ctx, ahead = c.currentTime + 0.5;
    for (; this.tick < this.ev.length; this.tick++) {
      const e = this.ev[this.tick];
      const at = this.base + e[0] * STEP;
      if (at > ahead) break;
      if (at >= c.currentTime - 0.02) playEvent(c, this.build.chans[String(e[4])], e, at);
    }
    if (this.tick >= this.ev.length) { this.base += this.songLen + 4 * STEP; this.tick = 0; }
  }

  static async renderOffline(song, seconds, solo) {
    const sr = 44100;
    const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const c = new OC(1, Math.floor(sr * seconds), sr);
    const { chans } = buildChannels(c);
    if (solo) for (const ch in chans) chans[ch].gain.value = (ch === String(solo)) ? CH_GAIN[ch] : 0;
    const ev = [];
    for (const t of song.tracks) for (const e of t.ev) ev.push(e);
    ev.sort((a, b) => a[0] - b[0]);
    for (const e of ev) {
      const at = e[0] * STEP;
      if (at > seconds - 1) break;
      playEvent(c, chans[String(e[4])], e, at);
    }
    const buf = await c.startRendering();
    return { sr, data: Array.from(buf.getChannelData(0)) };

function makePalm(scale = 1) {
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x9a7440 });
  const frondMat = new THREE.MeshLambertMaterial({ color: 0x2f9c4a, side: THREE.DoubleSide });
  const frond2Mat = new THREE.MeshLambertMaterial({ color: 0x46b45e, side: THREE.DoubleSide });
  let prev = new THREE.Vector3(0, 0, 0);
  const lean = 0.34;
  for (let s = 0; s < 5; s++) {
    const a = lean * (s / 4); // lean grows with height
    const dir = new THREE.Vector3(Math.sin(a), Math.cos(a), 0);
    const nxt = prev.clone().addScaledVector(dir, 1.75);
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.15 - s * 0.017, 0.18 - s * 0.015, 1.8, 7), trunkMat);
    seg.position.copy(prev).add(nxt).multiplyScalar(0.5);
    seg.rotation.z = -a;
    g.add(seg);
    prev = nxt;
  }
  const top = prev;
  for (let f = 0; f < 8; f++) {
    const a = f * 2 * Math.PI / 8 + 0.4;
    const fr = new THREE.Mesh(new THREE.ConeGeometry(0.5, 3.4, 5), (f % 2) ? frond2Mat : frondMat);
    fr.position.copy(top);
    fr.rotation.order = 'YXZ';
    fr.rotation.y = a;
    fr.rotation.x = Math.PI / 2 - 0.5 - 0.3 * ((f * 13) % 3) / 3; // point out & droop
    fr.translateZ(1.6);
    g.add(fr);
  }
  for (let f = 0; f < 4; f++) { // upright heart leaves
    const a = f * 2 * Math.PI / 4 + 0.8;
    const fr = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.6, 5), frond2Mat);
    fr.position.copy(top).add(new THREE.Vector3(0, 0.35, 0));
    fr.rotation.order = 'YXZ';
    fr.rotation.y = a;
    fr.rotation.x = Math.PI / 2 - 1.1;
    fr.translateZ(0.7);
    g.add(fr);
  }
  g.scale.setScalar(scale);
  return g;
}

    glass.position.set(0, 1.0, len * 0.14); glass.rotation.x = 0.32; g.add(glass);
    const bar = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.05, 8, 14, Math.PI), chrome);
    bar.position.set(0, 0.92, -len * 0.18); bar.rotation.z = Math.PI; bar.rotation.y = Math.PI / 2;
    g.add(bar);
    for (const sx of [-1, 1]) {
      const seat = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.16), dark);
      seat.position.set(sx * 0.42, 0.8, -len * 0.16); g.add(seat);
      const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.05, 0.09), chrome);
      mirror.position.set(sx * (w / 2 + 0.14), 1.0, len * 0.1); g.add(mirror);
    }
  }
  // wheels (all cars)
  g.userData.wheels = [];
  {
    const wgeo = new THREE.CylinderGeometry(0.36, 0.36, 0.28, 18);
    for (const [sx, sz] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]) {
      const wheel = new THREE.Group();
      const tire = new THREE.Mesh(wgeo, dark);
      tire.rotation.z = Math.PI / 2;
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.3, 8), chrome);
      rim.rotation.z = Math.PI / 2;
      wheel.add(tire, rim);
      wheel.position.set(sx * (w / 2 - 0.05), 0.36, sz * len * 0.33);
      g.add(wheel); g.userData.wheels.push(wheel);
    }
  }
  if (people) {
    const skin = new THREE.MeshLambertMaterial({ color: 0xe8b48c });
    const hair1 = new THREE.MeshLambertMaterial({ color: 0xd9a24a });
    const hair2 = new THREE.MeshLambertMaterial({ color: 0xf28c28 });
    const mkPerson = (sx, hc, blue) => {
      const per = new THREE.Group();
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.26, 0.5, 8),
        new THREE.MeshLambertMaterial({ color: blue ? 0x2f6fd0 : 0xffffff }));
      torso.position.y = 0.98;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 8), skin);
      head.position.y = 1.42;
      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), hc);
      hair.scale.set(1, 1.05, 1.15); hair.position.set(0, 1.44, -0.05);
      per.add(torso, head, hair);
      per.position.set(sx, 0, 0.05);
      return per;
    };
    const d = mkPerson(0.42, hair1, true);
    d.children[2].scale.set(1, 0.9, 1); // shorter driver hair
    g.add(d);
    const p = mkPerson(-0.42, hair2, false);
    g.add(p);
    // passenger waving arm (raised, waving)
    const arm = new THREE.Group();
    const limb = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.065, 0.55, 6), skin);
    limb.position.y = 0.3;
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), skin);
    hand.position.y = 0.62;
    arm.add(limb, hand);
    arm.position.set(-0.6, 1.1, 0.12);
    g.add(arm);
    g.userData.arm = arm;
    // steering wheel
    const sw = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.025, 6, 12), dark);
    sw.position.set(0.42, 1.12, 0.36); sw.rotation.x = 1.2; g.add(sw);
  }
  // rear face: tail panel, lights, exhaust, plate, SEEGA badge
  const tail = new THREE.Mesh(new THREE.BoxGeometry(w * 0.98, 0.36, 0.05), dark);
  tail.position.set(0, 0.52, -len / 2 + 0.02); g.add(tail);
  const tailMat = new THREE.MeshBasicMaterial({ color: 0xe03428 });
  for (const sx of [-1, 1]) {
    for (let k = 0; k < 2; k++) {
      const tl = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.09, 0.04), tailMat);
      tl.position.set(sx * (w * 0.34), 0.56 + k * 0.13, -len / 2 - 0.01); g.add(tl);
    }
  }
  if (plate) {
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.35),
      new THREE.MeshBasicMaterial({ map: makePlate() }));
    pl.position.set(0, 0.34, -len / 2 - 0.02); pl.rotation.y = Math.PI; g.add(pl);
    const se = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.105),
      new THREE.MeshBasicMaterial({ map: makeText('SEEGA', '#e8e8e8', 44) }));
    se.position.set(0.12, 0.78, -len / 2 - 0.02); se.rotation.y = Math.PI; g.add(se);
  }
  if (!coupe) {
    const exMat = new THREE.MeshStandardMaterial({ color: 0x9aa0a8, metalness: 0.8, roughness: 0.3 });
    for (const sx of [-1, 1]) for (const o of [0, 0.12]) {
      const ex = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.2, 8), exMat);
      ex.rotation.x = Math.PI / 2;
      ex.position.set(sx * (w * 0.24), 0.26, -len / 2 - 0.06 + o);
      g.add(ex);
    }
  }
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(len * 1.15, w * 1.5),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.y = 0.045; g.add(sh);
  return g;
}

const hero = makeCar({ color: 0xcf1f14, people: true, plate: true });
scene.add(hero);
const blue = makeCar({ color: 0x2450b0, coupe: true, len: 4.2 });
const yellow = makeCar({ color: 0xf0a51c, coupe: true, len: 4.0 });
scene.add(blue, yellow);

/* ------------------------------ smoke ------------------------------ */
const smokeMat = () => new THREE.MeshLambertMaterial({ color: 0xf8f9fc, transparent: true, opacity: 0.6 });
const smoke = [];
for (let i = 0; i < 80; i++) {
  const p = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), smokeMat());
  p.visible = false; p.userData.age = -1; scene.add(p); smoke.push(p);
}
let smokeCur = 0;
function puff(pos, s0) {
  const p = smoke[smokeCur++ % smoke.length];
  p.visible = true; p.userData.age = 0; p.userData.s0 = s0;
  p.position.copy(pos);
  p.position.y = 0.35 + Math.random() * 0.5;
  p.position.x += (Math.random() - 0.5) * 0.6;
  p.position.z += (Math.random() - 0.5) * 0.6;
}

/* ------------------------------ logo ------------------------------ */
let logoMesh = null;
{
  const c = document.createElement('canvas'); c.width = 1100; c.height = 420;
  const x = c.getContext('2d');
  const done = () => {
    const text = 'Out Run';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = "190px Pacifico, 'Brush Script MT', cursive";
    // black offset shadow
    x.fillStyle = 'rgba(5,5,10,.9)'; x.fillText(text, 560 + 12, 230 + 16);
    // thick black outline
    x.strokeStyle = '#05060a'; x.lineWidth = 34; x.lineJoin = 'round';
    x.strokeText(text, 560, 230);
    // sky-to-sunset gradient fill
    const gr = x.createLinearGradient(0, 60, 0, 360);
    gr.addColorStop(0, '#4aa2e8'); gr.addColorStop(0.38, '#eaf6fd');
    gr.addColorStop(0.5, '#e05a24'); gr.addColorStop(0.66, '#f5a623'); gr.addColorStop(0.9, '#ffd94d');
    x.fillStyle = gr; x.fillText(text, 560, 230);
    // white glints
    x.fillStyle = '#fff';
    for (const [sx, sy, s] of [[368, 105, 16], [600, 90, 12], [830, 130, 14], [452, 210, 10], [920, 260, 11]]) {
      x.beginPath();
      x.moveTo(sx, sy - s); x.lineTo(sx + s * 0.3, sy - s * 0.3); x.lineTo(sx + s, sy);
      x.lineTo(sx + s * 0.3, sy + s * 0.3); x.lineTo(sx, sy + s); x.lineTo(sx - s * 0.3, sy + s * 0.3);
      x.lineTo(sx - s, sy); x.lineTo(sx - s * 0.3, sy - s * 0.3); x.fill();
    }
    const tex = ctex(new THREE.CanvasTexture(c));
    logoMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, fog: false, depthTest: false }));
    logoMesh.scale.set(88, 34, 1);
    logoMesh.renderOrder = 999;
    scene.add(logoMesh);
  };
  if (document.fonts && document.fonts.load) {
    document.fonts.load('190px Pacifico').then(done).catch(done);
  } else done();
}

/* --------------------------- motion state --------------------------- */
const SPEED = 27;                 // m/s
let t = 0, heroS = 0;
const heroU = s => 0.6 * Math.sin(s * 0.021) + 1.7 * Math.sin(s * 0.0069 + 1.3);
const cam = { yaw: 0, pitch: 0, uYaw: 0, uPitch: 0 };
let started = false, introT = 0;

function placeCar(g, th, r) {
  g.position.copy(posOn(th, r, 0));
  // travel direction = decreasing theta: F = (-cos th, 0, sin th)
  g.rotation.y = Math.atan2(-Math.cos(th), Math.sin(th));
}

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (started) { introT += dt; }
  t += dt;
  heroS += SPEED * dt;
  const th0 = -heroS / R;
  const uH = heroU(heroS);
  placeCar(hero, th0, R + uH);

  const thB = th0 - (55 + 14 * Math.sin(heroS * 0.011)) / R, uB = 2.6 + 0.5 * Math.sin(heroS * 0.013);
  placeCar(blue, thB, R + uB);
  const thY = th0 - (24 + 9 * Math.sin(heroS * 0.019 + 1)) / R, uY = -4.4 + 0.4 * Math.sin(heroS * 0.017 + 2);
  placeCar(yellow, thY, R + uY);

  // wheels + waving arm
  const spin = SPEED / 0.36 * dt;
  for (const c of [hero, blue, yellow])
    for (const w of c.userData.wheels) w.rotation.x += spin;
  if (hero.userData.arm) hero.userData.arm.rotation.z = 0.38 + 0.42 * Math.sin(t * 4.2);

  // smoke: rear wheels + exhausts, left behind in world space
  const spawnN = 3;
  for (let k = 0; k < spawnN; k++) {
    const side = k === 0 ? -1 : 1;
    const p = hero.getWorldPosition(new THREE.Vector3());
    const fwd = new THREE.Vector3(-Math.cos(th0), 0, Math.sin(th0));
    const lat = new THREE.Vector3(Math.sin(th0), 0, Math.cos(th0));
    puff(p.clone().addScaledVector(fwd, -3.2 - Math.random() * 1.4)
      .addScaledVector(lat, side * (0.9 + Math.random() * 0.4)), 0.5);
    if (k === 0) puff(p.clone().addScaledVector(fwd, -3.4), 0.32);
    // blue car trail
    if (Math.random() < 0.8) {
      const pb = blue.getWorldPosition(new THREE.Vector3());
      const fb = new THREE.Vector3(-Math.cos(thB), 0, Math.sin(thB));
      const lb = new THREE.Vector3(Math.sin(thB), 0, Math.cos(thB));
      puff(pb.clone().addScaledVector(fb, -2.6).addScaledVector(lb, (Math.random() - 0.5) * 2), 0.55);
    }
  }
  for (const p of smoke) {
    if (p.userData.age < 0) continue;
    p.userData.age += dt;
    const a = p.userData.age;
    if (a > 3.0) { p.visible = false; p.userData.age = -1; continue; }
    const s = p.userData.s0 * (1 + a * 1.0);
    p.scale.setScalar(s);
    p.material.opacity = 0.6 * (1 - a / 3.0);
    p.position.y += dt * 0.45;
  }

  // ocean foam pulse
  for (let i = 0; i < window.__foam.length; i++) {
    window.__foam[i].material.opacity = 0.55 + 0.25 * Math.sin(t * 0.9 + i * 2.1);
  }
  clouds.rotation.y += dt * 0.0008;

  // camera: chase cam, poster framing; intro swing on first seconds
  const intro = Math.min(1, introT / 5);
  const ease = intro * intro * (3 - 2 * intro);
  const introYaw = (1 - ease) * -0.4;
  const introBack = (1 - ease) * 10;
  const behind = 6.8 + introBack;
  const thC = th0 + behind / R;
  const cy = 2.0 + 0.08 * Math.sin(t * 1.7);
  camera.position.copy(posOn(thC, R + uH * 0.8, cy));
  const tgt = posOn(th0, R + uH, 1.1).addScaledVector(
    new THREE.Vector3(-Math.cos(th0), 0, Math.sin(th0)), 12);
  camera.up.set(0, 1, 0);
  camera.lookAt(tgt);
  camera.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), cam.uYaw + introYaw);
  camera.rotateX(cam.uPitch);

  // logo floats ahead of the car, billboarded
  if (logoMesh) {
    const thL = th0 - 150 / R;
    logoMesh.position.copy(posOn(thL, R + 4, 44));
    logoMesh.lookAt(camera.position);
  }

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

/* --------------------------- UI / controls --------------------------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

document.getElementById('startBtn').addEventListener('click', async () => {
  started = true; introT = 0;
  document.getElementById('start').classList.add('off');
  document.getElementById('controls').classList.remove('hidden');
  document.getElementById('hint').classList.remove('hidden');
  await player.toggle();
  setTimeout(() => document.getElementById('hint').classList.add('hidden'), 7000);
});
const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click', async () => {
  if (!player.ctx) { await player.start(); player.applyMute(); }
  else if (player.playing) { player.muted = true; player.applyMute(); }
  else { player.muted = false; player.applyMute(); await player.start(); }
  musicBtn.classList.toggle('muted', !player.playing || player.muted);
});
const titleBtn = document.getElementById('titleBtn');
titleBtn.addEventListener('click', () => {
  if (!logoMesh) return;
  logoMesh.visible = !logoMesh.visible;
  titleBtn.classList.toggle('off', !logoMesh.visible);
});
document.getElementById('fsBtn').addEventListener('click', () => stage.classList.toggle('fullscreen'));

let drag = null;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY, cam.yaw, cam.pitch]; });
addEventListener('pointermove', e => {
  if (!drag) return;
  cam.yaw = THREE.MathUtils.clamp(drag[2] + (e.clientX - drag[0]) * 0.003, -0.5, 0.5);
  cam.pitch = THREE.MathUtils.clamp(drag[3] + (e.clientY - drag[1]) * 0.002, -0.2, 0.25);
});
addEventListener('pointerup', () => { drag = null; });
function lerpC() {
  cam.uYaw += (cam.yaw - cam.uYaw) * 0.08;
  cam.uPitch += (cam.pitch - cam.uPitch) * 0.08;
  requestAnimationFrame(lerpC);
}
lerpC();

/* expose for verification */
window.OUTRUN = { player, song: SONG, render: (s, solo) => Player.renderOffline(SONG, s, solo) };
window.SCENE = { scene, THREE, camera };
</script>
